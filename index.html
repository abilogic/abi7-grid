ents are called **synchronously** in order of subscription. Each event object contains a field `type` (event name). An exception in a handler does not interrupt the others: it turns into an event [`error`](#/api-events/event-error) with `source: 'listener'` (or `'plugin:name'`, if the subscriber is a plugin).\n\nSubscription `grid.on('*', (event, name) => ...)` receives **everything** events - convenient for debugging.\n\n## Order of events in typical scenarios\n\n| Scenario | Sequence |\n|---|---|\n| First launch | `data:load-start` → `data:load-end` → `layout:start` → `viewport:update` → `layout:end` → `ready` |\n| `setData(list)` | `data:load-start` → `data:load-end` → `layout:start` → `viewport:update` → `layout:end` |\n| `insert()` / `remove()` | `item:insert` (or `item:remove`) → (next frame) `layout:start` → `viewport:update` → `layout:end` |\n| Resizing a container | `resize` → `layout:start` → `viewport:update` → `layout:end` |\n| Scrolling | `scroll` (once per frame, when changing position), `viewport:update` — if the set of mounted elements has changed; after 140 ms of silence `scroll:stop` |\n| Drag & Drop | `drag:start` → `drag:move`… (+ `item:move` with each permutation) → `drag:end` |\n| `use()` / `unuse()` | `plugin:install` / `plugin:uninstall` |\n| `destroy()` | `destroy` → `plugin:uninstall` (for each plugin, `reason: 'destroy'`) |\n\nThe layout pass is always paired: for each `layout:start` exactly one comes `layout:end`. Several changes in one frame are combined into one pass (field `reasons` contains all the reasons).\n\n## Life cycle\n\n:::event ready\npurpose: The grid has completed the first layout and is ready to go.\nwhen: Once during the lifetime of the instance - after the first `layout:end`. If the container is hidden (width 0), the event is delayed until the size appears.\norder: After `layout:end` first pass.\npayload:\ntype | `string` | `'ready'`\ncount | `number` | Number of records.\ncancel: Not cancelable.\nexample:\ngrid.once('ready', (e) => console.log('cards:', e.count));\nrelated: `layout:end`, `whenReady()`.\n:::\n\n:::event destroy\npurpose: Grid began destruction.\nwhen: At the beginning `destroy()`, while the plugins and DOM have not yet been freed.\norder: First event `destroy()`; then — `plugin:uninstall` for each plugin.\npayload: —\ncancel: Not cancelable.\nexample:\ngrid.on('destroy', () => console.log('clean up your resources'));\nrelated: `plugin:uninstall`.\n:::\n\n:::event error\npurpose: A single channel for errors that occur within the core or plugins asynchronously / without calling code.\nwhen: Exception in event handler; data loader error; exception in `renderItem` / `releaseItem`; layout error; plugin cleanup error; deleting the active layout.\norder: Not tied to other events. If subscribers to `error` no, the error is written in `console.error`.\npayload:\ntype | `string` | `'error'`\nsource | `string` | `'listener'`, `'plugin:name'`, `'data'`, `'layout'`, `'renderItem'`, `'releaseItem'`, `'plugins'`\nmessage | `string` | Error text.\nerror | `Error` | Original exception.\nevent | `string` | For `listener` / `plugin:*` — the name of the event in whose handler an error occurred.\nphase | `string` | For plugins: `'cleanup'` if there is an error in the cleanup function.\nid, index | `string` or `number` | For `renderItem` / `releaseItem` — the record where the error occurred.\ncancel: Not cancelable. Exception inside a handler `error` does not cause recursion - it is written in `console.error`.\nexample:\ngrid.on('error', ({ source, message }) => reportToServer(source, message));\nrelated: `data:load-end` (field `error`), `plugin:install`.\n:::\n\n## Data\n\n:::event data:load-start\npurpose: Start of data set replacement.\nwhen: First boot, `setData()`, `load()`, `reload()` for the loader function, `rebuild({ data })`.\norder: Before `data:load-end`.\npayload:\ntype | `string` | `'data:load-start'`\nsource | `string` | `'initial'`, `'setData'`, `'load'`, `'reload'`, `'rebuild'`\ncancel: Not cancelable.\nexample:\ngrid.on('data:load-start', () => spinner.hidden = false);\nrelated: `data:load-end`.\n:::\n\n:::event data:load-end\npurpose: Data received (or download failed).\nwhen: After applying the data; an obsolete (preempted by a new load) response does not trigger the event.\norder: After `data:load-start`, before `layout:start`. If there is an error, it comes after `error`.\npayload:\ntype | `string` | `'data:load-end'`\nsource | `string` | Source as in `data:load-start`.\ncount | `number` | Number of records after loading.\nerror | `Error` | Only in case of error; the data is not changed.\ncancel: Not cancelable.\nexample:\ngrid.on('data:load-end', (e) => { spinner.hidden = true; if (e.error) showToast(e.error.message); });\nrelated: `data:load-start`, `layout:end`, `error`.\n:::\n\n:::event item:insert\npurpose: Records are inserted into the grid.\nwhen: After `insert()` (one event per call, regardless of the number of records).\norder: Before recalculating the geometry (`layout:start` will come in the next frame).\npayload:\ntype | `string` | `'item:insert'`\nitems | `Array<{ id, index, item }>` | All inserted records.\nid, index, item | — | Fields of the first inserted record (convenient when only one record is inserted).\ncount | `number` | How many records are inserted.\ncancel: Not cancelable.\nexample:\ngrid.on('item:insert', (e) => console.log('inserted', e.count, 'from position', e.index));\nrelated: `item:remove`, `layout:start`.\n:::\n\n:::event item:remove\npurpose: Entries have been deleted.\nwhen: After `remove()` (if something is actually deleted).\norder: Before `layout:start`.\npayload:\ntype | `string` | `'item:remove'`\nitems | `Array<{ id, index, item }>` | Deleted entries; `index` — position before deletion.\nid, index, item | — | First deleted entry.\ncount | `number` | How many records were deleted.\ncancel: Not cancelable.\nexample:\ngrid.on('item:remove', (e) => api.delete(e.items.map(i => i.id)));\nrelated: `item:insert`.\n:::\n\n:::event item:update\npurpose: Entry modified via `update()`.\nwhen: After `update()` existing entry.\norder: Until a possible recalculation of the geometry.\npayload:\ntype | `string` | `'item:update'`\nid, index | `string` or `number`, `number` | Record and its position.\nitem | `object` | New entry.\nprevious | `object` | Previous entry.\nchanged | `string[]` | Names of the modified fields.\ncancel: Not cancelable.\nexample:\ngrid.on('item:update', (e) => console.log(e.changed));\nrelated: `update()`.\n:::\n\n:::event item:move\npurpose: The entry has been moved to another position.\nwhen: `move()` or dragging (for each real permutation).\norder: In Drag & Drop - between `drag:start` and `drag:end`.\npayload:\ntype | `string` | `'item:move'`\nid | `string` or `number` | Record.\nfrom, to, index | `number` | Previous and new positions (`index === to`).\nitem | `object` | Record.\nsource | `string` | `'api'`, `'drag'`, `'drag-cancel'` (rollback on Escape).\ncancel: Not cancelable.\nexample:\ngrid.on('item:move', (e) => e.source === 'drag' && saveOrder(grid.data()));\nrelated: `drag:end`, `move()`.\n:::\n\n## Layout and window\n\n:::event layout:start\npurpose: Start of geometry recalculation.\nwhen: Before each layout pass.\norder: Paired with `layout:end`.\npayload:\ntype | `string` | `'layout:start'`\nreason | `string` | First reason: `'data'`, `'insert'`, `'remove'`, `'move'`, `'update'`, `'resize'`, `'refresh'`, `'layout'`, `'rebuild'`, `'reload'`, `'measure'`, `'plugin'`.\nreasons | `string[]` | All the reasons combined in this passage.\nfrom | `number` | The index from which the geometry is recalculated (partial recalculation).\ncount | `number` | Number of records.\ncancel: Not cancelable.\nexample:\ngrid.on('layout:start', (e) => console.time('layout:' + e.reason));\nrelated: `layout:end`.\n:::\n\n:::event layout:end\npurpose: The geometry is calculated, the DOM is updated.\nwhen: After each layout pass (after updating mounted elements).\norder: After `viewport:update`; in the first pass - before `ready`.\npayload:\ntype | `string` | `'layout:end'`\nreason, reasons, from, count | — | As in `layout:start`.\ncontentWidth, contentHeight | `number` | Content size, px.\nduration | `number` | Calculation duration, ms.\nanimated | `boolean` | Is lane change animation enabled?\ninfo | `object` | Layout data: Masonry — `columns`, `itemWidth`, `gapX`, `gapY`; Grid - the same + `rows`; Justified — `rows`; Horizontal — `itemHeight`.\ncancel: Not cancelable.\nexample:\ngrid.on('layout:end', (e) => console.log(e.info.columns, e.contentHeight));\nrelated: `layout:start`, `viewport:update`.\n:::\n\n:::event viewport:update\npurpose: The set of mounted DOM elements has changed.\nwhen: Scrolling, resizing, inserting/deleting, changing settings; after each layout pass.\norder: Inside the layout pass - after calculation, before `layout:end`.\npayload:\ntype | `string` | `'viewport:update'`\nmounted | `number` | How many elements are currently in the DOM.\npooled | `number` | How many elements are in the DOM Pool.\ntotal | `number` | Total entries.\ncreated, reused | `number` | How many DOM elements have been created and how many times have they been reused over time?\noverscan | `{ before, after }` | Current overscan, px (including adaptive).\nfirst, last | `number` | Indexes of the first and last mounted element (`-1`, if empty).\ncancel: Not cancelable.\nexample:\ngrid.on('viewport:update', (e) => stats.textContent = `${e.mounted} / ${e.total}`);\nrelated: `scroll`, `item:mount`.\n:::\n\n:::event scroll\npurpose: The scroll position has changed.\nwhen: No more than once per frame, after updating the window.\norder: After `viewport:update` the same frame.\npayload:\ntype | `string` | `'scroll'`\nscrollTop, scrollLeft | `number` | Position, px.\ndirection | `string` | `'forward'` or `'backward'`.\nvelocity | `number` | Smoothed velocity along the main axis, px/ms.\ncancel: Not cancelable.\nexample:\ngrid.on('scroll', (e) => progress.value = e.scrollTop);\nrelated: `scroll:stop`.\n:::\n\n:::event scroll:stop\npurpose: The scrolling has stopped.\nwhen: 140ms after the last scroll event.\norder: After the last `scroll`.\npayload:\ntype | `string` | `'scroll:stop'`\nscrollTop, scrollLeft | `number` | Position, px.\ncancel: Not cancelable.\nexample:\ngrid.on('scroll:stop', (e) => sessionStorage.setItem('y', e.scrollTop));\nrelated: `scroll`.\n:::\n\n:::event resize\npurpose: The container size has changed.\nwhen: Via ResizeObserver (if `autoResize: true`) or when `refresh()`.\norder: Before `layout:start` (if size affects layout).\npayload:\ntype | `string` | `'resize'`\nwidth, height | `number` | New container dimensions, px.\ncancel: Not cancelable.\nexample:\ngrid.on('resize', (e) => console.log(e.width));\nrelated: `layout:start`.\n:::\n\n:::event visibility:change\npurpose: The container entered or left the page's visibility area.\nwhen: Via IntersectionObserver (if available in the browser).\norder: Regardless of other events.\npayload:\ntype | `string` | `'visibility:change'`\nvisible | `boolean` | Is the container visible?\ncancel: Not cancelable.\nexample:\ngrid.on('visibility:change', (e) => e.visible ? video.play() : video.pause());\nrelated: `getState().visible`.\n:::\n\n:::event reach:end\npurpose: The window has moved towards the end of the content.\nwhen: When there's no more left to go `virtualization.endThreshold` px. Triggers once; again - only after the content has grown (for example, after `insert`) or the user has moved away.\norder: At the end of the window update.\npayload:\ntype | `string` | `'reach:end'`\nremaining | `number` | How many px are left until the end.\ncount | `number` | Number of records.\ncancel: Not cancelable.\nexample:\ngrid.on('reach:end', async () => grid.insert(await loadNextPage()));\nrelated: `insert()`, option `virtualization.endThreshold`.\n:::\n\n## DOM elements\n\n:::event item:mount\npurpose: The DOM element is bound to an entry (created or taken from the pool).\nwhen: When an entry appears in the window after the content has been rendered.\norder: Before `viewport:update`.\npayload:\ntype | `string` | `'item:mount'`\nid, index | `string` or `number`, `number` | Record.\nitem | `object` | Data recording.\nelement | `HTMLElement` | Knot. It will be reused - do not save the link.\ncancel: Not cancelable. The event is created only if there are subscribers.\nexample:\ngrid.on('item:mount', ({ element, item }) => element.title = item.title);\nrelated: `item:unmount`.\n:::\n\n:::event item:unmount\npurpose: The DOM element is unlinked from the entry and sent to the pool.\nwhen: When a record leaves the window (taking into account overscan), it is deleted or the grid is rebuilt.\norder: Before `item:mount` for the reused node.\npayload:\ntype | `string` | `'item:unmount'`\nid, index | `string` or `number`, `number` | Record.\nelement | `HTMLElement` | The node that will now be removed from the DOM.\ncancel: Not cancelable.\nexample:\ngrid.on('item:unmount', ({ element }) => element.querySelector('video')?.pause());\nrelated: `item:mount`.\n:::\n\n:::event item:visible\npurpose: The recording entered the visible area (without overscan).\nwhen: After updating the window; the event is created only if there are subscribers to `item:visible` or `item:hidden`.\norder: After `viewport:update`-processing, until `scroll`.\npayload:\ntype | `string` | `'item:visible'`\nid, index | `string` or `number`, `number` | Record.\nitem | `object` | Data recording.\nelement | `HTMLElement` | Knot.\ncancel: Not cancelable.\nexample:\ngrid.on('item:visible', (e) => analytics.impression(e.id));\nrelated: `item:hidden`, `getVisibleItems()`.\n:::\n\n:::event item:hidden\npurpose: The recording has left the visible area.\nwhen: Paired event to `item:visible`.\norder: Together with `item:visible` in one update (first `visible`, then `hidden`).\npayload:\ntype | `string` | `'item:hidden'`\nid | `string` or `number` | Record.\nindex | `number` | Index or `-1`, if the entry is deleted.\ncancel: Not cancelable.\nexample:\ngrid.on('item:hidden', (e) => analytics.leave(e.id));\nrelated: `item:visible`.\n:::\n\n## Interaction\n\n:::event item:click\npurpose: Click on the card.\nwhen: Native `click` inside the card. Not called if dragging has ended immediately before, and when `interaction.click: false`.\norder: Handlers are called in order of subscription; plugins (such as Selection and Lightbox) are also common subscribers.\npayload:\ntype | `string` | `'item:click'`\nid, index | `string` or `number`, `number` | Card.\nitem | `object` | Data recording.\nelement | `HTMLElement` | DOM node of the card.\noriginalEvent | `MouseEvent` | Initial event (`ctrlKey`, `shiftKey`, …).\ndefaultPrevented | `boolean` | `true`if someone called `preventDefault()`.\npreventDefault | `function` | Marks the click as processed.\ncancel: Cancellable: `event.preventDefault()` tells plugins (Selection, Lightbox, Counter) that the click has been processed. The browser's native behavior is not overridden.\nexample:\ngrid.on('item:click', (e) => { if (e.item.locked) e.preventDefault(); });\nrelated: `item:dblclick`, `item:contextmenu`.\n:::\n\n:::event item:dblclick\npurpose: Double click on the card.\nwhen: Native `dblclick`.\norder: After two `item:click`.\npayload:\ntype | `string` | `'item:dblclick'`\nid, index, item, element, originalEvent, defaultPrevented, preventDefault | — | Like `item:click`.\ncancel: Cancellable (flag for other subscribers).\nexample:\ngrid.on('item:dblclick', (e) => openEditor(e.item));\nrelated: `item:click`.\n:::\n\n:::event item:contextmenu\npurpose: Context menu on the card.\nwhen: Native `contextmenu`.\norder: Regardless.\npayload:\ntype | `string` | `'item:contextmenu'`\nid, index, item, element, originalEvent, defaultPrevented, preventDefault | — | Like `item:click`.\ncancel: Cancellable: `event.preventDefault()` suppresses the browser's native context menu.\nexample:\ngrid.on('item:contextmenu', (e) => { e.preventDefault(); showMenu(e.originalEvent.clientX, e.originalEvent.clientY, e.id); });\nrelated: `item:click`.\n:::\n\n:::event drag:start\npurpose: Start dragging the card.\nwhen: Mouse - after moving to `interaction.drag.threshold` px; touch - after a long press `delay` ms. Only when `interaction.drag.enabled: true`.\norder: The first event of the drag session.\npayload:\ntype | `string` | `'drag:start'`\nid, index, item, element | — | Dragging card.\nclientX, clientY | `number` | Pointer position.\npointerType | `string` | `'mouse'`, `'touch'`, `'pen'`.\noriginalEvent | `PointerEvent` | Event `pointerdown`.\ncancel: Cancellable: `preventDefault()` cancels dragging.\nexample:\ngrid.on('drag:start', (e) => { if (e.item.pinned) e.preventDefault(); });\nrelated: `drag:move`, `drag:end`.\n:::\n\n:::event drag:move\npurpose: The pointer moved while you were dragging.\nwhen: At every `pointermove` and when autoscrolling.\norder: Between `drag:start` and `drag:end`.\npayload:\ntype | `string` | `'drag:move'`\nid | `string` or `number` | Card.\nindex, fromIndex | `number` | Current and starting positions.\noverIndex | `number` | Card index under the index or `-1`.\nclientX, clientY | `number` | Pointer position.\noutside | `boolean` | Pointer outside the container (using Connected Grids).\npointerType | `string` | Pointer type.\ncancel: Not cancelable.\nexample:\ngrid.on('drag:move', (e) => hint.hidden = !e.outside);\nrelated: `item:move`.\n:::\n\n:::event drag:end\npurpose: The drag and drop is completed or cancelled.\nwhen: `pointerup`, `pointercancel`, Escape, window loses focus.\norder: Last event of the drag session. When canceling (Escape, etc.) the order is rolled back — `item:move` with `source: 'drag-cancel'` — happens before `drag:end`.\npayload:\ntype | `string` | `'drag:end'`\nid | `string` or `number` | Card.\nfromIndex, toIndex | `number` | Positions before and after (if canceled are equal).\nmoved | `boolean` | Has the order changed?\ncancelled | `boolean` | Cancel (Escape, `pointercancel`, blur).\noutside | `boolean` | Completed outside the container.\nclientX, clientY, pointerType | — | Pointer data.\ncancel: Not cancelable.\nexample:\ngrid.on('drag:end', (e) => { if (e.moved) saveOrder(grid.data().map(p => p.id)); });\nrelated: `drag:start`, `item:move`.\n:::\n\n## Plugins\n\n:::event plugin:install\npurpose: The plugin is installed.\nwhen: Immediately after a successful `install()`.\norder: After all plugin registrations.\npayload:\ntype | `string` | `'plugin:install'`\nname | `string` | Plugin name.\nversion | `string` | Plugin version.\ncancel: Not cancelable.\nexample:\ngrid.on('plugin:install', (e) => console.log(e.name, e.version));\nrelated: `plugin:uninstall`.\n:::\n\n:::event plugin:uninstall\npurpose: The plugin is disabled.\nwhen: After the function of cleaning the plugin and removing all its subscriptions.\norder: When `destroy()` comes for each plugin (in reverse order of installation).\npayload:\ntype | `string` | `'plugin:uninstall'`\nname, version | `string` | Plugin.\nreason | `string` | `'unuse'` or `'destroy'`.\ncancel: Not cancelable.\nexample:\ngrid.on('plugin:uninstall', (e) => console.log(e.name, e.reason));\nrelated: `plugin:install`.\n:::\n\n## Built-in plugin events\n\n| Event | Plugin | Arguments | Cancel |\n|---|---|---|---|\n| `selection:change` | selection | `selected`, `added`, `removed`, `source` | no |\n| `lightbox:before-open` | lightbox | `id` | yes |\n| `lightbox:open` | lightbox | `id`, `index` | no |\n| `lightbox:change` | lightbox | `id`, `index`, `previousId` | no |\n| `lightbox:close` | lightbox | `id` | no |\n| `connected-grids:before-transfer` | connected-grids | `id`, `record`, `from`, `to` | yes |\n| `connected-grids:transfer` | connected-grids | `id`, `newId`, `record`, `copy`, `index`, `from`, `to` | no |\n| `connected-grids:receive` | connected-grids | `id`, `from`, `record`, `index` | no |\n",Q="# API Reference: Methods\n\nAll public methods of the class `ABI7Grid`. Unless otherwise stated, methods are thrown `ABI7Error` with `code: 'DESTROYED'`, when called on a destroyed instance. List of sections: [Constructor](#/api-methods/constructor), [Lifecycle](#/api-methods/lifecycle), [Data](#/api-methods/data), [Items](#/api-methods/items), [Navigation](#/api-methods/navigation), [Plugins](#/api-methods/plugins), [Events](#/api-methods/events), [State](#/api-methods/state), [Static](#/api-methods/static), [Deprecated](#/api-methods/deprecated).\n\n> Types in tables: `id` — `string` or `number` (strict comparison: `'1'` and `1` — different id); `Item` — element description object `{ id, index, data, rect, element, visible }`; `Rect` — `{ id, index, x, y, width, height, right, bottom }`.\n\n## Constructor\n\n:::method new ABI7Grid(target, options)\npurpose: Creates a grid instance on a container. This is the library's only entry point.\nsyntax:\nconst grid = new ABI7Grid('#gallery', { layout: 'masonry', data: photos });\nparams:\ntarget | `string` or `HTMLElement` | mandatory | CSS selector or element. The element must be empty and have a height (aka a scroll container).\noptions | `object` | `{}` | Settings, see [Options](#/api-options). Merge with default values.\nreturns: Instance `ABI7Grid`.\ninside: The constructor checks the options, adds a class to the container `abi7-grid`, creates an inner layer `.abi7-container`, remembers the original container attributes (`class`, `style`, `tabindex`, `role`, `aria-label`) and creates all internal components. The first layout is executed asynchronously (in microtask), so that after the constructor you can synchronously call `use()` and subscribe to events. If `layout` has not yet been registered (layout plugin), the grid is waiting for its registration.\nuse: Once per container. To get the moment of readiness, use the event `ready` or `whenReady()`.\nlimits: There cannot be two live instances on one element. The container must have a limited height. Container children are not imported as cards (unlike the old version).\nerrors: `INVALID_ELEMENT` — element not found. `INVALID_OPTION` — invalid option value. `ALREADY_INITIALIZED` — the element already has a grid.\nexample:\nconst grid = new ABI7Grid('#gallery', {\n  layout: 'masonry',\n  data: photos,\n  layoutOptions: { gap: 12, minWidth: 180 }\n});\ngrid.on('ready', () => console.log('ready'));\nrelated: `whenReady()`, `destroy()`, event `ready`.\n:::\n\n## Lifecycle\n\n:::method grid.render([done])\npurpose: Starts the grid if `autoRender: false`; on a running grid is equivalent to `refresh()`.\nsyntax:\ngrid.render();\ngrid.render((grid) => console.log('ready'));\nparams:\ndone | `function` | — | Deprecated callback in the style of the old version; called after an event `ready`. Preferably `whenReady()`.\nreturns: `this` (for chains).\ninside: Connects scroll listeners, ResizeObserver and IntersectionObserver, installs plugins from `options.plugins`, creates a layout engine and starts loading data from `options.data`.\nuse: Only when `autoRender: false`, when you need to delay the launch (for example, until the CSS is loaded).\nlimits: A repeated call does not recreate the grid - it only rebuilds the geometry.\nerrors: `DESTROYED`.\nexample:\nconst grid = new ABI7Grid('#gallery', { data: photos, autoRender: false });\ngrid.use(SelectionPlugin);\ngrid.render();\nrelated: `refresh()`, `whenReady()`, event `ready`.\n:::\n\n:::method grid.refresh([done])\npurpose: Remeasures the container and recalculates the geometry of all elements.\nsyntax:\ngrid.refresh();\nparams:\ndone | `function` | — | Deprecated callback; called immediately after recalculation.\nreturns: `this`.\ninside: Reads `clientWidth/clientHeight` container, marks all geometry obsolete (reason `refresh`), synchronously performs recalculation, updates the set of mounted elements and calls `layout:start` → `viewport:update` → `layout:end`.\nuse: If the container has changed size and `autoResize: false`; after changing CSS that affects dimensions; after showing the hidden container.\nlimits: Full recalculation is O(n) based on the number of records. When `autoResize: true` there is usually no need to call it manually. Before `render()` doesn't do anything.\nerrors: `DESTROYED`.\nexample:\n// The container was hidden (display: none) and shown manually:\npanel.hidden = false;\ngrid.refresh();\nrelated: `rebuild()`, `flush()`, `autoResize`, events `layout:start`, `layout:end`.\n:::\n\n:::method grid.rebuild([options], [done])\npurpose: Applies new settings to the running grid.\nsyntax:\ngrid.rebuild({ layout: 'justified', layoutOptions: { targetRowHeight: 200 } });\nparams:\noptions | `object` | `{}` | Partial set of options. Nested objects (`layoutOptions`, `virtualization`, `animation`, `interaction`) are merged with the current ones. If specified `data`, the data is downloaded again.\ndone | `function` | — | Deprecated callback; called after recalculation.\nreturns: `this`.\ninside: Combines options and rechecks them. If they have changed `layout` / `layoutOptions` — creates a new layout engine; changes `renderItem`, `itemTag`, `fields`, `virtualization` etc. reset the DOM pool and recreate the elements. The geometry is recalculated entirely. For layout changes, animation is enabled and the scroll anchor is saved.\nuse: Changing layout, changing gap/minWidth/columns, virtualization settings, enabling Drag & Drop.\nlimits: The key cannot be “removed” by a union—set a new value. The data remains the same (unless transferred `data`).\nerrors: `INVALID_OPTION`; `DESTROYED`.\nexample:\nslider.oninput = () => grid.rebuild({ layoutOptions: { gap: Number(slider.value) } });\nrelated: `refresh()`, [Options](#/api-options), events `layout:end`.\n:::\n\n:::method grid.reload()\npurpose: Reloads data (if `data` — function) or resets scrolling and redraws cards.\nsyntax:\nawait grid.reload();\nparams: —\nreturns: `Promise<ABI7Grid>`. Not rejected: bootloader errors come to event `error`.\ninside: If `options.data` — function, it is called again (with `AbortSignal`), the previous incomplete download is cancelled. Otherwise: scrolling is reset to the beginning, cards are re-linked, geometry is recalculated.\nuse: “Update” button for lists with server loading.\nlimits: The response of the legacy load (launched earlier) is ignored - there are no races.\nerrors: `DESTROYED`.\nexample:\nconst grid = new ABI7Grid('#gallery', { data: ({ signal }) => fetch('/api/photos', { signal }).then(r => r.json()) });\nrefreshBtn.onclick = () => grid.reload();\nrelated: `load()`, `setData()`, events `data:load-start`, `data:load-end`.\n:::\n\n:::method grid.destroy()\npurpose: Completely destroys the instance and returns the container to its original state.\nsyntax:\ngrid.destroy();\nparams: —\nreturns: `undefined`. Recalling is safe.\ninside: Order: event `destroy` → clearing all plugins (in reverse installation order) → canceling drag → canceling current loading → disabling ResizeObserver/IntersectionObserver → deleting DOM elements and pool → `AbortController.abort()` for all listeners → cancel timers and `requestAnimationFrame` → removing a layer `.abi7-container` → restoration of the original container attributes → cleaning of subscribers. Waiting `whenReady()` are rejected.\nuse: When deleting a page/component (SPA), before re-creating the grid on the same element.\nlimits: After `destroy()` changing methods throw `DESTROYED`; `getState()`, `isDestroyed()`, `off()` continue to work.\nerrors: Doesn't quit.\nexample:\nwindow.addEventListener('pagehide', () => grid.destroy());\nrelated: `isDestroyed()`, `unuse()`, event `destroy`.\n:::\n\n:::method grid.flush()\npurpose: Synchronously performs deferred layout and window updating.\nsyntax:\ngrid.insert(item);\ngrid.flush();\nparams: —\nreturns: `this`.\ninside: Data changes mark the geometry as obsolete and schedule recalculation for the next frame (`requestAnimationFrame`), combining multiple changes into one pass. `flush()` executes this pass immediately.\nuse: When immediately after changing the data you need the current DOM (tests, measurements). Methods for reading geometry (`getItem`, `scrollToIndex`, Plugin API `geometry.*`) cause the layout themselves.\nlimits: Not needed in normal application code.\nerrors: —\nexample:\ngrid.insert(photo);\ngrid.flush();\nconsole.log(grid.getState().virtualization.mounted);\nrelated: `refresh()`, event `layout:end`.\n:::\n\n:::method grid.whenReady()\npurpose: Returns a Promise that is executed after the first layout.\nsyntax:\nawait grid.whenReady();\nparams: —\nreturns: `Promise<ABI7Grid>`. If the grid is destroyed before it is ready, it is rejected `ABI7Error('DESTROYED')`.\ninside: While the grid is not ready, calls are queued; upon event `ready` the queue is running.\nuse: When you need to execute the code after the first geometry appears.\nlimits: If the container is hidden (width 0) or the layout is not registered, the Promise waits until this changes.\nerrors: `DESTROYED` (rejection).\nexample:\nconst grid = new ABI7Grid('#gallery', { data: photos });\nawait grid.whenReady();\ngrid.scrollToIndex(100);\nrelated: event `ready`, `getState().ready`.\n:::\n\n## Data\n\n:::method grid.data([list])\npurpose: Without arguments, returns a copy of an array of records; with an array, it replaces the data (the same as `setData`).\nsyntax:\nconst records = grid.data();\ngrid.data(newList);\nparams:\nlist | `object[]` | — | New set of records. Without an argument, the method acts as a getter.\nreturns: Getter: `object[]` (a copy of the array; the objects themselves are the same). Setter: `this`.\ninside: Records are stored in `DataStore` in parallel with the id array; getter gives `slice()`.\nuse: To read the current order of entries, for example after Drag & Drop.\nlimits: Records without a field `id` get the internal id of the view `abi7-1`; it is not stored in the objects themselves (read `getItems()[i].id`).\nerrors: `INVALID_DATA`, `DUPLICATE_ID`.\nexample:\ngrid.on('drag:end', () => localStorage.setItem('order', JSON.stringify(grid.data().map(p => p.id))));\nrelated: `setData()`, `getItems()`.\n:::\n\n:::method grid.setData(list)\npurpose: Completely replaces the data set.\nsyntax:\ngrid.setData(photos);\nparams:\nlist | `object[]` | mandatory | New entries. The array is copied (`slice`), but objects are not cloned or modified.\nreturns: `this`.\ninside: Checks entries and id uniqueness, cancels current asynchronous loading, resets size cache and element classes, sets scrolling reset, renames mounted elements to new entries (DOM is reused) and schedules a full recalculation. Events: `data:load-start` → `data:load-end` → `layout:start` → `layout:end`.\nuse: Changing the data set, filtering, searching.\nlimits: The Selection plugin selection is reset (id may have disappeared). For async source use `load()`.\nerrors: `INVALID_DATA` (not an array / not an object in an array), `DUPLICATE_ID`, `INVALID_ID`. If there is an error, the data does not change, but `data:load-end` contains a field `error`.\nexample:\nsearchInput.oninput = () => grid.setData(all.filter(p => p.title.includes(searchInput.value)));\nrelated: `load()`, `insert()`, events `data:load-start`, `data:load-end`.\n:::\n\n:::method grid.load(source)\npurpose: Asynchronous data loading: function, Promise or array.\nsyntax:\nawait grid.load(({ signal }) => fetch('/api/photos', { signal }).then(r => r.json()));\nparams:\nsource | `function` or `Promise` or `object[]` | mandatory | The function gets `{ signal: AbortSignal, source: string }` and returns an array or Promise of an array.\nreturns: `Promise<ABI7Grid>`; never deviates.\ninside: Each call increments the internal load token and aborts `AbortController` previous one. The result is applied only if the token is valid and the grid is not destroyed - this is protection against races. The error (exception, reject, invalid format) turns into `data:load-end` with field `error` and event `error`.\nuse: Data from the server, pagination “with replacement”.\nlimits: For additional loading “at the end” use `insert()`.\nerrors: `DESTROYED`. Bootloader errors - only via event `error`.\nexample:\ngrid.on('error', (e) => console.warn(e.source, e.message));\nawait grid.load(async ({ signal }) => (await fetch('/api/photos', { signal })).json());\nrelated: `reload()`, `setData()`, events `data:load-start`, `data:load-end`, `error`.\n:::\n\n:::method grid.insert(items, [options])\npurpose: Inserts one or more records.\nsyntax:\ngrid.insert(photo);\ngrid.insert([a, b], { at: 'start' });\nparams:\nitems | `object` or `object[]` | mandatory | A record or array of records.\noptions.at | `number` or `'start'` or `'end'` | `'end'` | Insertion position.\nreturns: `Array<string|number>` — id of the inserted records (an empty array for an empty list).\ninside: Fixes the scroll anchor, inserts records, reindexes mounted elements, marks geometry obsolete starting from the insertion position (partial recalculation) and calls once `item:insert`.\nuse: Loading data pages (`at: 'end'`), adding a new card.\nlimits: If the window is scrolled down, inserting above the window does not shift the visible content (Scroll Anchoring). When `scrollTop = 0` the new card is visible immediately.\nerrors: `DUPLICATE_ID`, `INVALID_DATA`, `INVALID_ARGUMENT` (incorrect `at`).\nexample:\ngrid.on('reach:end', async () => grid.insert(await fetchNextPage()));\nrelated: `remove()`, `move()`, event `item:insert`, event `reach:end`.\n:::\n\n:::method grid.remove(idOrIds)\npurpose: Deletes a record or several records by id.\nsyntax:\ngrid.remove('photo-1');\ngrid.remove(['a', 'b']);\nparams:\nidOrIds | `id` or `id[]` | mandatory | IDs of records to be deleted. Non-existent ones are ignored.\nreturns: `number` — how many records were deleted.\ninside: Removes entries from storage, resets associated caches and pins, unmounts the DOM, schedules a partial recalculation from the position of the first removed entry, and calls once `item:remove`.\nuse: Removing a card, recycle bin, transferring to another grid.\nlimits: The event is not raised if nothing is deleted.\nerrors: `DESTROYED`.\nexample:\nconst removed = grid.remove(selection.getSelected());\nrelated: `insert()`, event `item:remove`.\n:::\n\n:::method grid.update(id, patch)\npurpose: Updates the fields of a record.\nsyntax:\ngrid.update('photo-1', { title: 'New', height: 500 });\nparams:\nid | `id` | mandatory | Record ID.\npatch | `object` | mandatory | Changeable fields. The record object itself is not mutated—a copy of it is created with the same prototype.\nreturns: `boolean` — `false`, if there is no record.\ninside: If the fields that affect the size have changed (`width`, `height`, `aspectRatio` according to `fields`), the geometry is recalculated from this record; in any case, the card is redrawn and called `item:update`.\nuse: Change signature, sizes, any user data.\nlimits: Change `id` it is impossible.\nerrors: `INVALID_ID` (attempt to change id), `INVALID_DATA`.\nexample:\ngrid.update('photo-3', { title: 'Sunset', width: 1200, height: 800 });\nrelated: event `item:update`, option `fields`.\n:::\n\n:::method grid.move(id, toIndex)\npurpose: Moves a record to a new position.\nsyntax:\ngrid.move('photo-5', 0);\nparams:\nid | `id` | mandatory | Identifier.\ntoIndex | `number` | mandatory | New index (limited by range).\nreturns: `boolean` — `false`, if the record is not found or the position has not changed.\ninside: Rearrangement in storage, DOM reindexing, partial recalculation with `min(from, to)`, animation, event `item:move` (`source: 'api'`). Drag & Drop works the same way.\nuse: Sorting, “lift to the top.”\nlimits: The new order is stored only in the grid; save it yourself (`data()`).\nerrors: `DESTROYED`.\nexample:\ngrid.move('photo-9', 0);\nrelated: event `item:move`, Drag & Drop.\n:::\n\n:::method grid.getCount()\npurpose: Number of records.\nsyntax:\nconst n = grid.getCount();\nparams: —\nreturns: `number`.\ninside: Length of the internal record array.\nuse: Statistics, checks.\nlimits: Does not depend on virtualization (this is the number of all records, not DOM elements).\nerrors: —\nexample:\ncounter.textContent = grid.getCount();\nrelated: `getState()`.\n:::\n\n## Items\n\n:::method grid.getItem(id)\npurpose: Returns a description of the element.\nsyntax:\nconst item = grid.getItem('photo-1');\nparams:\nid | `id` | mandatory | Identifier.\nreturns: `Item` or `null`. Fields: `id`, `index`, `data` (record), `rect` (`Rect`), `element` (`HTMLElement` or `null`, if the card is not currently in the DOM), `visible` (`boolean`whether the card crosses the window without overscan).\ninside: If the geometry is out of date, deferred nesting is performed first.\nuse: Find out the coordinates, size and current state of the card.\nlimits: Copies of coordinates are returned (`rect` — photo). `element` changes when the DOM is reused - don't store it.\nerrors: —\nexample:\nconst { rect, visible } = grid.getItem('photo-7');\nrelated: `getItems()`, `getVisibleItems()`.\n:::\n\n:::method grid.getItems()\npurpose: Descriptions of all elements in order of data.\nsyntax:\nconst all = grid.getItems();\nparams: —\nreturns: `Item[]` (see `getItem`).\ninside: For each record, a description object is created - an O(n) operation.\nuse: Debugging, small sets, order export.\nlimits: For tens of thousands of records, call rarely; use `getVisibleItems()` or `data()`.\nerrors: —\nexample:\nconst order = grid.getItems().map(i => i.id);\nrelated: `getItem()`, `data()`.\n:::\n\n:::method grid.getVisibleItems()\npurpose: Elements located in the visible area (without overscan).\nsyntax:\nconst visible = grid.getVisibleItems();\nparams: —\nreturns: `Item[]`, everyone `visible: true` and `element` (DOM node).\ninside: The query to the spatial index of the geometry is O(k), k is the number of visible ones.\nuse: Highlighting, impression analytics, lazy actions.\nlimits: Takes into account the current scroll position; after programmatic scrolling, the result is immediately relevant.\nerrors: —\nexample:\nconst ids = grid.getVisibleItems().map(i => i.id);\nrelated: events `item:visible`, `item:hidden`.\n:::\n\n## Navigation\n\n:::method grid.scrollToIndex(index, [options])\npurpose: Scrolls so that the element at the given index is in the window.\nsyntax:\ngrid.scrollToIndex(500);\ngrid.scrollToIndex(500, { align: 'center', behavior: 'smooth' });\nparams:\nindex | `number` | mandatory | Record index.\noptions.align | `'start'`, `'center'`, `'end'`, `'nearest'` | `'start'` | Aligning an element in a window.\noptions.offset | `number` | `0` | Additional offset, px.\noptions.behavior | `'auto'`, `'smooth'` | `'auto'` | Scroll mode.\nreturns: `boolean` — `false`, if the index is out of range.\ninside: The coordinates are taken from the finished geometry; no DOM is created for intermediate elements. The scroll axis is determined by the layout (vertical or horizontal). The value is limited by the size of the content.\nuse: “Go to card”, position restoration, search.\nlimits: For layout with measured height (`virtualization.measure`) coordinates are specified after measurement.\nerrors: `DESTROYED`.\nexample:\ngrid.scrollToIndex(1200, { align: 'center' });\nrelated: `scrollToItem()`, `getVisibleItems()`.\n:::\n\n:::method grid.scrollToItem(id, [options])\npurpose: Same as `scrollToIndex`, but by id.\nsyntax:\ngrid.scrollToItem('photo-500', { align: 'nearest' });\nparams:\nid | `id` | mandatory | Identifier.\noptions | `object` | `{}` | See `scrollToIndex`.\nreturns: `boolean` — `false`, if id is not found.\ninside: Translates id into index and calls `scrollToIndex`.\nuse: When the id is known, not the position.\nlimits: —\nerrors: `DESTROYED`.\nexample:\ngrid.scrollToItem(selection.getSelected()[0]);\nrelated: `scrollToIndex()`.\n:::\n\n## Plugins\n\n:::method grid.use(plugin, [options])\npurpose: Installs the plugin.\nsyntax:\ngrid.use(SelectionPlugin, { multiple: true });\nparams:\nplugin | `object` | mandatory | Plugin object: `name`, `version`, `apiVersion`, `install(api, options)`.\noptions | `object` | `{}` | Plugin options; unite with `plugin.defaults`.\nreturns: `this`.\ninside: Checks contract and compatibility `apiVersion` with the core API version, presence of dependencies and duplicate, creates an isolated Plugin API, calls `install()`. Everything that the plugin has registered via the API is tracked. If there is an error in `install()` a rollback is performed (subscriptions, features, layout), the exception is thrown. After success - event `plugin:install`.\nuse: Connecting functionality and layout plugins.\nlimits: `install()` must be synchronous. You cannot install two plugins with the same name.\nerrors: `PluginError` with codes `PLUGIN_INVALID`, `PLUGIN_INCOMPATIBLE`, `PLUGIN_DUPLICATE`, `PLUGIN_DEPENDENCY`, `PLUGIN_INSTALL_FAILED`, `PLUGIN_FEATURE_CONFLICT`.\nexample:\ntry { grid.use(LightboxPlugin, { loop: true }); }\ncatch (e) { console.error(e.code, e.message); }\nrelated: `unuse()`, `getPlugin()`, [Plugin API](#/api-plugin), event `plugin:install`.\n:::\n\n:::method grid.unuse(name)\npurpose: Disables the plugin.\nsyntax:\ngrid.unuse('selection');\nparams:\nname | `string` | mandatory | Plugin name.\nreturns: `boolean` — `false`, if the plugin is not installed.\ninside: The cleanup function returned is called `install()`; then all subscriptions, features, layout and disposables are removed in reverse order. In progress `plugin:uninstall` with `reason: 'unuse'`. If the active layout belonged to the plugin, the grid switches to `masonry` and sends `error` with code `LAYOUT_REMOVED`.\nuse: Dynamically disabling features.\nlimits: You cannot disable a plugin that another one depends on (`PLUGIN_REQUIRED`).\nerrors: `PluginError` `PLUGIN_REQUIRED`.\nexample:\ngrid.unuse('lightbox');\nrelated: `use()`, event `plugin:uninstall`.\n:::\n\n:::method grid.getPlugin(name)\npurpose: Returns the public interface of the plugin.\nsyntax:\nconst selection = grid.getPlugin('selection');\nparams:\nname | `string` | mandatory | Feature name (usually the same as the plugin name).\nreturns: Object registered via `api.features.register(name, impl)`, or `null`.\ninside: Search the features registry for a given instance.\nuse: Call plugin methods.\nlimits: A plugin that has not registered a feature returns `null` — check `hasPlugin()`.\nerrors: —\nexample:\ngrid.getPlugin('selection')?.selectAll();\nrelated: `hasPlugin()`, `getPlugins()`.\n:::\n\n:::method grid.hasPlugin(name)\npurpose: Checks if the plugin is installed.\nsyntax:\nif (grid.hasPlugin('lightbox')) { /* ... */ }\nparams:\nname | `string` | mandatory | Plugin name.\nreturns: `boolean`.\ninside: Search the registry of installed plugins.\nuse: Conditional logic.\nlimits: —\nerrors: —\nexample:\nif (!grid.hasPlugin('selection')) grid.use(SelectionPlugin);\nrelated: `getPlugins()`.\n:::\n\n:::method grid.getPlugins()\npurpose: List of installed plugins.\nsyntax:\nconsole.table(grid.getPlugins());\nparams: —\nreturns: `Array<{ name, version, apiVersion, options }>` in order of installation.\ninside: Registry snapshot.\nuse: Debugging.\nlimits: `options` — frozen object.\nerrors: —\nexample:\ngrid.getPlugins().map(p => p.name);\nrelated: `use()`, `unuse()`.\n:::\n\n## Events\n\n:::method grid.on(eventName, callback)\npurpose: Subscribe to the event.\nsyntax:\nconst off = grid.on('item:click', (event) => console.log(event.id));\nparams:\neventName | `string` | mandatory | Event name or `'*'` (all events; callback gets `(event, name)`).\ncallback | `function` | mandatory | Handler `(event, name) => void`.\nreturns: `function` — call her to unsubscribe.\ninside: Handlers are called in order of subscription. The exception in the handler is caught and turned into an event `error` (`source: 'listener'`), the remaining handlers are executed.\nuse: Reaction to any grid and plugin events.\nlimits: The handler should not be asynchronous \"long\" - events are called synchronously. Subscribers are cleared when `destroy()`.\nerrors: `TypeError` — invalid name or not a function.\nexample:\nconst off = grid.on('layout:end', e => console.log(e.info));\noff();\nrelated: `off()`, `once()`, [Events](#/api-events).\n:::\n\n:::method grid.once(eventName, callback)\npurpose: Subscription for one trigger.\nsyntax:\ngrid.once('ready', () => console.log('first layout'));\nparams:\neventName | `string` | mandatory | Event name.\ncallback | `function` | mandatory | Handler.\nreturns: `function` — unsubscribe before triggering.\ninside: The handler is removed before being called.\nuse: One-time actions.\nlimits: —\nerrors: `TypeError`.\nexample:\ngrid.once('layout:end', () => grid.scrollToIndex(10));\nrelated: `on()`, `off()`.\n:::\n\n:::method grid.off(eventName, callback)\npurpose: Processor unsubscribe.\nsyntax:\ngrid.off('item:click', handler);\nparams:\neventName | `string` | mandatory | Event name.\ncallback | `function` | mandatory | The same function that was passed to `on()`.\nreturns: `boolean` — whether the handler was found.\ninside: One (last signed) instance of the function is deleted.\nuse: Unsubscribe using a link to a function.\nlimits: Anonymous functions cannot be unsubscribed in this way - save the return value `on()`.\nerrors: —\nexample:\nconst handler = (e) => {};\ngrid.on('scroll', handler);\ngrid.off('scroll', handler);\nrelated: `on()`, `once()`.\n:::\n\n## State\n\n:::method grid.getState()\npurpose: Snapshot of the grid state.\nsyntax:\nconst state = grid.getState();\nparams: —\nreturns: Object: `phase` (`'new'`, `'loading'`, `'pending'`, `'ready'`, `'destroyed'`), `ready`, `destroyed`, `loading`, `hidden`, `visible`, `layout`, `pendingLayout`, `axis`, `count`, `contentWidth`, `contentHeight`, `layoutInfo` (what the layout returned), `viewport` (`scrollLeft`, `scrollTop`, `width`, `height`, `axis`, `overscan`), `virtualization` (`enabled`, `mounted`, `pooled`, `created`, `reused`, `pinned`, `velocity`, `overscan`), `plugins` (names).\ninside: It is assembled from internal counters without DOM traversal.\nuse: Debugging, statistics panels, tests.\nlimits: This is a copy: changing the result does not affect the grid.\nerrors: —\nexample:\nconst { mounted, pooled, created, reused } = grid.getState().virtualization;\nrelated: `isDestroyed()`.\n:::\n\n:::method grid.isDestroyed()\npurpose: Checking that the instance has been destroyed.\nsyntax:\nif (!grid.isDestroyed()) grid.refresh();\nparams: —\nreturns: `boolean`.\ninside: Reads the lifecycle flag.\nuse: Asynchronous code that could survive the grid.\nlimits: —\nerrors: —\nexample:\nfetchPhotos().then(list => { if (!grid.isDestroyed()) grid.setData(list); });\nrelated: `destroy()`.\n:::\n\n## Static\n\n:::method ABI7Grid.registerLayout(name, definition, [options])\npurpose: Globally registers a layout that is available to all grids on the page.\nsyntax:\nABI7Grid.registerLayout('horizontal', HorizontalLayout);\nparams:\nname | `string` | mandatory | Name for `options.layout`.\ndefinition | `object` | mandatory | Definition of layout (`create()` or `compute()`) or a plugin object with a field `layout`.\noptions.override | `boolean` | `false` | Allow replacement of existing layout.\nreturns: `undefined`.\ninside: The definition is normalized (`axis`, `responsive`, `defaults`), placed in the global registry; The grid waiting for this layout automatically continues to run.\nuse: Several grids need the Layout plugin.\nlimits: Built-in layouts can only be replaced with `override: true`.\nerrors: `INVALID_LAYOUT`, `LAYOUT_EXISTS`.\nexample:\nABI7Grid.registerLayout('stack', { compute(ctx) { /* ... */ } });\nrelated: `unregisterLayout()`, `getLayouts()`, [Layout API](#/api-plugin/layout-api).\n:::\n\n:::method ABI7Grid.unregisterLayout(name)\npurpose: Deletes a globally registered layout.\nsyntax:\nABI7Grid.unregisterLayout('horizontal');\nparams:\nname | `string` | mandatory | Name layout.\nreturns: `boolean`.\ninside: Removal from the global registry. Already running grids retain the created engine.\nuse: Tests, dynamic extensions.\nlimits: Built-in layouts are not deleted.\nerrors: `LAYOUT_BUILTIN`.\nexample:\nABI7Grid.unregisterLayout('stack');\nrelated: `registerLayout()`.\n:::\n\n:::method ABI7Grid.getLayouts()\npurpose: Names of globally registered layouts.\nsyntax:\nABI7Grid.getLayouts(); // ['masonry', 'grid', 'justified']\nparams: —\nreturns: `string[]`.\ninside: Global registry keys.\nuse: Layout selection drop-down list.\nlimits: Layout registered by the plugin on one grid (`api.layouts.register`), are not included here.\nerrors: —\nexample:\nselect.innerHTML = ABI7Grid.getLayouts().map(n => `<option>${n}</option>`).join('');\nrelated: `registerLayout()`.\n:::\n\n:::method ABI7Grid.fromLegacyOptions(legacy)\npurpose: Converts an options object written for the previous ABI7 Grid (`abi7_grid`) into options of this version. The helper exists in the current source; this repository does not provide a migration guide or a compatibility layer.\nsyntax:\nconst { options, unmapped } = ABI7Grid.fromLegacyOptions(oldConfig);\nparams:\nlegacy | `object` | `{}` | Options object in the previous option format.\nreturns: `{ options, unmapped }` — the converted options and a list of settings that have no equivalent and must be handled manually (event callbacks, `funcItemLoad` etc.).\ninside: Maps `items.minWidth/maxWidth`, `maxColumns`, `space`, `items.aspectRatio/height`, `padding`, `animation`, `items.sortable`, `grid.height`, `data`.\nuse: Only if you already have an option object in the previous format. New projects should use the options described in [Options](#/api-options).\nlimits: Loading functions and event callbacks are not converted automatically.\nerrors: —\nexample:\nconst { options, unmapped } = ABI7Grid.fromLegacyOptions(oldConfig);\nconst grid = new ABI7Grid('#gallery', options);\nrelated: [Options](#/api-options).\n:::\n\nStatic properties: `ABI7Grid.version` (`'1.0.0'`), `ABI7Grid.apiVersion` (Plugin API version, `'1.0.0'`), `ABI7Grid.defaults` (copy of default settings).\n\n## Deprecated\n\n:::method grid.itemInsert(data, [done])\npurpose: Compatible with old API: insertion at the beginning.\nsyntax:\ngrid.itemInsert(photo);\nparams:\ndata | `object` | mandatory | Record.\ndone | `function` | — | Called after `layout:end`.\nreturns: id of the inserted record.\ninside: `insert(data, { at: 'start' })`.\nuse: Only in the old code.\nlimits: Outdated.\nerrors: Like `insert()`.\nexample:\ngrid.itemInsert({ id: 'x', width: 1, height: 1 });\nrelated: `insert()`.\n:::\n\n:::method grid.items()\npurpose: Compatible with old API.\nsyntax:\nconst list = grid.items();\nparams: —\nreturns: Same as `getItems()` (the format has changed: instead of internal objects - descriptions `Item`).\ninside: Challenge `getItems()`.\nuse: Only in the old code.\nlimits: Outdated.\nerrors: —\nexample:\ngrid.items().length;\nrelated: `getItems()`.\n:::\n",Z="# API Reference: Options\n\nThe settings are passed as the second argument to the constructor and are changed on the fly via `grid.rebuild(patch)`. Nested objects (`layoutOptions`, `virtualization`, `animation`, `interaction`, `fields`) **unite** with default values, so it is enough to specify only the mutable keys. An incorrect value results in `ABI7Error` with `code: 'INVALID_OPTION'`.\n\nThe full set of default values is available in the code: `ABI7Grid.defaults`.\n\n```js\nconst grid = new ABI7Grid('#gallery', {\n  layout: 'masonry',\n  data: photos,\n  layoutOptions: { gap: 12, minWidth: 180, maxColumns: 5 },\n  virtualization: { enabled: true, overscan: 500 },\n  animation: { enabled: true, duration: 300 }\n});\n```\n\n## Core Options\n\n| Name | Type | Default | Description |\n|---|---|---|---|\n| `layout` | `string` | `'masonry'` | Layout algorithm name: `'masonry'`, `'grid'`, `'justified'` or the name of the layout plugin. If the layout has not yet been registered, the grid is waiting for registration (state `pending`). |\n| `layoutOptions` | `object` | `{}` | For settings of the selected layout, see below. Team up with `defaults` layout. |\n| `data` | `object[]`, `function`, `Promise` | `null` | Data. The function gets `{ signal, source }` and returns an array or Promise (race-proof loading). `null` — empty grid, data is added via `insert()` / `setData()`. |\n| `fields` | `object` | see \"Data Options\" | Where to get the id, dimensions and card details. |\n| `padding` | `number` or `{ top, right, bottom, left }` | `0` | Content padding, px. Affect the width available to the layout. |\n| `height` | `number`, `string`, `null` | `null` | Container height (`number` → px, string - any CSS value). `null` — height from CSS (default `100%`). Writes to a CSS variable `--abi7-height`. |\n| `className` | `string` | `''` | Additional root element classes. |\n| `itemClassName` | `string` | `''` | Additional classes for each card. |\n| `itemTag` | `string` | `'div'` | Card elements tag. |\n| `autoRender` | `boolean` | `true` | `false` — do not start the grid automatically; manual launch via `render()`. |\n| `autoResize` | `boolean` | `true` | Monitor the container size using ResizeObserver. When `false` call `refresh()` yourself. |\n| `scrollAnchoring` | `boolean` | `true` | Maintain the position of the viewed content when inserting above the window, resizing and changing the layout. |\n| `allowHTML` | `boolean` | `false` | The string returned from `renderItem`, by default inserted as **text**. `true` — like HTML (security is your responsibility). |\n| `renderItem` | `function` | `null` | `(record, element, { id, index }) => void`, `Node` or `string`. Replaces the standard card. Called whenever an element is bound to a post - update the content in-place. |\n| `releaseItem` | `function` | `null` | `(record, element, { id, index }) => void` — called when the element is unbound (release timers, videos, etc.). |\n| `plugins` | `Array<plugin or [plugin, options]>` | `[]` | Plugins installed at startup. |\n\n## Layout Options\n\nOptions are passed to `layoutOptions`. For all layouts, except where specifically noted, `gapX` / `gapY` (if not `null`) override `gap` along the axes.\n\n### Masonry (`layout: 'masonry'`)\n\n| Name | Type | Default | Description |\n|---|---|---|---|\n| `gap`, `gapX`, `gapY` | `number` | `12`, `null`, `null` | Spaces between cards. |\n| `columns` | `number` | `0` | Fixed number of columns; `0` — automatically. |\n| `minWidth` | `number` | `180` | Minimum column width for auto-fit. The smaller, the more columns. |\n| `maxWidth` | `number` | `0` | Maximum card width; `0` — without limitation. If the cards hit the limit, the column block is centered (`align`). |\n| `maxColumns` | `number` | `0` | Upper limit of columns; `0` — without limit. |\n| `itemHeight` | `number` | `0` | Fixed height of all cards, px. |\n| `aspectRatio` | `number` | `0` | Fixed width to height ratio for all cards. |\n| `align` | `'center'`, `'start'` | `'center'` | Horizontal alignment of a column block. |\n\nCard height is determined by priority: measured (`virtualization.measure`) → `itemHeight` → `aspectRatio` → aspect ratio of the record → height of the record → `virtualization.estimatedHeight`. Each subsequent source is used if the previous one is not specified.\n\n### Grid (`layout: 'grid'`)\n\n| Name | Type | Default | Description |\n|---|---|---|---|\n| `gap`, `gapX`, `gapY` | `number` | `12`, `null`, `null` | Indents. |\n| `columns` | `number` | `0` | Fixed number of columns; `0` — automatically. |\n| `minWidth` | `number` | `160` | Minimum cell width for auto-fit. |\n| `width` | `number` | `0` | Fixed cell width (the number of columns is calculated from it). |\n| `maxColumns` | `number` | `0` | Upper limit of columns for auto-selection. |\n| `itemHeight` | `number` | `0` | Fixed cell height. |\n| `aspectRatio` | `number` | `1` | The ratio of the width to the height of a cell. `0` — the height is taken from the records (the row is aligned to the highest). |\n| `align` | `'start'`, `'center'` | `'start'` | Aligns the grid horizontally if the cells do not occupy the entire width. |\n\n### Justified (`layout: 'justified'`)\n\n| Name | Type | Default | Description |\n|---|---|---|---|\n| `targetRowHeight` | `number` | `240` | Desired row height. |\n| `minRowHeight` | `number` | `150` | The row will not be lower if it can be avoided. |\n| `maxRowHeight` | `number` | `320` | The row will not be higher if it can be avoided. |\n| `gap`, `gapX`, `gapY` | `number` | `10`, `null`, `null` | Indents. |\n| `lastRow` | `'left'`, `'center'`, `'right'`, `'justify'` | `'left'` | Incomplete last row: row height `targetRowHeight` with alignment, or `'justify'` — stretch to the full width (no higher `maxRowHeight`). |\n| `defaultAspect` | `number` | `1.5` | Aspect ratio for posts without dimensions. |\n\n### Horizontal (plugin `@abi7/layout-horizontal`)\n\n| Name | Type | Default | Description |\n|---|---|---|---|\n| `height` | `number` | `0` | Ribbon height, px; `0` — according to the height of the container. |\n| `gap` | `number` | `12` | Distance between cards. |\n| `itemWidth` | `number` | `0` | Fixed card width; `0` — `height × aspect`. |\n| `defaultAspect` | `number` | `1.5` | Aspect ratio for posts without dimensions. |\n| `align` | `'start'`, `'center'` | `'start'` | Vertical tape alignment. |\n\n## Virtualization Options\n\nOptions `virtualization`.\n\n| Name | Type | Default | Description | Performance Impact |\n|---|---|---|---|---|\n| `enabled` | `boolean` | `true` | Mount only visible cards into the DOM + overscan. | `false` creates DOM for **each** entries - only for small sets. |\n| `overscan` | `number` | `400` | Margin in px around the window. | More - less “empty spaces” during fast scrolling, but more DOM elements. |\n| `adaptiveOverscan` | `boolean` | `true` | Increase the margin in the direction of movement in proportion to the speed. | Small DOM savings at rest and protection during fast scrolling. |\n| `maxOverscan` | `number` | `1600` | Limit of adaptive reserve. No less `overscan`. | — |\n| `poolSize` | `number` | `256` | How many unused elements to store in the DOM Pool. | More means less node creation, but more memory. |\n| `measure` | `boolean` | `false` | The height of the cards is determined by the content: the core measures them through ResizeObserver and caches them (Dynamic Size Cache). Masonry and Grid supported `aspectRatio: 0`. | Each visible element is observed by ResizeObserver; clarification of heights causes partial recalculations. |\n| `estimatedHeight` | `number` | `200` | The height estimate is still unknown. | The more accurate the estimate, the less measurement bias there is. |\n| `endThreshold` | `number` | `300` | How many px before the end does it fire? `reach:end`. | — |\n\n## Animation Options\n\nOptions `animation`. Only rearrangements are animated (insertion, deletion, rearrangement, resize, change of settings), but not scrolling.\n\n| Name | Type | Default | Description |\n|---|---|---|---|\n| `enabled` | `boolean` | `true` | Enable animation of lane changes. |\n| `duration` | `number` | `300` | Duration, ms. `0` disables animation. |\n| `easing` | `string` | `'ease'` | CSS timing-function. |\n| `respectReducedMotion` | `boolean` | `true` | Disable animation when `prefers-reduced-motion: reduce`. |\n\nValues are published as CSS variables `--abi7-duration` and `--abi7-easing` on the root element.\n\n## Interaction Options\n\nOptions `interaction`.\n\n| Name | Type | Default | Description |\n|---|---|---|---|\n| `click` | `boolean` | `true` | Generate `item:click`, `item:dblclick`, `item:contextmenu`. |\n| `drag.enabled` | `boolean` | `false` | Enable drag and drop to change order. |\n| `drag.handle` | `string`, `null` | `null` | CSS handle selector; dragging begins only with it. |\n| `drag.threshold` | `number` | `5` | Mouse/pen offset (px) before dragging begins. |\n| `drag.delay` | `number` | `220` | Long press for touches, ms. Before this, touch = normal scrolling. |\n| `drag.autoScroll` | `boolean` | `true` | Autoscroll at the edge of the container. |\n| `drag.edge` | `number` | `64` | Autoscroll area width, px. |\n| `drag.maxSpeed` | `number` | `22` | Maximum autoscroll speed, px/frame. |\n\n`drag.enabled` can be turned on on the fly: `grid.rebuild({ interaction: { drag: { enabled: true } } })`.\n\n## Data Options\n\n| Name | Type | Default | Description |\n|---|---|---|---|\n| `data` | see Core | `null` | Source of records. |\n| `fields.id` | `string` or `function` | `'id'` | Identifier field (`string` / `number`). No value - the core assigns internal `abi7-N`. |\n| `fields.width`, `fields.height` | `string` or `function` | `'width'`, `'height'` | Record sizes; if both are specified, the aspect ratio is calculated from them. Only `height` — used as height in px. |\n| `fields.aspectRatio` | `string` or `function` | `'aspectRatio'` | Ready width to height ratio (priority `width`/`height`). |\n| `fields.src`, `fields.title`, `fields.alt` | `string` or `function` | `'src'`, `'title'`, `'alt'` | Standard card details. URL filtered: allowed `http(s):`, `blob:`, `data:image/*` and relative addresses. |\n\nThe field may be **function** `(record) => value` — so the values are calculated lazily and are not stored in memory for all entries.\n\n## Plugin Options\n\nPlugin options are passed to `grid.use(plugin, options)` or in an array `plugins: [[plugin, options]]`. The core combines them with `plugin.defaults` and transmits to `install(api, options)` frozen object.\n\n| Plugin | Options |\n|---|---|\n| `selection` | `multiple` (`true`), `className` (`'abi7-selected'`), `toggleOnClick` (`false`), `keyboard` (`true`) |\n| `lightbox` | `loop` (`false`), `closeOnBackdrop` (`true`), `keyboard` (`true`), `counter` (`true`), `animation` (`220`), `swipe` (`true`), `getSrc`, `getCaption` |\n| `layout-horizontal` | no (settings in `layoutOptions`) |\n| `connected-grids` | `group` (`'default'`), `name` (`''`), `copy` (`false`), `accept`, `overClass` (`'abi7-connected-over'`) |\n\n## Root Element CSS Variables\n\n| Variable | Default | Description |\n|---|---|---|\n| `--abi7-height` | `100%` | Container height (set by option `height`). |\n| `--abi7-item-bg` | `#e5e7eb` | Card background before image upload. |\n| `--abi7-item-radius` | `6px` | Card rounding. |\n| `--abi7-caption-color` | `#fff` | Signature color. |\n| `--abi7-focus` | `#4c8bf5` | Focus stroke color. |\n| `--abi7-drag-shadow` | `0 12px 28px rgba(0,0,0,.28)` | Shadow of the card being dragged. |\n| `--abi7-duration`, `--abi7-easing` | `300ms`, `ease` | Animation (set by the core). |\n",ee="# API Reference: Plugin API & Layout API\n\nThe plugin receives an object `api` — the only point of interaction with the core. He **frozen**, each method checks that the plugin is still installed (after `unuse()` challenges `PluginError` with code `PLUGIN_INACTIVE`), and everything that the plugin has registered is tracked and removed automatically.\n\nObject Root: `api.name` (plugin name), `api.apiVersion` (Plugin API version, `'1.0.0'`), `api.coreVersion` (core version).\n\n## Plugin contract\n\n| Field | Type | Mandatory | Description |\n|---|---|---|---|\n| `name` | `string` | yes | Unique name (`/^[a-z][a-z0-9._:-]*$/i`). Plugin event namespace. |\n| `version` | `string` | yes | Plugin version (semver). |\n| `apiVersion` | `string` | yes | Range of compatible API versions: `^1.0.0`, `~1.0.0`, `>=1.0.0 <2`, `1.x`, `a \\|\\| b`. |\n| `install(api, options)` | `function` | yes | Synchronous. `this` — plugin object. Can return a cleanup function (or an object with `destroy()`). |\n| `defaults` | `object` | no | Default option values. |\n| `dependencies` | `string[]` | no | Names of plugins that should be installed first. |\n| `layout` | `object` | no | Definition of layout (for layout plugins; read `ABI7Grid.registerLayout(name, plugin)`). |\n\n## api.events\n\nThe event bus of this grid. Subscriptions via `api.events` are marked with the name of the plugin (errors in them go to the event `error` with `source: 'plugin:name'`) and are removed automatically.\n\n| Method | Returns | Description |\n|---|---|---|\n| `on(event, handler)` | `function` unsubscribes | Subscription. Supports `'*'`. |\n| `once(event, handler)` | `function` unsubscribes | One operation. |\n| `off(event, handler)` | `boolean` | Unsubscribe. |\n| `emit(event, payload?)` | `undefined` | Plugin event. **The name must start with `pluginName:`**, otherwise `PLUGIN_EVENT_NAMESPACE`. K `payload` is added `type`. |\n| `emitCancelable(event, payload?)` | `boolean` | How `emit`, but handlers can call `event.preventDefault()`. Returns `false`, if the event is cancelled. |\n\nRecommendations: subscribe only to the events you need; don't save `event.element` (node is reused); To cancel the click, check `event.defaultPrevented`.\n\n```js\napi.events.on('item:click', (e) => {\n  if (e.defaultPrevented) return;\n  api.events.emit('my-plugin:clicked', { id: e.id });\n});\n```\n\n## api.features\n\nRegistry of public plugin interfaces. Result `grid.getPlugin(name)`.\n\n| Method | Returns | Description |\n|---|---|---|\n| `register(name, impl)` | `undefined` | Registers an object or function. Taken name — `PLUGIN_FEATURE_CONFLICT`. Removes automatically. |\n| `unregister(name)` | `undefined` | Removes own feature ahead of schedule. |\n| `get(name)` | `object` or `null` | Feature (including another plugin). |\n| `has(name)` | `boolean` | Does feature. |\n\n## api.layouts\n\nRegistration layout **only for this grid**. Global registration — `ABI7Grid.registerLayout()`.\n\n| Method | Returns | Description |\n|---|---|---|\n| `register(name, definition)` | `undefined` | Registers layout. If the grid was waiting for this layout, the launch will continue. Removes automatically. |\n| `unregister(name)` | `undefined` | Withdraw early. |\n| `has(name)` | `boolean` | Is there a layout (local, global or built-in). |\n| `list()` | `string[]` | Available names. |\n\n## api.data\n\nWorking with data through the same methods as the public API (with all events). Internal core arrays are not expanded: read methods return copies.\n\n| Method | Returns | Description |\n|---|---|---|\n| `get()` | `object[]` | A copy of the records array. |\n| `getById(id)` / `getByIndex(i)` | `object` or `undefined` | Record. |\n| `ids()` | `Array<string\\|number>` | A copy of the id array in the current order. |\n| `count()` | `number` | Number of records. |\n| `indexOf(id)` | `number` | Index or `-1`. |\n| `has(id)` | `boolean` | Is there a recording? |\n| `set(list)` | `void` | How `grid.setData`. |\n| `insert(items, { at })` | `id[]` | How `grid.insert`. |\n| `remove(idOrIds)` | `number` | How `grid.remove`. |\n| `update(id, patch)` | `boolean` | How `grid.update`. |\n| `move(id, toIndex)` | `boolean` | How `grid.move`. |\n\n## api.geometry\n\nGeometry (coordinates in content pixels). Each method performs a lazy layout first if necessary, so the data doesn't become stale.\n\n| Method | Returns | Description |\n|---|---|---|\n| `get(id)` | `Rect` or `null` | `{ id, index, x, y, width, height, right, bottom }`. |\n| `getByIndex(i)` | `Rect` or `null` | The same goes for the index. |\n| `size()` | `{ width, height }` | Content size. |\n| `hitTest(x, y)` | `number` | Card index at content coordinate point or `-1`. |\n| `invalidate(fromIndex = 0)` | `void` | Mark geometry obsolete from the index (recalculation in the next frame, reason `plugin`). |\n\n## api.viewport\n\nView window and navigation.\n\n| Method | Returns | Description |\n|---|---|---|\n| `state()` | `object` | `{ scrollLeft, scrollTop, width, height, axis, overscan }`. |\n| `range()` | `{ first, last, count }` | Visible indexes (without overscan). |\n| `isVisible(id)` | `boolean` | Does the card cross the window? |\n| `scrollTo(x, y, behavior?)` | `void` | Scroll to point. |\n| `scrollToIndex(i, options?)`, `scrollToItem(id, options?)` | `boolean` | Just like the public API. |\n| `pin(id)` / `unpin(id)` | `void` | Pin the card to the DOM, even if it is outside the window. Plugin pins are removed automatically. They count against the counter. |\n| `clientToContent(clientX, clientY)` | `{ x, y }` | Screen coordinates → content coordinates. |\n| `indexAtClientPoint(clientX, clientY, { nearest }?)` | `number` | Card index under the dot; with `nearest: true` — nearest visible; `-1`if not. |\n\n## api.renderer\n\nThe only safe way to influence the DOM of cards.\n\n| Method | Returns | Description |\n|---|---|---|\n| `root()` | `HTMLElement` | The root element of the grid (for keyboard listeners, backlight listeners, etc.). |\n| `getElement(id)` | `HTMLElement` or `null` | The card element, if it is currently in the DOM. |\n| `toggleClass(id, className, force?)` | `boolean` | Assigns or removes a class based on **post id**. The core remembers the class and returns it when the DOM node is reused for another entry and bound back to this one. Returns the final state. |\n| `hasClass(id, className)` | `boolean` | Is the class assigned via `toggleClass`. |\n| `refresh(id?)` | `void` | Redraw the contents of one card or all mounted ones. |\n\n> Any “manual” markings inside the card (icons, signatures) must be placed during the event `item:mount` and clean up when `item:unmount`: the same DOM element shows different entries.\n\n## api.options\n\n| Method | Returns | Description |\n|---|---|---|\n| `get(path?)` | `any` | Copy of options (without `data`) or values along the way: `get('layoutOptions.gap')`. |\n| `set(path, value)` | `void` | Changes the option and applies it (as `rebuild`): `set('interaction.drag.enabled', true)`. |\n| `plugin()` | `object` | Frozen options of the plugin itself (same object as 2nd argument `install`). |\n\n## api.lifecycle\n\n| Method | Returns | Description |\n|---|---|---|\n| `isDestroyed()` | `boolean` | Is the grid destroyed? |\n| `state()` | `string` | `'new'`, `'loading'`, `'pending'`, `'ready'`, `'destroyed'`. |\n| `onDestroy(fn)` | `function` | Call `fn` at `destroy()` / `unuse()`. Returns a function that unregisters. |\n| `addDisposable(fn)` | `function` | Register the cleanup function (will be called in the reverse order of registration). Ideal for `removeEventListener`, `clearTimeout`, `observer.disconnect()`. |\n| `refresh()` | `void` | How `grid.refresh()`. |\n| `whenReady()` | `Promise` | How `grid.whenReady()`. |\n\n**Cleaning procedure** at `unuse()` and `destroy()`: function returned `install()` → `onDestroy` / `addDisposable` (in reverse order) → unsubscribing events, removing features and layout. Cleanup errors do not interrupt other steps and are reported as an event `error`.\n\n## Layout API\n\nLayout is an object that is registered as `ABI7Grid.registerLayout(name, def)` or `api.layouts.register(name, def)`.\n\n```js\nconst MyLayout = {\n  name: 'my-layout',\n  axis: 'y',                 // main scroll axis: 'y' (vertical) or 'x'\n  responsive: 'width',       // what causes recalculation during resize: 'width', 'height' or 'both'\n  defaults: { gap: 8 },      // default values for options.layoutOptions\n  create(options) {          // created when choosing layout and rebuild()\n    return {\n      compute(ctx) {         // called every time recalculation\n        // ... ctx.set(i, x, y, width, height) for i from ctx.from to ctx.count - 1\n        return { width: ctx.width, height: totalHeight, info: { /* any data */ } };\n      }\n    };\n  }\n};\n```\n\nLet's say a short version: `{ compute(ctx) {...} }` without `create` (without own state).\n\n### Context `ctx`\n\n| Field/method | Description |\n|---|---|\n| `count` | Number of records. |\n| `width`, `height` | Available content sizes (container minus `padding`), px. |\n| `from` | The index from which the geometry is obsolete. Everything to the left/above has already been calculated correctly - layout must recalculate the elements `from … count - 1` (partial recalculation). Layout can start earlier `from`. |\n| `options` | `defaults` layout combined with `layoutOptions` user. |\n| `aspect(i)` | Aspect ratio of record (`width / height`) or `0`, if unknown. |\n| `resolveHeight(i, width, { height, aspectRatio })` | Unified height policy: measured → fixed → aspect ratio → record height → estimatedHeight. Returns an integer ≥ 1. |\n| `itemId(i)`, `itemData(i)` | Identifier and record (read only). |\n| `rect(i)` | `{ x, y, width, height, right, bottom }` already calculated element (in layout coordinates, without `padding`). |\n| `set(i, x, y, width, height)` | Records geometry. Values must be finite numbers, `width`/`height` ≥ 0, otherwise `LAYOUT_INVALID`. |\n\n### What returns `compute`\n\n`{ width, height, info? }` — content sizes (without `padding`, the core will add it itself). `info` falls into `layout:end` and `getState().layoutInfo`.\n\n### Rules\n\n- Layout answers **only for geometry**. It does not gain access to the DOM, virtualization, or internal core arrays.\n- Virtualization works with any layout without additional settings: the core builds a spatial index according to `axis`.\n- The result must be deterministic: same input → same geometry. Then partial and full recalculation give the same result (checked by tests for built-in layouts).\n- Error in `compute` does not break the grid: it comes to the event `error` (`source: 'layout'`).\n- If the active layout is disabled (`unuse()` plugin), the grid switches to `masonry`.\n\n### Example: “ladder” layout in 12 lines\n\n```js\nABI7Grid.registerLayout('stairs', {\n  defaults: { step: 40, itemHeight: 120 },\n  compute(ctx) {\n    const { step, itemHeight } = ctx.options;\n    for (let i = ctx.from; i < ctx.count; i++) {\n      ctx.set(i, (i * step) % Math.max(1, ctx.width - 200), i * (itemHeight + 8), 200, itemHeight);\n    }\n    return { width: ctx.width, height: ctx.count * (itemHeight + 8) };\n  }\n});\n```\n",ne="# Core Architecture\n\nCore - one file `abi7-grid.js`, organized into logical sections. Inside there are classes and functions, outside there is one class `ABI7Grid`.\n\n## File Sections\n\n| № | Section | Purpose |\n|---|---|---|\n| 1 | Utilities | auxiliary functions, `ABI7Error`, `PluginError`, `mergeOptions`, `safeUrl`, semver |\n| 2 | EventEmitter | event bus; handler errors do not interrupt others |\n| 3 | OptionsManager | defaults, concatenation, validation |\n| 4 | DataStore | records, id array, `Map id → index` |\n| 5 | GeometryStore | coordinates in `Float64Array`, spatial index |\n| 6 | Layout Engine | `LayoutRegistry`, `LayoutManager`, Masonry, Grid, Justified |\n| 7 | VirtualizationEngine | which indexes to show |\n| 8 | DOMRenderer | DOM elements and DOM Pool |\n| 9 | AnimationManager | CSS transition during rebuild |\n| 10 | PluginManager | installing plugins, Plugin API |\n| 11 | InteractionManager | Clicks and Drag & Drop |\n| 12 | LifecycleManager | `AbortController`, timers, `requestAnimationFrame` |\n| 13 | GridInstance | internal “engine” - connects all components |\n| 14 | Public API | class `ABI7Grid` (thin façade) |\n\n## Data flow\n\n```text\ndata (DataStore)\n   │  insert / remove / update / move / setData\n   ▼\ninvalidate(from, reason) ──► requestAnimationFrame ──► runLayout()\n                                                         │\n          LayoutManager.compute(from) ◄──────────────────┘\n                   │  ctx.set(i, x, y, w, h)\n                   ▼\n          GeometryStore (+ spatial index)\n                   │\n                   ▼\n          VirtualizationEngine.select() ──► window indexes + overscan + pinned\n                   │\n                   ▼\n          DOMRenderer.sync()  ──► mount / unmount / DOM Pool ──► DOM\n```\n\n1. Any data change causes `invalidate(from, reason)` — geometry starting from index `from` marked obsolete. Multiple calls per frame are combined.\n2. In the nearest frame `runLayout()` calls layout with `ctx.from`. Layout records coordinates via `ctx.set()`. For Masonry, control points for column heights are used every 128 elements, for Grid - the upper boundaries of rows, for Justified - a list of already formed rows: recalculation begins from the point of change.\n3. The spatial index (baskets along the main axis) is reconstructed from the geometry.\n4. The Virtualization Engine queries the index for elements crossing the window + overscan and adds the pinned ones.\n5. DOM Renderer compares this set with the already mounted one: the excess goes into the pool, the missing is taken from the pool (or created) and bound to the record.\n\n## Limits of responsibility\n\n- **Layout Engine ↔ everything else.** Layout gets `ctx` (dimensions, `aspect()`, `resolveHeight()`, `rect()`, `set()`) and returns the size of the content. DOM, virtualization and core arrays are not available to it.\n- **Virtualization ↔ Layout.** Virtualization only sees rectangles in `GeometryStore` and the scroll axis. Therefore, it works equally for Masonry, Grid, Justified, horizontal ribbon and any custom layout.\n- **Renderer ↔ plugins.** The plugin does not receive DOM cards directly: it works through `api.renderer` (`toggleClass`, `getElement`, events `item:mount` / `item:unmount`).\n- **Plugin Manager ↔ core.** Plugin sees frozen `api` of nine interfaces; arrays `DataStore` and `GeometryStore` it doesn't have any - only copies and methods.\n\n## Life cycle\n\n```text\nnew ABI7Grid()  ──►  microtask: _start()  ──►  data:load-start/end  ──►  layout  ──►  ready\n      │                    │                                                     │\n   use(plugin) listeners, observers working state\n                                                                                  │\n                                                          destroy(): events → plugins → drag → observers\n                                                                     → DOM → AbortController → container\n```\n\nStates `phase`: `new` → `loading` → (`pending`, if the layout has not yet been registered) → `ready` → `destroyed`. If the container is hidden (width 0), the first layout waits for the size to appear.\n\n## Solutions you should know about\n\n| Solution | Reason |\n|---|---|\n| One `click`-listener on container | The original put 5-7 listeners on each card. |\n| Geometry in `Float64Array` | Compact and fast for tens of thousands of elements, no allocations per element. |\n| Spatial index of the \"basket along the axis\" | Window request - O(k), does not depend on layout, does not require `getBoundingClientRect()` for each scroll (as in the original). |\n| DOM Pool | Creating nodes is expensive; When scrolling, nodes of dropped cards immediately receive new data. |\n| Animation only during lane changes | Otherwise, reused nodes would “fly” across the screen when scrolling. |\n| `scrollbar-gutter: stable` | The appearance of a scrollbar does not change the width of the content, so there is no cycle resize → layout → resize; Additionally, there is a fuse (no more than 10 resize recalculations per 500 ms). |\n| Reusable nodes + `renderer.toggleClass` | Plugin classes are bound to **post id**, and not to the node - the selection does not “jump” to another card. |\n| Plugins don't import Core | The plugin depends only on the contract (`api`), so it doesn't break when Core is recycled. |\n\n## Public API at a glance\n\n```js\n// Lifecycle:  render() refresh() rebuild(options) reload() destroy() flush() whenReady()\n// Data:       data() setData(list) load(source) insert(items, {at}) remove(id) update(id, patch) move(id, to) getCount()\n// Items:      getItem(id) getItems() getVisibleItems()\n// Navigation: scrollToIndex(i, opts) scrollToItem(id, opts)\n// Plugins:    use(plugin, opts) unuse(name) getPlugin(name) hasPlugin(name) getPlugins()\n// Events:     on(name, fn) once(name, fn) off(name, fn)\n// State:      getState() isDestroyed()\n// Static:     ABI7Grid.registerLayout() unregisterLayout() getLayouts() fromLegacyOpt

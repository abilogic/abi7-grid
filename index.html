ions()\n```\n\nMore details in [API Reference](#/api-methods).\n\n## Limitations of the current version\n\n- The scroll container is always the grid element itself (scroll `window` and external containers like `grid.scrollbox` in the original, not supported).\n- One layout pass processes all the entries below `from` whole: for 50,000 records it's a few milliseconds, but it's O(n) per change at the beginning of the list.\n- Dynamic height (`virtualization.measure`) is specified only for cards that have been in the window; heights of cards not yet shown - estimate (`estimatedHeight`).\n- Drag & Drop changes the order of entries in the grid itself; maintaining order is the task of the application.\n- Classic `<script>`-tags and UMD assembly are not implemented (only ES modules).\n",te="# Callbacks\n\nABI7 Grid has **no `onXxx` options** such as `onReady`: lifecycle and interaction notifications use the event bus ([Events](#/api-events)). The functions below are the callbacks that the implementation actually calls.\n\n| Callback | Where you set it | Called when | Arguments | Return value |\n|---|---|---|---|---|\n| `data` function | option `data`, `grid.load()` | initial load, `load()`, `reload()`, `rebuild({ data })` | `{ signal, source }` | array, or a Promise of an array |\n| `fields.<name>` getters | option `fields` | whenever the core reads a field (id, width, height, aspectRatio, src, title, alt) | `(record)` | the field value |\n| `renderItem` | option `renderItem` | every time a card element is bound to a record: mount, `update()`, `reload()` | `(record, element, { id, index })` | nothing, a `Node` (replaces content), or a string (text, or HTML when `allowHTML`) |\n| `releaseItem` | option `releaseItem` | when an element is unbound from a record (unmount, destroy, reset) | `(record, element, { id, index })` | ignored |\n| Event listeners | `grid.on()`, `once()` | see [Events](#/api-events) | the event object | `item:*` click events can be cancelled with `event.preventDefault()` |\n| Plugin `install` | `grid.use()` | once per `use()` | `(api, options)` | optional cleanup function (or an object with `destroy()`) |\n| `api.lifecycle.onDestroy`, `addDisposable` | inside a plugin | `unuse()` / `destroy()` | none | ignored |\n| Layout `create` / `compute` | `registerLayout()`, `api.layouts.register()` | when the layout is selected / on every layout pass | `(options)` / `(ctx)` | `{ compute }` / `{ width, height, info? }` |\n| `done` argument | the deprecated legacy methods (see Methods → Deprecated) | after the operation the legacy method waited for | — | ignored |\n\n## Error handling\n\nAn exception thrown by a listener, `renderItem`, `releaseItem`, a data function or a plugin does **not** break the grid. It is reported as the `error` event with `source` (`'listener'`, `'plugin:name'`, `'data'`, `'layout'`, `'renderItem'`, `'releaseItem'`, `'plugins'`). If nobody listens to `error`, the core writes it to `console.error`.\n\n## `renderItem` example\n\n```js\nconst grid = new ABI7Grid('#gallery', {\n  data: users,\n  fields: { id: 'uid', height: () => 120 },\n  renderItem(record, element) {\n    // Called for every bind: update in place. The element is reused for other records.\n    element.textContent = record.name;\n  },\n  releaseItem(record, element) {\n    // Release anything attached in renderItem (timers, listeners) here.\n  }\n});\n```\n\n## `data` function example\n\n```js\nconst grid = new ABI7Grid('#gallery', {\n  data: async ({ signal }) => {\n    const res = await fetch('/api/photos', { signal });\n    return res.json();\n  }\n});\n```\n\nIf a newer load starts, `signal` is aborted and a late response from the older request is ignored.\n\n## Converting old option objects\n\n`ABI7Grid.fromLegacyOptions()` lists legacy `events.onXxx` callbacks in `unmapped`: they have no equivalent option; subscribe with `grid.on()` instead.\n",ie="# Core Concepts\n\nThis page explains the model behind ABI7 Grid. The code references are to `src/abi7-grid.js`; the full walk-through is in [Internal Architecture](#/internals).\n\n## Grid container\n\nThe element you pass to the constructor becomes the **root**: it receives the class `abi7-grid` and acts as the scroll container (`overflow: auto`), so it needs a height. The core adds one child, `div.abi7-container` (`role=\"list\"`), which has the total content size; cards are absolutely positioned inside it. The original `class`, `style`, `tabindex`, `role` and `aria-label` attributes are saved and restored by `destroy()`. An element can have only one live instance (`ALREADY_INITIALIZED`).\n\n## Grid items\n\nAn item is a **record** (a plain object) in the data store. The core never mutates your objects. `fields` tells it where to find `id`, `width`, `height`, `aspectRatio`, `src`, `title` and `alt`; each field can be a property name or a getter function. A card is a DOM element created only while its record is mounted.\n\n## Layout calculation\n\nA layout is an object with `compute(ctx)`. For every index from `ctx.from` to `ctx.count - 1` it calls `ctx.set(i, x, y, width, height)`, and returns the content size. The core stores the rectangles in typed arrays (`Float64Array`) and builds a spatial index along the scroll axis. The layout does not touch the DOM.\n\n## Column management\n\nMasonry and Grid choose the number of columns like this (Masonry, from the source):\n\n1. if `columns > 0`, use it; otherwise `floor((W + gapX) / (minWidth + gapX))`, where `W` is the available width;\n2. apply `maxColumns` if it is greater than zero; use at least one column;\n3. column width is `floor((W − gapX × (columns − 1)) / columns)`, capped by `maxWidth` if set;\n4. the block of columns is centered (`align: 'center'`) or left-aligned (`'start'`).\n\nMasonry puts each card into the currently shortest column. Grid puts cards into rows of equal height. Justified builds rows whose height is chosen so the row fills the width.\n\n## Item measurement\n\nHeights follow one policy (`resolveHeight`): measured height (`virtualization.measure`) → fixed `itemHeight` → `aspectRatio` option → the record's aspect ratio → the record's `height` → `virtualization.estimatedHeight`. By default **nothing is measured from the DOM**: sizes come from your data. With `measure: true`, a `ResizeObserver` measures mounted cards and caches the heights (Dynamic Size Cache).\n\n## Positioning\n\nEach mounted card gets `transform: translate3d(x, y, 0)`, `width` and `height` in pixels (height is left empty in measure mode). The DOM Renderer writes these only when the card's `epoch` differs from the geometry epoch, which increases after each layout pass. Plugins and your CSS must therefore not use the card's own `transform`.\n\n## Resize handling\n\nWith `autoResize: true`, a `ResizeObserver` watches the root. `onResize()` compares the new `clientWidth` and `clientHeight` with the stored viewport and, for layouts with `responsive: 'width'` (all built-in layouts except the horizontal plugin), schedules a layout from index 0. A burst guard stops infinite loops (for example a flickering scrollbar): more than 10 resize-triggered layouts in 500 ms are ignored. See [Responsive Behavior](#/responsive).\n\n## Dynamic content\n\n`insert`, `remove`, `update`, `move`, `setData`, `load` and `reload` change data; each marks the geometry dirty from an index (`invalidate(from, reason)`). Several changes in one frame are merged and cost one layout pass. See [Dynamic Content](#/dynamic-content).\n\n## DOM synchronization\n\nAfter a layout pass, the Virtualization Engine decides which indexes should be mounted (window + overscan + pinned). The DOM Renderer then mounts and unmounts cards: unmounted elements go to the DOM Pool and are reused for other records. A card's content is written when it is **bound** (mount, `update()`, `reload()`), not on every frame. Consequently, anything you change directly in a card (for example with the browser's DOM inspector) is not observed; see the [DOM inspector example](#/examples-advanced).\n",oe="# Dynamic Content\n\nAll data changes go through the public API, so the core always knows about them. Direct DOM edits are not observed.\n\n## Adding cards\n\n`grid.insert(items, { at })` — `at` is `'start'`, `'end'` (default) or an integer index. It returns the new ids. The geometry is recalculated **from the insertion index**; the core emits `item:insert` and then `layout:start` / `layout:end`. If the insertion happens above the viewport, Scroll Anchoring keeps the visible content in place (option `scrollAnchoring`).\n\n## Removing cards\n\n`grid.remove(idOrIds)` returns the number of removed records and emits `item:remove`. Removing from the start recalculates everything below it.\n\n## Changing content\n\n`grid.update(id, patch)` merges the patch into the record, re-binds the card (so `renderItem` or the standard card is applied again) and emits `item:update` with `previous` and `changed`. If the patch changes the width, height or aspect ratio fields, the geometry is invalidated from that index and the cached measured height is dropped.\n\n## Changing sizes\n\n- Item size: change `width`/`height`/`aspectRatio` in the record with `update()`.\n- Layout size options: `rebuild({ layoutOptions })`.\n- Container size: automatic with `autoResize`, otherwise `refresh()`.\n\n## Recalculating positions\n\nAll changes call `invalidate(from, reason)`. Repeated invalidations in the same frame keep the lowest `from` and are executed by a single layout pass in the next animation frame. `grid.flush()` runs the pending pass immediately.\n\n## DOM updates\n\nOnly the DOM Renderer writes card elements. It re-applies `transform`, `width` and `height` when the geometry epoch changed, and re-writes content when a card is bound.\n\n## Images\n\nThe standard card creates `<img class=\"abi7-media\" loading=\"lazy\" decoding=\"async\">`. **The core does not listen to image `load` events**; geometry comes from the record. Provide `width` and `height` (or `aspectRatio`) for every record. If the real image has another ratio, update the record when you know it:\n\n```js\nimg.addEventListener('load', () => grid.update(id, { width: img.naturalWidth, height: img.naturalHeight }));\n```\n\n:::demo image-loading\n\n## Asynchronous content\n\n`data` can be a function returning a Promise. It receives `{ signal, source }`. A newer load aborts the signal of the older one, and a late response from an outdated request is ignored. Use `grid.whenReady()` to wait for the first layout and `reach:end` for infinite scrolling.\n\n:::demo lazy-loading\n\n## Editing elements in the browser's DOM inspector\n\nThe core has no `MutationObserver`. What happens after you edit a card in DevTools:\n\n| You changed | What happens |\n|---|---|\n| `transform`, `width`, `height` of a card | Rewritten on the next layout pass (for example `refresh()`, a resize, or any data change that causes layout) |\n| Text or children inside a card | Kept until the card is re-bound: `reload()`, `update(id)`, or reuse of the element for another record |\n| Classes you added by hand | Removed when the card is re-bound (the core rewrites `className`); use `api.renderer.toggleClass()` or `itemClassName` instead |\n| Inline styles the core does not manage (for example `outline`) | Kept on that element, but the element may be reused for another record while scrolling |\n\nFor persistent per-record changes use `api.renderer.toggleClass()` in a plugin or `renderItem`.\n\n:::demo dom-inspector\n\n## Complete dynamic example\n\n:::demo dynamic\n",se="# Advanced Examples\n\n## Dynamic item addition, removal, update and move\n\nFeatures: `insert()`, `remove()`, `update()`, `move()`, `getItems()`, `getCount()`, `item:*` events, partial recalculation.\n\n:::demo dynamic\n\n## Image loading and asynchronous data\n\nFeatures: `data` function with `{ signal }`, race-free reloads, `reload()`, `whenReady()`, `data:load-start` / `data:load-end`.\n\n:::demo image-loading\n\n## Lazy loading and infinite scroll\n\nFeatures: virtualization (only visible cards are mounted), `reach:end`, `virtualization.endThreshold`, `insert({ at: 'end' })`.\n\n:::demo lazy-loading\n\n## Large number of items\n\n50,000 records, DOM Pool, overscan and `scrollToIndex`. Features: `virtualization.*`, `getState().virtualization`, `scrollToIndex()`.\n\n:::demo virtualization\n\n## Multiple grid instances\n\nFeatures: independent instances, per-instance `rebuild()`, `ALREADY_INITIALIZED` protection.\n\n:::demo multiple-instances\n\n## Reinitialization and destruction\n\nFeatures: `destroy()`, `isDestroyed()`, `reload()`, creating a new instance on the same element.\n\n:::demo lifecycle\n\n## Changes made in the DOM inspector\n\nFeatures: geometry epoch, re-binding with `reload()`. Edit a card, then trigger a layout pass or a re-bind to see what the core overwrites.\n\n:::demo dom-inspector\n\n## Container resize and window resize\n\nSee [Custom container width](#/examples-basic) and [Responsive grid](#/examples-basic). The grid reacts to its container through `ResizeObserver`; it does not listen to `window.resize` directly. Details: [Responsive Behavior](#/responsive).\n\n## Custom item content\n\nFeatures: `renderItem`, `releaseItem`, `allowHTML`. See [Callbacks](#/callbacks). The `custom-plugin` example below customizes cards through a plugin.\n\n:::demo custom-plugin\n",re="# Basic Examples\n\nEvery example runs the real library in an iframe, from the same files that you see in the tabs. Each lists the core features it uses.\n\n## Basic Grid\n\nFeatures: constructor, `data`, `fields.src`, `layoutOptions`, `item:click`.\n\n:::demo basic\n\n## Two, three and four columns\n\nFeatures: `layoutOptions.columns`, `rebuild()`, `layout` switch, `layout:end` info.\n\n:::demo columns\n\n## Different item heights and layouts\n\nMasonry uses each record's own aspect ratio, so heights differ. Features: Masonry, `minWidth`, `maxColumns`, `insert()`, `remove()`, `refresh()`, `rebuild()`.\n\n:::demo masonry\n\n## Fixed aspect ratio (Grid layout)\n\nFeatures: `grid` layout, `columns`, `aspectRatio`, `gap`.\n\n:::demo grid\n\n## Different gaps\n\nFeatures: `gapX`, `gapY`, animation on rebuild.\n\n:::demo gaps\n\n## Custom container width\n\nFeatures: `autoResize` (`ResizeObserver`), `minWidth`, `resize` event.\n\n:::demo container-width\n\n## Responsive grid\n\nFeatures: `minWidth`, `maxColumns`, container resize, `getState().viewport`.\n\n:::demo responsive\n\n## Justified rows\n\nFeatures: `justified` layout, `targetRowHeight`, `lastRow`.\n\n:::demo justified\n",ae="# Examples\n\nEach example — **real ABI7 Grid** (same `dist/abi7-grid.js`) launched in an iframe. The code in the tabs are the same files that are executed in the demo: there can be no discrepancies. The files are in `examples/<name>/` and work as independent pages (via any static server: `examples/basic/index.html`).\n\nShared file `examples/shared/photos.js` creates test data and SVG “photos” (there are no external images, everything works offline) - it is shown in the tab `photos.js` each example.\n\nList: [Basic](#/examples/basic), [Masonry](#/examples/masonry), [Grid](#/examples/grid), [Justified](#/examples/justified), [Virtualization](#/examples/virtualization), [Selection](#/examples/selection), [Lightbox](#/examples/lightbox), [Horizontal](#/examples/horizontal), [Connected Grids](#/examples/connected-grids), [Custom Plugin](#/examples/custom-plugin).\n\n## Basic\n\n**Problem:** create a grid in several lines and respond to clicks.\n\n:::demo basic\n\n- **Methods:** designer, `on()`.\n- **Settings:** `layout`, `data`, `fields.src` (function), `layoutOptions.gap/minWidth/maxColumns`.\n- **Events:** `item:click` (delegation, one listener per container), `ready` (after the first layout).\n- **What to change:** replace `layout` on `'grid'` or `'justified'`; pass on the real ones `src` instead of a function `photoSrc`; add `layoutOptions.maxWidth`.\n\n## Masonry\n\n**Problem:** dynamic list - adding, deleting, recalculating and changing layout settings.\n\n:::demo masonry\n\n- **Methods:** `insert(item, { at: 'start' })`, `remove(id)`, `refresh()`, `rebuild({ layoutOptions })`, `getItems()`, `getState()`.\n- **Settings:** `layoutOptions.gap`, `minWidth`, `maxColumns`; `animation.duration`.\n- **Events:** `layout:end` (number of columns, duration, `from` — from which index it was recalculated), `item:insert`, `item:remove`, `item:click`.\n- **What to watch:** when added to the beginning `from` = 0, when the last card is removed - large `from` (partial recalculation).\n- **What to change:** insert at the end (`at: 'end'`); `layoutOptions.columns: 3`; `animation.enabled: false`.\n\n## Grid\n\n**Problem:** classic grid with customizable columns, proportions and page indents.\n\n:::demo grid\n\n- **Methods:** `rebuild({ layoutOptions })` — the only way to apply the new settings.\n- **Settings:** `columns` (0 - automatically by `minWidth`), `aspectRatio`, `gap`, `minWidth`.\n- **Events:** `layout:end` with `info.columns`, `info.rows`, `info.itemWidth`.\n- **What to change:** `layoutOptions.width: 200` (fixed cell width), `align: 'center'`, `gapX` / `gapY` separately.\n\n## Justified\n\n**Problem:** rows of the same height and different widths, as in photo hosting sites.\n\n:::demo justified\n\n- **Methods:** `rebuild()`, `getVisibleItems()`, `getState().layoutInfo`.\n- **Settings:** `targetRowHeight`, `minRowHeight`, `maxRowHeight`, `gap`, `lastRow` (`left` / `center` / `right` / `justify`).\n- **Events:** `layout:end`, `scroll:stop`.\n- **What to watch:** cards in visible rows match `rect.height`; the total width of the row is equal to the width of the container, except for the last row.\n- **What to change:** a min/max range that is too narrow will cause the layout to sacrifice height accuracy but not width padding.\n\n## Virtualization\n\n**Problem:** show 1,000 – 50,000 cards and see how many DOM nodes are actually created.\n\n:::demo virtualization\n\n- **Methods:** `setData()`, `rebuild({ virtualization })`, `scrollToIndex()`, `getState().virtualization`.\n- **Settings:** `virtualization.overscan`, `adaptiveOverscan`, `maxOverscan`, `poolSize`.\n- **Events:** `viewport:update`, `scroll:stop`.\n- **What to watch:** for any size of the array, dozens of nodes remain “in the document”; `created` does not grow when scrolling for a long time, but `reused` — growing; when scrolling quickly `overscan` after/before increases (adaptive).\n- **What to change:** `virtualization.enabled: false` on 1,000 cards (all in DOM) for comparison.\n\n## Selection\n\n**Problem:** selecting cards by clicking, with modifiers and programmatically.\n\n:::demo selection\n\n- **Connection:** `grid.use(SelectionPlugin, { multiple: true })`, access — `grid.getPlugin('selection')`.\n- **Plugin Methods:** `select`, `deselect`, `toggle`, `clear`, `selectAll`, `getSelected`, `getSelectedItems`, `isSelected`, `count`.\n- **Events:** `selection:change` (`selected`, `added`, `removed`, `source`).\n- **What to watch:** the selection remains on the card when scrolling and returning - the class is bound to the id, not to the DOM node.\n- **What to change:** `{ multiple: false }`; `{ toggleOnClick: true }`; your class name via `className`.\n\n## Lightbox\n\n**Problem:** open the photo on top of the grid, scroll through, close.\n\n:::demo lightbox\n\n- **Connection:** `grid.use(LightboxPlugin, { loop, animation, getSrc, getCaption })`.\n- **Plugin Methods:** `open(id)`, `close()`, `next()`, `prev()`, `isOpen()`, `current()`.\n- **Events:** `lightbox:before-open` (cancelable), `lightbox:open`, `lightbox:change`, `lightbox:close`.\n- **Keyboard:** Escape, ←, →, Home, End. Mobile: swipe left/right. Closing: cross, background, Escape.\n- **What to change:** `animation: 0`; `closeOnBackdrop: false`; in `getSrc` — real URL of the original.\n\n## Horizontal\n\n**Problem:** horizontal strip of 3,000 cards of varying widths.\n\n:::demo horizontal\n\n- **Connection:** `grid.use(HorizontalLayout)` (layout plugin); `layout: 'horizontal'` specified before connection - the grid is waiting for registration.\n- **Methods:** `rebuild({ layoutOptions })`, `scrollToIndex(i, { align: 'center' })`, `getState().contentWidth`.\n- **Settings:** `layoutOptions.height`, `gap`, `itemWidth`.\n- **What to watch:** the total width is millions of pixels, and there are dozens of cards in the DOM; `scrollLeft` changes, `scrollTop` — no.\n- **What to change:** `itemWidth: 160` (same width), `align: 'center'`.\n\n## Connected Grids\n\n**Problem:** transfer of cards between two independent grids.\n\n:::demo connected-grids\n\n- **Connection:** `use(ConnectedGrids, { group, name })` on **everyone** grid groups; the plugin checks compatibility (major core version, `fields.id`, uniqueness `name`).\n- **Plugin Methods:** `transfer(id, targetName, { at })`, `members()`.\n- **Events:** `connected-grids:before-transfer` (cancelable), `connected-grids:transfer`, `connected-grids:receive`; core: `drag:start`, `drag:move`, `drag:end`, `item:insert`, `item:remove`.\n- **What happens during the transfer:** `drag:end` with `outside: true` → the plugin finds the grid under the pointer → `remove` in the source and `insert` in the receiver (both are recalculated) → events.\n- **What to change:** `copy: true`; `accept: (record) => record.title !== 'Photo 3'`.\n\n## Custom Plugin\n\n**Problem:** write a plugin from scratch — `CounterPlugin`, which counts clicks on cards. A detailed analysis of 17 points is in the section [Creating a plugin](#/plugin-development/point-by-point-analysis).\n\n:::demo custom-plugin\n\n- **Connection:** `grid.use(CounterPlugin, { step: 1, badges: true })`, `grid.unuse('counter')`.\n- **Plugin Methods:** `getTotal()`, `getCount(id)`, `top(n)`, `reset()`.\n- **Plugin Events:** `counter:change`, `counter:reset`.\n- **What to change:** `{ step: 5 }`, `{ badges: false }`, `filter: (record) => record.title !== 'Photo 1'`.\n",le="# Building Your First ABI7 Grid Plugin\n\nIn this tutorial you build **Flash**: a plugin that highlights a card for a moment after it is clicked. You will use every part of the plugin lifecycle: declaration, options, events, DOM changes, a public interface and cleanup. The finished plugin is a real file that runs below.\n\n> A plugin you write yourself is your own work. Running it together with ABI7 Grid is still governed by the [license](#/license): the Community License allows non-commercial use only. Need ABI7 Grid for commercial projects? Get a commercial license at https://abi7.com\n\n## 0. What a plugin is\n\nA plugin is a plain object with `name`, `version`, `apiVersion` and an `install(api, options)` function. It is passed to `grid.use()`. The plugin never imports the core. The core gives it a frozen `api` object, tracks everything the plugin registers and removes it on `unuse()` or `destroy()`.\n\n## 1. Declare the plugin\n\n```js\nconst FlashPlugin = {\n  name: 'flash',            // unique per grid; event namespace\n  version: '1.0.0',         // semver\n  apiVersion: '^1.0.0',     // Plugin API versions you support\n  defaults: { className: 'flash-on', duration: 600 },\n  install(api, options) { /* ... */ }\n};\nexport default FlashPlugin;\n```\n\nIf `apiVersion` does not match the core, `grid.use()` throws `PluginError` with code `PLUGIN_INCOMPATIBLE` and installs nothing.\n\n## 2. Keep state inside `install`\n\nVariables declared inside `install()` are created per grid. Two grids using the same plugin object have separate state; this is how independent plugins avoid conflicts.\n\n## 3. Subscribe to events\n\n```js\napi.events.on('item:click', (event) => {\n  if (event.defaultPrevented) return;\n  // ...\n});\n```\n\nSubscriptions made through `api.events` are removed automatically. Errors inside the handler become the `error` event with `source: 'plugin:flash'`.\n\n## 4. Change the DOM through the API\n\n```js\napi.renderer.toggleClass(event.id, options.className, true);\n```\n\nCard elements are reused by virtualization, so never store `event.element` for later and never add a class directly. `toggleClass()` is keyed by **record id**; the core re-applies it whenever the record is bound to an element.\n\n## 5. Emit your own events\n\n```js\napi.events.emit('flash:fired', { id: event.id });\n```\n\nThe event name must start with `flash:` (the plugin name); otherwise the core throws `PLUGIN_EVENT_NAMESPACE`.\n\n## 6. Register a public interface\n\n```js\napi.features.register('flash', { active: () => timers.size });\n// later:  grid.getPlugin('flash').active()\n```\n\n## 7. Clean up what the core cannot track\n\nReturn a function from `install()`. Use it for your timers, observers and global listeners. The core cleans up its own subscriptions, features and layouts.\n\n## 8. Add CSS\n\nPut visuals in a separate stylesheet and use only properties the core does not manage. Never set `transform`, `width`, `height` or `position` on `.abi7-item`.\n\n## The complete plugin\n\n:::file examples/first-plugin/flash-plugin.js\n\n## Run it\n\n:::demo first-plugin\n\n## 9. Use it\n\n```js\nimport FlashPlugin from './flash-plugin.js';\n\ngrid.use(FlashPlugin, { duration: 900 });\ngrid.getPlugin('flash').active();\ngrid.unuse('flash');           // cleanup runs\n```\n\nYou can also pass `plugins: [[FlashPlugin, { duration: 900 }]]` in the constructor.\n\n## 10. Checklist\n\n- State lives inside `install()`.\n- Every listener is registered through `api.events` (or removed in the cleanup function).\n- Timers and observers are cleaned up.\n- Event names start with `<name>:`.\n- DOM changes go through `api.renderer`.\n- `apiVersion` is declared.\n\nNext: [Plugin Development Guide](#/plugin-development), [Plugin API](#/api-plugin) and [Plugin Examples](#/plugin-recipes).\n",de=`# Getting Started

## What you will need

- Files \`dist/abi7-grid.js\` and \`dist/abi7-grid.css\` (or \`*.min.*\`).
- Modern Browser (ES2022, \`ResizeObserver\`; \`IntersectionObserver\` — optional).
- **Static HTTP server.** ES modules are not loaded from pages \`file://\`. Anyone will do: \`npx serve .\`, \`python3 -m http.server\`, \`npm run dev\`.

## File structure

\`\`\`text
dist/
├── abi7-grid.js # Core, readable
├── abi7-grid.min.js # Core, minified (+ .map)
├── abi7-grid.css # Core styles
└── abi7-grid.min.css
plugins/
└── selection/selection.js selection.css # each plugin separately
\`\`\`

Rebuild minified files from \`src/\` one team: \`node tools/build.js\`.

## 1. HTML container

A container is also a scrolling container, so it **need height** (CSS or option \`height\`). It should be empty.

\`\`\`html
<link rel="stylesheet" href="./dist/abi7-grid.css">

<div id="gallery" style="height: 600px"></div>
\`\`\`

## 2. Initialization and data

Data is an array of objects. The core needs \`id\` and sizes (\`width\` + \`height\` or \`aspectRatio\`): geometry is calculated using them, without waiting for the images to load. For a standard card, fields are used \`src\` and \`title\`.

\`\`\`html
<script type="module">
  // Connecting Core. Plugin code is not included.
  import { ABI7Grid } from './dist/abi7-grid.js';

  const photos = [
    { id: 'p1', src: 'img/1.jpg', width: 1200, height: 800, title: 'Mountains' },
    { id: 'p2', src: 'img/2.jpg', width: 800,  height: 1200, title: 'Forest' }
  ];

  const grid = new ABI7Grid('#gallery', {
    layout: 'masonry',
    data: photos,
    layoutOptions: { gap: 12, minWidth: 180, maxColumns: 5 }
  });

  grid.on('ready', () => console.log('first layout completed'));
<\/script>
\`\`\`

If the pictures don't have dimensions, use \`layoutOptions.aspectRatio\` (all cards are of the same proportion) or \`virtualization.measure\` (height determined by content), see [Options](#/api-options).

## 3. Your type of card

\`\`\`js
const grid = new ABI7Grid('#cards', {
  data: users,                               // [{ id, name, bio }]
  layoutOptions: { aspectRatio: 0 },         // the height will be determined by the contents...
  virtualization: { measure: true, estimatedHeight: 140 },
  renderItem(user, el) {
    // Element is reused: update content in-place.
    el.replaceChildren();
    const h = document.createElement('h4');
    h.textContent = user.name;               // textContent is safe
    el.append(h);
  }
});
\`\`\`

## 4. Connecting plugins

\`\`\`html
<link rel="stylesheet" href="./plugins/selection/selection.css">
<script type="module">
  import SelectionPlugin from './plugins/selection/selection.js';
  grid.use(SelectionPlugin, { multiple: true });
  grid.getPlugin('selection').selectAll();
<\/script>
\`\`\`

Plugin styles are connected separately and only if the plugin is used.

## 5. Destruction

\`\`\`js
grid.destroy();   // listeners, observers, timers, plugins, DOM - everything is cleared
\`\`\`

After \`destroy()\` you can create a new grid on the same container.

## Connection: ES modules and script tags

| Method | Support |
|---|---|
| ES modules: \`import { ABI7Grid } from './dist/abi7-grid.js'\` inside \`<script type="module">\` | ✅ supported |
| Minified version: \`./dist/abi7-grid.min.js\` (same ES module format) | ✅ supported, tests run on both versions |
| Classic \`<script src="abi7-grid.js">\` without \`type="module"\` and global variable | ❌ **not supported**: UMD/IIFE assembly not implemented |

If you need a classic \`<script>\`, wrap the call in \`<script type="module">\` and, if necessary, assign \`window.ABI7Grid = ABI7Grid\`. Plugins are exported via \`export default\`, that is, they are also ES modules.

## Why ABI7 Grid

- **Two source files.** \`abi7-grid.js\` and \`abi7-grid.css\`. No build step is required to use them, and there are no runtime dependencies.
- **Three layouts, one engine.** Masonry, Grid and Justified share one layout contract; your own layouts plug in through the Layout API.
- **Virtualization.** Only the visible cards (plus overscan) are in the DOM; DOM nodes are pooled and reused.
- **Plugins.** An isolated Plugin API with automatic cleanup. Seven plugins are included in \`plugins/\`.
- **Documented from the code.** The test suite checks that every public method, option and event is described, and that the examples run.

`,he=`# Installation

ABI7 Grid has no runtime dependencies and needs no bundler. You load one JavaScript module and one stylesheet.

## Files

| File | Purpose |
|---|---|
| \`dist/abi7-grid.js\` | Core, readable (a byte-for-byte copy of \`src/abi7-grid.js\`) |
| \`dist/abi7-grid.min.js\` + \`.map\` | Core, minified with source map |
| \`dist/abi7-grid.css\` | Core styles (all selectors start with \`.abi7-\`) |
| \`dist/abi7-grid.min.css\` | Core styles, minified |
| \`plugins/<name>/<name>.js\` (+ \`.css\`) | Optional plugins, one directory each |

## Local installation

1. Download or clone https://github.com/abilogic/abi7-grid.
2. Copy \`dist/abi7-grid.min.js\` and \`dist/abi7-grid.min.css\` (and the plugins you need) into your project.
3. Serve the project over HTTP. ES modules do not load from \`file://\`; any static server works: \`npx serve .\` or \`python3 -m http.server\`.

## CDN installation

ABI7 Grid is not published to a package registry or an official CDN. Once the repository is public and a release tag exists, GitHub-backed CDNs such as jsDelivr can serve the files directly from the repository. The URL pattern is shown below; it will work only after the repository is public and the tag \`v1.0.0\` exists, and it has not been tested.

\`\`\`html
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/abilogic/abi7-grid@v1.0.0/dist/abi7-grid.min.css">
<script type="module">
  import { ABI7Grid } from 'https://cdn.jsdelivr.net/gh/abilogic/abi7-grid@v1.0.0/dist/abi7-grid.min.js';
<\/script>
\`\`\`

> Using a CDN does not change the license. The Community License covers non-commercial use only. Need ABI7 Grid for commercial projects? Get a commercial license at https://abi7.com

## npm

\`package.json\` is prepared for a future npm release but the package is **not published**. See \`docs/publishing.md\` in the repository for the publishing checklist. The \`license\` field is \`SEE LICENSE IN licenses/LICENSE-COMMUNITY.md\` because the Community License is not an open-source license.

## Basic HTML setup

\`\`\`html
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./dist/abi7-grid.min.css">
  <style>#gallery { height: 600px; }</style>
</head>
<body>
  <div id="gallery"></div>
  <script type="module">
    import { ABI7Grid } from './dist/abi7-grid.min.js';

    const data = Array.from({ length: 30 }, (_, i) => ({
      id: 'p' + i, title: 'Item ' + i, width: 600, height: 400 + (i % 5) * 80
    }));

    const grid = new ABI7Grid('#gallery', { data });
  <\/script>
</body>
</html>
\`\`\`

The container must be **empty** and must have a **height**: it is the scroll container.

## First grid instance

\`new ABI7Grid(target, options)\` takes a selector or an element. With \`autoRender: true\` (default) it starts in a microtask. Use \`await grid.whenReady()\` to wait for the first layout, and \`grid.destroy()\` to remove everything the grid added.

## Basic configuration

\`\`\`js
const grid = new ABI7Grid('#gallery', {
  layout: 'masonry',                                  // 'masonry' | 'grid' | 'justified' | plugin layout
  data,                                               // array, function or Promise
  fields: { src: 'url' },                             // map your property names
  layoutOptions: { gap: 12, minWidth: 180, maxColumns: 5 },
  virtualization: { enabled: true, overscan: 400 },
  animation: { enabled: true, duration: 300 }
});
\`\`\`

Every option is documented in [Options](#/api-options). Next: [Quick Start](#/getting-started).
`,ue="# Internal Architecture\n\nThis page is a technical map of `src/abi7-grid.js` (about 2,750 lines). It was written by tracing the code; function names are the real ones. It is intended for the maintainer.\n\n## File structure\n\nThe file has 15 numbered sections, in dependency order:\n\n| # | Section | What it contains |\n|---|---|---|\n| 1 | Utilities | `VERSION`, `ABI7Error`, `PluginError`, `mergeOptions`, `clonePlain`, `getPath`/`setPath`, `safeUrl`, a minimal semver (`parseVersion`, `satisfies`), `resolveElement` |\n| 2 | `EventEmitter` | event bus, `emitCancelable`, error isolation |\n| 3 | `OptionsManager` | `DEFAULTS`, merge, validation, `patch`, `set` |\n| 4 | `DataStore` | records, parallel `ids` array, `Map` id → index |\n| 5 | `GeometryStore` | `Float64Array` x/y/w/h + bucket index along the scroll axis |\n| 6 | Layout Engine | `MasonryLayout`, `GridLayout`, `JustifiedLayout`, `LayoutRegistry`, `LayoutManager` |\n| 7 | `VirtualizationEngine` | window + overscan + pinned selection, velocity tracking |\n| 8 | `DOMRenderer` | mount, bind, place, unmount, DOM Pool, class registry, size observer |\n| 9 | `AnimationManager` | `abi7-animating` class and CSS variables |\n| 10 | `PluginManager` | `use`/`unuse`, frozen `api` objects, dependency and version checks |\n| 11 | `InteractionManager` | one delegated click listener, Pointer Events Drag & Drop |\n| 12 | `LifecycleManager` | `AbortController`, tracked timers and animation frames |\n| 13 | `GridInstance` | the engine of one grid; connects everything |\n| 14 | Public API | class `ABI7Grid`, a thin façade with a private `#c` field |\n| 15 | Exports | `ABI7Grid`, `ABI7Error`, `PluginError`, `VERSION`, `API_VERSION` |\n\n## Component diagram\n\n```mermaid\nflowchart LR\n  API[ABI7Grid facade] --> GI[GridInstance]\n  GI --> OPT[OptionsManager]\n  GI --> DS[DataStore]\n  GI --> LM[LayoutManager]\n  LM --> LR[LayoutRegistry]\n  LM -->|ctx.set| GEO[GeometryStore]\n  GI --> VE[VirtualizationEngine]\n  VE -->|query| GEO\n  GI --> DR[DOMRenderer]\n  DR -->|mount / bind / place| DOM[(DOM)]\n  GI --> AM[AnimationManager]\n  GI --> PM[PluginManager]\n  GI --> IM[InteractionManager]\n  GI --> LC[LifecycleManager]\n  GI --> EV[EventEmitter]\n  PM -->|frozen api| PLUG[plugins]\n```\n\n## Instance lifecycle\n\n`getState().phase` takes one of these values:\n\n```mermaid\nstateDiagram-v2\n  [*] --> new: constructor\n  new --> loading: _start() (microtask or render())\n  loading --> pending: layout name not registered\n  pending --> loading: registerLayout()\n  loading --> ready: first layout:end\n  ready --> destroyed: destroy()\n  loading --> destroyed: destroy()\n  pending --> destroyed: destroy()\n```\n\n1. **Constructor** (`GridInstance`): resolves the element (`ALREADY_INITIALIZED` if `OWNERS` has it), creates managers, builds the root DOM (`_initDom`: adds class `abi7-grid`, `div.abi7-container`, saves original attributes), registers in `LIVE_INSTANCES` (a `Set` of `WeakRef`, used to notify instances when a layout is registered later). With `autoRender`, `_start()` is queued with `queueMicrotask`.\n2. **`_start()`**: adds the scroll listener, measures the viewport, creates the `ResizeObserver` (`autoResize`) and `IntersectionObserver`, attaches interactions, installs plugins from the `plugins` option, sets up the layout (`pending` if its name is unknown) and calls `loadData`.\n3. **First layout** (`runLayout`): sets `ready`, emits `ready`, resolves `whenReady()` waiters.\n4. **`destroy()`**: see below.\n\n## Update pipeline\n\n```mermaid\nsequenceDiagram\n  participant U as Your code\n  participant G as GridInstance\n  participant D as DataStore\n  participant L as LayoutManager\n  participant S as GeometryStore\n  participant V as VirtualizationEngine\n  participant R as DOMRenderer\n  U->>G: insert(items, {at})\n  G->>G: captureBefore() (scroll anchor)\n  G->>D: insert(list, at)\n  G->>R: reindex()\n  G->>G: invalidate(at, 'insert') -> schedule()\n  G-->>U: item:insert\n  Note over G: requestAnimationFrame (one per frame)\n  G->>G: frame() -> runLayout()\n  G-->>U: layout:start\n  G->>L: compute(from)\n  L->>S: ctx.set(i, x, y, w, h)\n  G->>S: buildIndex(axis)\n  G->>G: applyContentSize(), restoreAnchor()\n  G->>G: updateViewport(true)\n  G->>V: select(geo, window...)\n  G->>R: sync(indices)\n  R-->>U: item:mount / item:unmount\n  G-->>U: layout:end\n```\n\n### Preventing repeated recalculations\n\n- `invalidate(from, reason)` keeps `layoutFrom = min(layoutFrom, from)` and a list of reasons; it only calls `schedule()`.\n- `schedule()` returns immediately if a frame is already queued (`rafId`), so any number of calls in a frame produce **one** `frame()`.\n- `frame()` runs `runLayout()` only if `layoutFrom !== Infinity`, then `updateViewport()` only if `viewDirty`.\n- `onResize()` is guarded by a burst limit (10 per 500 ms) to break resize → layout → resize loops.\n- `flush()` cancels the queued frame and runs `frame()` synchronously.\n\n## Key functions\n\nEach entry: **role**, **called when**, **arguments → returns**, **calls**, **mutates**, **side effects**.\n\n### `GridInstance.invalidate(from, reason)`\n- Marks geometry dirty from index `from`. Called by `insert`, `remove`, `update`, `move`, `_applyLoaded`, `_optionsChanged`, `onResize`, `refresh`, plugin `geometry.invalidate`.\n- `(number, string) → void`. Calls `schedule()`. Mutates `layoutFrom`, `layoutReasons`.\n- Side effect: queues one `requestAnimationFrame` through `LifecycleManager.raf`.\n\n### `GridInstance.runLayout()`\n- Recomputes geometry from `layoutFrom`. Called by `frame()`, `ensureLayout()` (lazy layout for geometry queries) and `flush()`.\n- `() → boolean` (false if it cannot run: not started, no data, no engine, zero width).\n- Calls `layoutMgr.compute(from)`, `geo.buildIndex`, `applyContentSize`, `captureAnchor`/`restoreAnchor`, `updateViewport(true)`, `anim.begin()` for animated reasons. Emits `layout:start`, `layout:end`, and `ready` on the first pass.\n- Mutates `geo` (typed arrays, `epoch++`), the container's size, `scrollTop`/`scrollLeft` (after data reset or anchor restore), `ready`, `phase`.\n- Errors thrown by a layout are caught and reported as `error` with `source: 'layout'`.\n\n### `LayoutManager.compute(from)` / `makeContext(from)`\n- Builds the `ctx` object for the layout (width/height minus padding, `from`, `count`, `options`, `aspect(i)`, `resolveHeight`, `set`). The layout has no access to the DOM or to the core arrays. Returns the layout's `info`, which ends up in `layout:end.info`.\n\n### `MasonryLayout.compute(ctx)`\n- Chooses columns (see [Core Concepts](#/concepts)), computes a signature `cols|w|offX|gx|gy`; if it changed, drops the saved snapshots and starts from 0. Otherwise resumes from the nearest checkpoint (every 128 cards, `LAYOUT_CHECKPOINT`) at or below `from`, and places each remaining card in the shortest column.\n- Mutates its closure state (`st.sig`, `st.cp`) and calls `ctx.set` for each card.\n\n### `GeometryStore`\n- Holds `x`, `y`, `w`, `h` in `Float64Array`s and a `buckets` index (512 px) along the main scroll axis. `query(m0, m1, c0, c1, out)` returns sorted indexes crossing the window; `hit(x, y)` returns the card under a point. It knows only rectangles, so virtualization is independent of the layout.\n\n### `VirtualizationEngine.select(...)`\n- Returns indexes to mount: window ± overscan (`geo.query`) plus pinned ids. With `enabled: false` it returns all indexes. `track(pos)` smooths scroll velocity (`v = 0.4·old + 0.6·new`); with `adaptiveOverscan` the extra margin is `min(maxOverscan − overscan, |velocity| × 300)` in the scroll direction.\n\n### `GridInstance.updateViewport(force)`\n- Called after each layout and when `viewDirty`. Calls `virt.select`, `renderer.sync`, `_updateVisibility`, emits `scroll`, `viewport:update` (if something changed or `force`) and `_checkEnd` (`reach:end`).\n\n### `DOMRenderer.sync(indices)`\n- Unmounts every mounted card that is not wanted, then mounts missing ones into a `DocumentFragment` appended to the container in one operation; for cards already mounted it calls `_place`. Returns whether anything changed.\n- `_mount(id, index)`: takes an element from the pool (`reused++`) or creates one (`created++`, `role=\"listitem\"`), binds, places, and observes it when measuring.\n- `_bind(ent)`: sets `className`, `data-index`, `data-id`, calls `renderItem` or `_defaultContent` (DOM API only; URL via `safeUrl`). Errors → `error` with `source: 'renderItem'`.\n- `_place(ent)`: writes `transform`, `width`, `height` only if `ent.epoch !== geo.epoch`.\n- `_unmount(id)`: emits `item:unmount`, calls `releaseItem`, unobserves, removes the element, pushes it to the pool up to `poolSize`.\n- `toggleClass(id, cls, force)`: records the class per id (`itemClasses`) so `_baseClass(id)` re-applies it on every bind.\n\n### `GridInstance.onScroll()` / `onResize()`\n- `onScroll` sets `viewDirty`, schedules a frame, and (re)starts a 140 ms idle timer that emits `scroll:stop`. The scroll listener is `passive`.\n- `onResize` compares sizes, updates `vp`, decides by the layout's `responsive` value whether to invalidate, emits `resize`.\n\n### `loadData` / `_applyLoaded` / `setData`\n- `loadData(source, kind)` increments `loadToken`, aborts the previous `AbortController`, calls a function source with `{ signal, source }`, and applies the result only if the token is still current. `_applyLoaded` replaces the store, clears caches, resets scroll on the next layout, rebinds mounted cards, emits `data:load-end` and invalidates from 0.\n\n### `PluginManager.use(plugin, options)`\n- Validates the contract and name (`/^[a-z][a-z0-9._:-]*$/i`), checks `apiVersion` with `satisfies`, checks dependencies, merges `defaults` with options (frozen), builds the frozen `api` (events, features, layouts, data, geometry, viewport, renderer, options, lifecycle), runs `install`. If installation throws, everything registered so far is rolled back.\n- `unuse(name)` / `destroyAll()` run the cleanup in this order: the function returned by `install`, then `onDestroy`/`addDisposable` callbacks (reverse order), then automatic removal of subscriptions, features and layouts. Errors in cleanup are reported and do not stop later steps.\n\n### `InteractionManager`\n- Attaches one delegated listener per DOM event type to the container (not per card), plus `pointerdown` for drag. Drag listeners on `document` and `window` are added on `pointerdown` and removed in `_finish`. All listeners use the lifecycle's `AbortSignal`, so `detach()` and `destroy()` remove them with one abort.\n\n## Teardown\n\n`GridInstance.destroy()` runs in this order:\n\n1. set `_destroying`, emit `destroy`;\n2. `plugins.destroyAll()` (reverse installation order);\n3. `interaction.detach()`;\n4. abort the pending data load and bump `loadToken`;\n5. disconnect the `ResizeObserver` and `IntersectionObserver`;\n6. `renderer.destroy()`, `anim.stop()`;\n7. `life.dispose()` — aborts the `AbortController` (all listeners), clears timers, cancels animation frames;\n8. remove `div.abi7-container`, restore the root's original attributes, delete from `OWNERS` and `LIVE_INSTANCES`;\n9. clear events, reset the data store, set `phase = 'destroyed'`, reject pending `whenReady()` promises with `DESTROYED`.\n\nAfter this every public method throws `ABI7Error` with code `DESTROYED` (through `assertAlive()`).\n\n## CSS interaction\n\nThe core adds classes to the root: `abi7-grid`, `abi7-layout-<name>`, `abi7-axis-x` / `abi7-axis-y`, `abi7-draggable`, `abi7-animating` (only during rearrangements) and `abi7-drag-active` during drags. It sets CSS variables `--abi7-height`, `--abi7-duration`, `--abi7-easing` on the root. Cards are `position: absolute; top: 0; left: 0` with `contain: layout paint; will-change: transform`. The transition rule applies only under `.abi7-animating`.\n\n## Where the performance risks are\n\n| Place | Risk | Mitigation in code |\n|---|---|---|\n| `runLayout` from index 0 | O(n) for edits near the start or width changes | checkpoints in Masonry; partial `from` for later edits |\n| `renderItem` | runs on every bind | the standard card updates children in place |\n| `sync` | mount/unmount churn on fast scroll | DOM Pool, adaptive overscan, one `DocumentFragment` |\n| `measure: true` | one `ResizeObserver` entry per mounted card; measured heights trigger partial layouts | Dynamic Size Cache |\n| `getState()` and plugin read methods | `data.get()` and `ids()` copy arrays | use `getByIndex` / `count` in hot paths |\n| Forced reflow in `AnimationManager.begin()` | one reflow per animated rearrangement | only when animation is enabled |\n",me="# Layouts\n\nLayout is an algorithm that, based on the entries and width of the container, calculates the position and size of each card. Selectable by option `layout`, customizable `layoutOptions`, switches on the fly: `grid.rebuild({ layout: 'justified' })`.\n\nAll layouts return geometry in the same format:\n\n```js\n{ id: 'photo-123', index: 0, x: 0, y: 0, width: 240, height: 180, right: 240, bottom: 180 }\n```\n\nYou can get it like this: `grid.getItem('photo-123').rect`.\n\n## Masonry\n\nCards of the same width are stacked in columns; each new card goes to **the shortest column**. The height is determined by the data (aspect ratio / height of the record), so the picture is not needed to calculate the layout.\n\n**Algorithm.**\n\n1. Number of columns: `columns`, otherwise `floor((W + gap) / (minWidth + gap))`, limited `maxColumns`.\n2. Width: `floor((W − gap·(cols−1)) / cols)`, but no more `maxWidth`; the column block is centered (`align`).\n3. For each card from `from`: select the column with the minimum height, write `x/y`, increase the column height.\n4. Every 128 cards, a snapshot of the column heights is saved. Partial recalculation starts from the nearest snapshot, and not from the beginning.\n\n```js\nnew ABI7Grid('#g', { layout: 'masonry', data,\n  layoutOptions: { gap: 12, minWidth: 180, maxColumns: 5 } });\n```\n\n:::demo masonry\n\n## Grid\n\nClassic grid: cells are the same width, rows are aligned in height. Columns — `columns` (fixed), `width` (fixed cell width) or automatically by `minWidth`. Height — `aspectRatio` (default `1`), `itemHeight`, or `aspectRatio: 0` — then it is taken from the records (the row is aligned to the highest). The cell position is calculated arithmetically, so the recalculation is very fast; For partial recalculation, the upper boundaries of the rows are stored.\n\n```js\nnew ABI7Grid('#g', { layout: 'grid', data,\n  layoutOptions: { columns: 4, gap: 12, aspectRatio: 1.5 } });\n```\n\n:::demo grid\n\n## Justified\n\nPhoto gallery with rows of cards of the same height and different widths (like Flickr / Google Photos).\n\n**Algorithm.** Cards are added to the row until the row, scaled to the width of the container, is lower `targetRowHeight`. Then the best option is selected: **with** last card or **without** her - the one whose height is closer to the goal, taking into account the boundaries `minRowHeight` / `maxRowHeight`. The height of the row is selected so that the row **exactly** filled the width: `h = (W − gap·(n−1)) / Σ aspect`. The widths are rounded cumulatively, and the right border of the last card in the row is equal to `W` — there are no overlaps or cracks.\n\nThe last (incomplete) line is not stretched: it gets `targetRowHeight` and aligned to `lastRow` (`left`, `center`, `right`) or stretched (`justify`, but not higher `maxRowHeight`). Additional data loading (`insert` to the end) recalculates only the last row and new ones.\n\n```js\nnew ABI7Grid('#g', { layout: 'justified', data,\n  layoutOptions: { targetRowHeight: 240, minRowHeight: 150, maxRowHeight: 320, gap: 10, lastRow: 'left' } });\n```\n\n:::demo justified\n\n## Horizontal (plugin)\n\nHorizontal strip: cards of the same height and different widths (`width = height × aspect`), scroll horizontally. Connected by plugin `@abi7/layout-horizontal` — Core knows nothing about him; this is an example of a third-party layout.\n\n```js\nimport HorizontalLayout from './plugins/layout-horizontal/horizontal.js';\n\nconst grid = new ABI7Grid('#strip', { layout: 'horizontal', data,\n  layoutOptions: { height: 200, gap: 12 } });\ngrid.use(HorizontalLayout);              // or ABI7Grid.registerLayout('horizontal', HorizontalLayout)\n```\n\nThe layout name can be specified before connecting the plugin: the grid will go into the state `pending` and will continue to run as soon as the layout appears. If the plugin is disabled (`grid.unuse('layout-horizontal')`), the grid will return to `masonry` and will report this event `error` (`LAYOUT_REMOVED`).\n\n:::demo horizontal\n\n## Changing sizes and aspect ratio\n\n- Changing the container size (ResizeObserver) causes a complete recalculation — `layout:end` with `reason: 'resize'`.\n- Changing aspect ratio / recording sizes: `grid.update(id, { width, height })` — recalculation begins with this entry.\n- Layout, depending only on the width (`responsive: 'width'`), are not recalculated when the container height changes.\n\n## Your layout\n\nLayout - an object with a method `compute(ctx)`. The full contract and example are in the [Layout API] section](#/api-plugin/layout-api).\n",pe=`:::markdown licenses/LICENSE-COMMUNITY.md

`,Ie=`# Overview

## What is ABI7 Grid?

**ABI7 Grid** is a dependency-free JavaScript library for tiled grids and photo galleries: Masonry, Grid and Justified layouts, virtualization for tens of thousands of cards, Drag & Drop and a plugin system. It is written in plain ES2022 and needs no framework.

ABI7 Grid is a JavaScript grid library based on the original Abi7Grid code created by Alexander Momot.

> The core consists of exactly **two** source files: \`src/abi7-grid.js\` and \`src/abi7-grid.css\` (plus the minified \`dist/*.min.*\` generated from them). Everything else is a plugin that you load only when you need it.

## Key features

- **Three built-in layouts** — Masonry, Grid, Justified. Custom algorithms are added by a plugin without changing the core.
- **Layout-independent virtualization** — only visible cards are in the DOM; the DOM Pool reuses nodes; adaptive overscan; Scroll Anchoring; \`scrollToIndex\`.
- **Partial recalculation** — inserting or removing a record recalculates geometry from the changed index, not from the start.
- **Plugins** — isolated Plugin API, automatic cleanup, compatibility and dependency checks.
- **Drag & Drop** — mouse and touch (Pointer Events), auto-scroll, works with virtualization and any layout.
- **Safe by default** — the standard card is built with the DOM API and URLs are filtered, so HTML in data is not executed.
- **Correct \`destroy()\`** — removes listeners, observers, timers and plugins and restores the container.

## Architecture overview

Each component does one thing and talks to the others through a narrow interface.

| Component | Responsible for | Does not know about |
|---|---|---|
| Layout Engine | geometry: where each card is and how large | the DOM, virtualization |
| Virtualization Engine | which cards must be in the DOM | the concrete layout |
| DOM Renderer | creating, binding and reusing card elements | layout algorithms |
| Plugin Manager | installing plugins and their frozen \`api\` | the core's internal arrays |
| Interaction Manager | clicks and Drag & Drop | the concrete layout |

Details: [Architecture Overview](#/architecture) and [Internal Architecture](#/internals).

## Browser compatibility

The code is plain ES2022 (private class fields, \`WeakRef\`, \`AbortController\`, \`queueMicrotask\`) and the minified build targets \`es2022\`. Current evergreen browsers are the intended targets.

- \`ResizeObserver\` is used for container size changes (\`autoResize\`) and for \`virtualization.measure\`. If it is missing, call \`refresh()\` yourself.
- \`IntersectionObserver\` is optional; it only feeds the \`visibility:change\` event and a size check when the grid becomes visible.
- Pointer Events are used for clicks and Drag & Drop.
- **Not verified:** the automated tests run in jsdom, not in real browsers. Visual behavior (animation, touch, scrollbars) has not been tested on devices. Test in the browsers you support.

## Performance philosophy

1. **Compute geometry from data, not from the DOM.** Sizes come from \`width\`/\`height\` or \`aspectRatio\` in the records, so no layout thrashing and no waiting for images.
2. **Touch the DOM in one place.** Only the DOM Renderer creates or changes card elements, and it writes \`transform\`, \`width\` and \`height\` only when the geometry epoch changed.
3. **Do as little as possible per frame.** Work is batched into one \`requestAnimationFrame\`; repeated requests in a frame are merged.
4. **Mount only what is needed.** Virtualization limits DOM size, independent of layout.
5. **Recalculate from the changed position.** Layouts support partial recalculation.

See [Performance](#/performance).

## Known limitations

- ES modules only. There is no UMD/IIFE build and no classic \`<script src>\` form; ES modules do not load from \`file://\` pages.
- The scroll container is the grid element itself. Scrolling \`window\` or an external container is not supported.
- With \`virtualization.measure\`, dynamic heights are refined only for cards that have been inside the window.
- A change near the start of the list recalculates the geometry below it (O(n)).
`,Ae="# Performance\n\n## How the layout engine works\n\n1. Changes call `invalidate(from, reason)`. The lowest `from` wins; the pass runs in one `requestAnimationFrame`.\n2. The layout computes rectangles **only from index `from`**. Masonry keeps a snapshot of column heights every 128 cards (`LAYOUT_CHECKPOINT`) so it can resume without recomputing from the start.\n3. Rectangles go into typed arrays, and a spatial index (buckets of 512 px along the scroll axis) makes window queries cost O(k) in the number of visible cards.\n4. The Virtualization Engine selects indexes for the window plus overscan, and the DOM Renderer mounts and unmounts the difference.\n\n## Measuring performance\n\n- `layout:end` reports `duration` (ms), `from`, `count` and `animated`.\n- `grid.getState().virtualization` reports `mounted`, `pooled`, `created` and `reused`. A healthy long scroll shows `created` flat and `reused` growing.\n- Use the browser's Performance panel for paint and style costs; the core does not collect frame statistics.\n\n## Optimizing the DOM\n\n- Keep cards small. The default card is one `<img>` and one caption.\n- `renderItem` runs every time a node is bound to a record: update in place, do not create new subtrees every time, and clean up in `releaseItem`.\n- Keep `virtualization.enabled: true` for more than a few hundred records.\n- Give records `width`/`height`; avoid `measure: true` unless heights depend on content (each mounted card is observed).\n\n## Minimizing reflow and repaint\n\n- Cards move with `transform` (compositor-friendly) and have `contain: layout paint` in the stylesheet.\n- Geometry is computed from data, so the core does not read layout from the DOM for every card.\n- Animation is applied only during rearrangements (the root gets `abi7-animating` for the duration) and never during scrolling.\n- Batch data changes: several `insert()` calls in one tick cost one layout pass. Prefer one `insert(array)` over a loop of single inserts.\n\n## Large numbers of cards\n\nThe test suite runs 50,000 records. Only the visible window is in the DOM, and `scrollToIndex(25000)` does not create DOM for the cards in between. Remaining costs are O(n): changes near the start of the list recalculate geometry below them, and memory for the records and typed arrays. Return image URLs from `fields.src` as a getter so they are computed only for mounted cards.\n\n:::demo virtualization\n\n## Browser limits\n\nVery tall content hits the browser's maximum element height (this differs between browsers). Not tested at that scale. Images decode and load according to the browser (`loading=\"lazy\"`).\n\n## Recommendations\n\n1. Always provide record dimensions.\n2. Keep `overscan` moderate; raise `poolSize` only if `created` keeps growing.\n3. Disable animation for very large rearrangements (`animation: { enabled: false }` or `duration: 0`).\n4. Batch updates; call `flush()` only when you need layout right now.\n5. Remove plugins you do not use; each subscribes to events.\n",Ce="# How to create your own ABI7 Grid plugin\n\nAfter this tutorial you will be able to write a plugin, **without reading the Core source code**. All you need is a public Plugin API.\n\n## Step by step\n\n### 1. Create a directory\n\n```text\nplugins/\n└── my-plugin/\n    ├── my-plugin.js # plugin code (ES module, export default)\n    ├── my-plugin.css # styles - only if needed\n    ├── README.md\n    └── package.json\n```\n\nOne plugin - one directory. The user connects only what he uses.\n\n### 2. Create a JS file and declare the plugin\n\n```js\n// my-plugin.js\nexport default {\n  name: 'my-plugin',          // unique name; event namespace\n  version: '1.0.0',           // version of the plugin itself (semver)\n  apiVersion: '^1.0.0',       // what versions of the core API is the plugin compatible with?\n  defaults: { enabled: true },// default option values\n\n  install(api, options) {\n    // ...all logic\n    return () => { /* cleaning */ };\n  }\n};\n```\n\nPlugin **does not import Core**: it communicates with the grid only through `api`.\n\n### 3. Create package.json\n\n```json\n{\n  \"name\": \"@your-scope/abi7-my-plugin\",\n  \"version\": \"1.0.0\",\n  \"type\": \"module\",\n  \"main\": \"my-plugin.js\",\n  \"style\": \"my-plugin.css\",\n  \"files\": [\"my-plugin.js\", \"my-plugin.css\", \"README.md\"],\n  \"peerDependencies\": { \"abi7-grid\": \"^1.0.0\" },\n  \"license\": \"<YOUR-PLUGIN-LICENSE>\"\n}\n```\n\nThe core is specified as `peerDependency`, not `dependency`: the plugin should not pull its own copy.\n\n### 4. Connect to Core\n\n```js\nimport { ABI7Grid } from './dist/abi7-grid.js';\nimport MyPlugin from './plugins/my-plugin/my-plugin.js';\n\nconst grid = new ABI7Grid('#gallery', { data });\ngrid.use(MyPlugin, { enabled: true });\n```\n\n### 5. Use the Plugin API\n\nNine interfaces (`events`, `layouts`, `features`, `data`, `geometry`, `viewport`, `renderer`, `options`, `lifecycle`) are described in [Plugin API](#/api-plugin). Selection Rule: **event** — to react **feature** — to give methods, **renderer** — to change the view **geometry/viewport** — to know \"where\".\n\n### 6. Register Methods\n\n```js\napi.features.register('my-plugin', { doSomething() {}, getValue: () => value });\n// user: grid.getPlugin('my-plugin').doSomething();\n```\n\n### 7. Work with events\n\n```js\napi.events.on('item:click', (e) => { if (!e.defaultPrevented) { /* ... */ } });\n```\n\nSubscriptions via `api.events` are removed automatically.\n\n### 8. Create your own events\n\n```js\napi.events.emit('my-plugin:changed', { value });                 // notice\nconst ok = api.events.emitCancelable('my-plugin:before-save', {}); // can be canceled\n```\n\nThe event name must begin with `my-plugin:` — the core prevents the plugin from generating other people's events.\n\n### 9. Work with settings\n\n`options` — frozen object: `plugin.defaults`, combined with what the user submitted. Don't change it; For changeable values, create local variables.\n\n### 10. Include CSS\n\nThe plugin CSS file is connected separately by the user (`<link>`). Start all classes with the plugin prefix (`.abi7-lb-*`, `.abi7-selected`), without global selectors.\n\n### 11. Handle errors\n\nThrow the usual ones `Error` in `install()` if the configuration is incorrect, the core will roll back the installation and wrap the error in `PluginError`. In event handlers, exceptions are safe for the grid (they will go to the event `error`), but it's better to handle expected situations yourself.\n\n### 12. Clean up resources\n\nEverything the plugin created **outside** API — `addEventListener`, `setTimeout`, `observer`, elements in `document.body` — he must clean it himself. Two ways:\n\n```js\n// method 1: cleaning function\nreturn () => { clearInterval(timer); overlay.remove(); };\n\n// method 2: register next to creation\nroot.addEventListener('keydown', onKey);\napi.lifecycle.addDisposable(() => root.removeEventListener('keydown', onKey));\n```\n\nOne is convenient for a group of listeners `AbortController`: `addEventListener(..., { signal })`, and in cleaning `controller.abort()` (that's how Lightbox is made).\n\n### 13. Testing\n\nThe plugin is checked on the real grid: install, call methods, disable and make sure that nothing is left. Template (Node + jsdom, as in `tests/`):\n\n```js\ngrid.use(MyPlugin);\n// ...actions\ngrid.unuse('my-plugin');\nassert.equal(document.querySelectorAll('.my-plugin-node').length, 0);   // DOM removed\nassert.equal(grid.getPlugin('my-plugin'), null);                         // feature removed\ngrid.destroy();\n```\n\nCheck: connection and disconnection, repeated `use()`, two copies with independent state, `destroy()` no errors.\n\n### 14. Publication\n\n1. Fill in `README.md`: options, feature methods, events, CSS connection.\n2. Please indicate correct `apiVersion`: API range on which the plugin is tested.\n3. `npm publish` from the plugin directory. Name - according to the scheme `@scope/abi7-name`.\n\n## Recipes: three plugins of varying complexity\n\nBelow are the actual project files (`examples/custom-plugin/recipes.js`); they are verified by tests.\n\n:::file examples/custom-plugin/recipes.js\n\n- **LoggerPlugin** — minimum: subscription to `'*'`,feature,options.\n- **TooltipPlugin** — working with reused DOM nodes: the attribute is placed on **everyone** `item:mount`.\n- **KeyboardNavPlugin** — navigation by arrows for any layout via `api.geometry.hitTest`, scroll through `api.viewport`, custom events, clearing the DOM listener.\n\n## Full example: CounterPlugin from scratch\n\nThe plugin counts clicks on cards, stores counters separately for each grid, registers methods, generates its own events, and can be reset and disabled correctly. It is launched below; the code is the same file that is executed in the iframe.\n\n:::demo custom-plugin\n\n### Point by point analysis\n\n1. **Plugin object** — ordinary object `CounterPlugin = { name, version, apiVersion, defaults, install }`. The core does not require class or inheritance.\n2. **`name`** — plugin identifier within the grid: they work on it `unuse('counter')`, reinstallation protection and event namespace (`counter:*`).\n3. **`version`** — plugin version (semver); visible in `getPlugins()` and in the event `plugin:install`.\n4. **`apiVersion`** — core API version range (`^1.0.0`). If the core is not suitable, `use()` throws `PLUGIN_INCOMPATIBLE` and does not install anything - the plugin will not silently break on an incompatible core.\n5. **`install(api, options)`** — called once when `use()`, synchronously. `this` — the plugin object itself. The return function is cleanup.\n6. **`api`** — frozen object with nine interfaces; the only way to interact with the core.\n7. **Subscribe to events** — `api.events.on('item:click', handler)`. There is no need to unsubscribe manually.\n8. **Public method** — `api.features.register('counter', { getTotal, reset, top })`.\n9. **Calling a Method** — `grid.getPlugin('counter').getTotal()`.\n10. **Own event** — `api.events.emit('counter:change', { id, count, total })`; prefix `counter:` required. Subscription: `grid.on('counter:change', ...)`.\n11. **Settings** — second argument `install` (`step`, `badges`, `filter`): default values from `defaults` + what was transferred to `grid.use(CounterPlugin, { step: 2 })`.\n12. **Shutdown** — `grid.unuse('counter')`: the cleaning function removes icons, then subscriptions and features are removed; `getPlugin('counter')` will return `null`.\n13. **`destroy()`** — for each plugin the same cleanup is called, then comes `plugin:uninstall` with `reason: 'destroy'`.\n14. **Memory leaks** — all subscriptions go through `api.events` (removed automatically); `Map` counters are cleared in the clear function; no references to DOM nodes after `unuse()`; own `addEventListener` must be removed for cleaning (see recipes).\n15. **State separately for each instance** — `total` and `perItem` announced **inside** `install()`: each call creates a new closure. Module-level variables would be common to all grids.\n16. **Working with the DOM** — nodes are reused (DOM Pool), so an icon is placed on each `item:mount` and cleans up `item:unmount`; the element is taken through `api.renderer.getElement(id)` (maybe `null`, if the card is not in the DOM); text - only `textContent`.\n17. **Error Handling** — the exception in the handler does not break the grid (it comes in the event `error` with `source: 'plugin:counter'`); exception in `install()` rolls back the installation; check `event.defaultPrevented` allows you to respect the “cancellation” of the click by other handlers.\n\n### How to connect and make sure everything works\n\n```js\nimport CounterPlugin from './counter-plugin.js';\n\ngrid.use(CounterPlugin, { step: 1 });\ngrid.on('counter:change', (e) => console.log(e.total));\ngrid.getPlugin('counter').top(3);     // most clicked cards\ngrid.unuse('counter');                // icons disappeared, getPlugin('counter') === null\n```\n",Ee=`# Plugin Examples

Four plugins in \`plugins/\` show different ways to extend the core. They were written against the real Plugin API and need no changes to the core. Where the core has no hook for something, the plugin says so instead of pretending.

## What plugins can and cannot do

| Plugins can | Plugins cannot |
|---|---|
| Subscribe to any core event, cancel clicks | Replace the core's animation engine (it is CSS-driven and has no hooks) |
| Add classes per record (\`api.renderer.toggleClass\`) | Touch card elements directly in a way that survives reuse |
| Read geometry and hit-test (\`api.geometry\`, \`api.viewport\`) | Use the card's own \`transform\`, \`width\`, \`height\` (the core writes them) |
| Change options (\`api.options.set\`) | Access the core's internal arrays |
| Register layouts, public features and events | Emit events without their own namespace |

## Hover Effects

Uses the core geometry (\`api.viewport.indexAtClientPoint\`) to find the hovered record, marks it with \`toggleClass\`, and drives effects with CSS on the card's children. It never modifies the card's \`transform\`.

:::demo plugin-hover

## Reveal Effects

Listens to \`item:mount\` and adds a "pre" class by record id for two frames, so the browser can transition the card's children to their normal state. Because DOM nodes are reused, \`once: true\` remembers revealed ids.

:::demo plugin-reveal

## Animation and Custom Transitions

The core animates only rearrangements (insert, remove, move, resize, layout change) with CSS transitions controlled by \`animation.enabled\`, \`duration\` and \`easing\`. The Transitions plugin does not invent another engine: it switches these options via \`api.options.set\` using named presets, and lets you define your own.

:::demo plugin-transitions

## Multiple plugins and configuration

Every plugin has its own options and state. Install them with \`grid.use()\` or the \`plugins\` option; read back with \`getPlugins()\`.

:::demo plugin-multiple

## A custom plugin from scratch

See [Building Your First Plugin](#/first-plugin) and the larger \`CounterPlugin\` in the [Plugin Development Guide](#/plugin-development).

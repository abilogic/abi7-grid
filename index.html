 All notable changes to ABI7 Grid Community. The version numbers describe this repository only.
 
+## Unreleased — performance review
+
+Behaviour and public API are unchanged. See \`docs/PERFORMANCE-REVIEW.md\` for measurements.
+
+### Core
+- \`DataStore.insert()\` appends in place (no copy of the whole data set per call): 1000 single appends on 50k records 1100 ms → 12 ms.
+- \`DataStore.remove()\` compacts in place from the first removed index and no longer rebuilds the id → index Map.
+- \`GeometryStore\` tracks real rectangle changes and updates the bucket index incrementally (full rebuild only when the bucket structure changes).
+- \`updateViewport()\` no longer reads \`scrollTop\`/\`scrollLeft\` after mutating the DOM (forced synchronous layout on every frame that mounted a card).
+- \`onScroll()\` keeps one idle timer per gesture instead of \`clearTimeout\` + \`setTimeout\` on every scroll event.
+- \`DOMRenderer.sync()\` uses generation stamps instead of building a \`Set\` and copying the key list on every frame.
+- \`prefers-reduced-motion\` \`MediaQueryList\` is created once per window instead of once per layout pass.
+- Masonry/Grid allocate one \`fixed\` object per layout pass instead of one per item; pinned items are merged with a binary search; \`visible()\` can reuse a buffer; \`emit()\` returns early when nobody listens; drag reads \`getBoundingClientRect()\` once per pointer move.
+
+### Plugins
+- \`selection\`: \`select()\` / \`deselect()\` apply a one-id delta instead of cloning and diffing the whole selection.
+- \`reveal\`: one pair of animation frames per mount batch instead of per card.
+
+### Tooling
+- \`tests/perf.test.js\` (46 checks incl. randomised comparison against brute force), \`bench/bench.mjs\`, \`bench/compare.mjs\`.

`,dh="# ABI7 Grid — аудит производительности\n\nВерсия кода: коммит `bcc3a82` (ABI7 Grid 1.0.0). Проверено: `src/abi7-grid.js` (2755 строк), `src/abi7-grid.css`, 7 плагинов.\nПубличный API и поведение не менялись. Все 164 существующих теста проходят, добавлено 46 новых, итого 210/210.\n\n## 1. Резюме\n\nЯдро написано аккуратно: типизированные массивы для геометрии, пространственный индекс, DOM-пул, частичный пересчёт\nраскладки, всё в одном `requestAnimationFrame`. Крупных алгоритмических проблем на горячем пути скролла нет.\nНайдено **11 проблем**: 10 исправлены в коде, одна (композитные слои, №11) оставлена на ваше решение. Отдельно в §4 описана рекомендация про `pointermove`.\nСамые заметные находки касаются не скролла, а **изменения данных** (`insert` / `remove`) и **накладных расходов на каждый кадр**.\n\n| # | Проблема | Где | Влияние | Статус |\n|---|---|---|---|---|\n| 1 | `insert()` копирует оба массива данных при каждом вызове: O(n) на вставку, O(n²) на цикл одиночных вставок | `DataStore.insert` | **Высокое.** 1000 вставок в конец на 50k записей: 1123 мс | исправлено |\n| 2 | `remove()` сканирует весь массив, строит новые массивы и новую `Map`, переиндексирует с 0 | `DataStore.remove` | **Высокое.** Удаление 1 карточки около конца на 100k: 23,6 мс | исправлено |\n| 3 | Пространственный индекс перестраивается **целиком** после каждого layout, хотя раскладка пересчитала только хвост | `GeometryStore.buildIndex` | **Среднее.** Append в сетку на 100k: 6,4 мс; после исправления 1,1 мс, то есть индекс давал ≈ 5 мс | исправлено |\n| 4 | После изменения DOM в `updateViewport` читается `root.scrollTop/Left`, что вызывает **принудительный синхронный layout** (forced reflow) в каждом кадре, где карточки монтировались | `GridInstance.updateViewport` | **Высокое в браузере** (в jsdom не измерить) | исправлено |\n| 5 | На каждое scroll-событие вызываются `clearTimeout` и `setTimeout` (плюс замыкание и операции с `Set`) | `GridInstance.onScroll` | Среднее: 1000 таймеров на 1000 кадров | исправлено |\n| 6 | `DOMRenderer.sync()` на каждом кадре строит `Set` и копирует список ключей `Map` | `DOMRenderer.sync` | Низкое: лишние аллокации и GC | исправлено |\n| 7 | `matchMedia()` создаёт новый `MediaQueryList` при каждом layout-проходе | `AnimationManager.enabled` | Низкое: 100 вызовов на 100 вставок | исправлено |\n| 8 | Мелочи на горячих путях: объект `{height, aspectRatio}` на каждую карточку в Masonry/Grid, `Array#includes` для pinned, новый массив в каждом `visible()`, `emit()` собирает массив групп без слушателей, два `getBoundingClientRect()` на каждый `pointermove` при drag | ядро | Низкое | исправлено |\n| 9 | `selection.select/deselect` клонирует всё выделение и сравнивает его целиком: O(selected) на клик | плагин `selection` | **Среднее** после `selectAll()`: 14,2 мс на клик при 40k выделенных | исправлено |\n| 10 | `reveal` регистрирует 2 вложенных `requestAnimationFrame` **на каждую** смонтированную карточку | плагин `reveal` | Среднее: 8132 rAF-регистрации на 200 кадров быстрого скролла | исправлено |\n| 11 | Композитные слои: `will-change: transform` **и** `translate3d` на каждой карточке дают отдельный слой GPU для каждой смонтированной карточки | `src/abi7-grid.css`, `DOMRenderer._place` | Возможно высокое на слабых GPU и мобильных; в песочнице не измерить | **не исправлено**, см. §4 |\n\n## 2. Что и как исправлено\n\n### 2.1. `DataStore.insert` и `remove` (проблемы 1, 2)\n* **Было:** `records = records.slice(0, at).concat(list, records.slice(at))`, то же для `ids`. Каждый вызов копирует n элементов.\n  `remove` проходит по всем n, собирает новые массивы и строит новую `Map` с нуля.\n* **Стало:** вставка в конец делает `push`. Вставка в середину делает `splice` (для списков больше 10 000 элементов остаётся прежний путь, чтобы не упереться в лимит аргументов).\n  Для `remove` позиция первого удаляемого находится через `Map id→index`. Дальше массивы уплотняются **на месте, начиная с этой позиции**.\n  `Map` обновляется только для сдвинутых элементов. Порядок `removed` (по возрастанию индекса) и все события сохранены.\n\n### 2.2. Инкрементальный пространственный индекс (проблема 3)\n* `GeometryStore.set()` теперь записывает только реально изменившиеся прямоугольники и запоминает минимальный изменённый слот (`_dirty`).\n  Раскладки (Masonry с чекпоинтами, Justified с пересчётом строки) пересчитывают несколько элементов до `from`, и многие из них получают прежние координаты.\n* `buildIndex()` использует инвариант «списки в корзинах отсортированы по возрастанию номера слота».\n  Из каждой корзины отрезается хвост `>= from`, затем добавляются только изменённые слоты: O(корзины + изменённые) вместо O(все элементы).\n* **Безопасный откат на полную перестройку**, когда структура корзин могла измениться: сменилась ось, число корзин уменьшилось, или какой-то прямоугольник «прижат» к последней корзине (`_idxOverflow`).\n  Последний случай возможен только у кастомной раскладки, которая возвращает высоту меньше своих элементов.\n\n### 2.3. Принудительный reflow в каждом кадре (проблема 4)\n`updateViewport` читает позицию скролла в `viewMetrics()` **до** `renderer.sync()`, а потом читал `root.scrollTop` ещё раз **после** того, как `sync` смонтировал, размонтировал и переместил карточки.\nЧтение геометрии после записи стилей заставляет браузер выполнить layout синхронно, прямо внутри rAF-кадра, и это происходило в каждом кадре с изменениями DOM.\nТеперь значения берутся из уже прочитанных `m.sMain` / `m.sCross`. Содержимое события `scroll` не изменилось (проверено для вертикальной и горизонтальной осей).\n\n### 2.4. Остальное\n* `onScroll`: одно событие, одна метка времени `_lastScrollAt`, **один** таймер, который перезапускается на остаток, если за время ожидания был ещё скролл. `scroll:stop` срабатывает через те же 140 мс тишины.\n* `sync()`: штампы поколений на записях вместо `Set` и `[...keys()]`. `Map` обходится только если там есть то, что надо убрать.\n* `matchMedia`: один живой `MediaQueryList` на окно. Если подменить `window.matchMedia`, объект создаётся заново.\n* Прочие мелочи: одна `fixed`-структура на проход, бинарный поиск для pinned, буфер для `visible()`, ранний выход в `emit()`, одно чтение `getBoundingClientRect()` на `pointermove` при drag.\n* `selection`: `select` и `deselect` применяют дельту из одного id, события и порядок `selected` те же.\n* `reveal`: одна пара кадров на **пачку** смонтированных карточек. Карточки, смонтированные позже, образуют новую пачку и получают собственные два кадра, поэтому «скрытое состояние» по-прежнему успевает отрисоваться.\n\n## 3. Измерения\n\nОкружение: Node v20.20.2, 2 vCPU Intel Xeon @ 2.6 GHz, jsdom. Значения — медиана 5 запусков (`bench/compare.mjs`).\n\n> **Ограничение методики.** jsdom не умеет layout и paint. Бенчмарк измеряет **JS-стоимость** библиотеки (данные, раскладка, индекс, виртуализация, учёт).\n> Выигрыш от пунктов 4 и 11 проявляется только в реальном браузере. Для пункта 4 есть детерминированный тест, который доказывает, что принудительных чтений больше нет.\n\n| Сценарий | До | После | Результат |\n|---|---:|---:|---:|\n| 1000 одиночных `insert()` в конец, 50k записей | 1123 мс | 12,5 мс | **90× быстрее** |\n| Удаление 1 карточки около конца, сетка 100k (remove + layout + индекс) | 23,6 мс | 1,04 мс | **23× быстрее** |\n| Добавление 50 карточек в сетку 100k (insert + layout + индекс + рендер) | 6,41 мс | 1,10 мс | **5,8× быстрее** |\n| Добавление 1 карточки в сетку 30k | 1,80 мс | 0,65 мс | **2,8× быстрее** |\n| `selection`: select + deselect одной карточки при 40k выделенных | 14,2 мс | 0,46 мс | **31× быстрее** |\n| `reveal`: rAF-регистраций на 200 кадров быстрого скролла | 8132 | 202 | **40× меньше** |\n| Таймеров на 1000 scroll-кадров | 1000 | 0,33 | **≈3000× меньше** |\n| Вызовов `matchMedia` на 100 анимированных вставок | 100 | 1 | **100× меньше** |\n| Чтений `scrollTop` на кадр скролла (из них после записи в DOM) | 2 (1) | 1 (0) | принудительный reflow убран |\n| Первая раскладка 100k (Masonry) | 33,2 мс | 30,8 мс | без изменений |\n| Полный relayout 100k: masonry / grid / justified | 11,0 / 5,8 / 12,3 мс | 11,0 / 5,5 / 12,4 мс | без изменений |\n| JS-стоимость одного scroll-кадра в jsdom (4 сценария) | 56 / 71 / 133 / 156 мкс | 51 / 64 / 143 / 157 мкс | в пределах шума |\n\n**Что не улучшилось и почему.** Полная раскладка и первая отрисовка не менялись: они уже линейные и быстрые (≈0,1 мкс на элемент).\nПрофиль scroll-кадра показал, что собственный JS библиотеки занимает единицы микросекунд: `sync` ≈ 8 мкс и `query` ≈ 5 мкс на кадр.\nОстальное — jsdom и GC. Поэтому «ускорения скролла в микросекундах» заявлять нельзя. Исправления 4–6 убирают **структурные** издержки: принудительный reflow, лишние таймеры и аллокации.\nВ браузере они дают более стабильные кадры, но это нужно подтвердить в DevTools Performance (см. §6).\nСценарий «H» (200 pinned при выключенной виртуализации) тоже без изменений: в нём доминирует монтирование 8000 карточек. Бинарный поиск улучшает асимптотику, но на практике незаметен.\n\n## 4. Не исправлено, но стоит решить\n\n1. **Композитные слои на каждую карточку (проблема 11).** `.abi7-item { will-change: transform }` и `transform: translate3d(x,y,0)` вынуждают браузер выделять слой на каждую смонтированную карточку (сотни при большом `overscan`).\n   Это память GPU и работа композитора, особенно на мобильных. Поскольку `translate3d` и `will-change` **описаны в документации как контракт** (`docs/pages/concepts.md`, `internals.md`), а эффект зависит от браузера и железа, я не менял их вслепую.\n   Рекомендация: заменить на 2D `translate(x,y)`, а `will-change: transform` оставить только на `.abi7-animating .abi7-item` и `.abi7-dragging`. Затем сравнить в Chrome DevTools: Layers, Performance, GPU memory.\n2. **`pointermove` при drag не склеивается по кадрам** (приоритет низкий). `_update()` (hit-test, `drag:move`, возможный `move()`) вызывается на каждое событие.\n   Современные браузеры (Chrome) обычно сами выравнивают `pointermove` по кадру, поэтому реальный выигрыш зависит от браузера. Я его не измерял.\n   Если понадобится: обрабатывать последнюю позицию раз в rAF-тике. Это меняет момент `drag:move` относительно события, а существующие тесты и документация ожидают синхронности.\n   В этом проходе исправлено только удвоенное чтение `getBoundingClientRect()` (п. 8 таблицы).\n3. Мелкие наблюдения без исправления: `selection` отдаёт в событии копию `selected` (O(selected) на событие, это часть формата события); `toggleClass` хранит `Set` на каждый id (память при `selectAll()` на сотнях тысяч);\n   `_applyLoaded` перепривязывает смонтированные карточки, которые следом будут размонтированы.\n\n## 5. Как проверялись исправления\n\n* **Все 164 существующих теста проходят** (и на `src`, и на минифицированной сборке). `npm run validate` (сборка, `tools/check.js`, тесты): 210/210.\n* **`tests/perf.test.js` — 46 проверок** (23 × `src` и `min`):\n  * *Поведение не изменилось* (рандомизированные тесты с фиксированным сидом; `FUZZ_SEED=n` даёт другие прогоны):\n    модель на обычном массиве для insert/remove/move; запросы окна и hit-test против перебора для 4 раскладок после случайных правок\n    (append, вставка, удаление, update размеров, move, resize, смена gap, усечение 60% данных); кастомная раскладка с переполнением размера;\n    события `scroll`, `scroll:stop`, `item:visible/hidden`, pinned, drag, selection, reveal.\n  * *Дорогая операция действительно исчезла*: счётчики `setTimeout`, чтений `scrollTop` **после** записи в DOM, `matchMedia`, `getBoundingClientRect`, `requestAnimationFrame`.\n* **Тесты проверены на обоих кодах.** Против **оригинального** кода все тесты поведения проходят (поведение идентично), а 5 тестов на производительность падают по ожидаемым причинам:\n  `400 таймеров на 400 событий`, `40 чтений scrollTop после записи на 40 кадров`, `20 вызовов matchMedia`, `2 !== 1 чтений rect на pointermove`, `15 rAF на 14 карточек`.\n* **Мутационная проверка.** Если сломать инкрементальный индекс (убрать `_dirty` или защиту от переполнения), тесты индекса падают.\n  Первая версия теста на переполнение эту ошибку не ловила (число корзин не менялось). Тест усилен, теперь ловит.\n* **25 дополнительных сидов** (`FUZZ_SEED=1..25`) × 14 тестов: без падений.\n\n## 6. Как перепроверить в браузере\n\n1. DevTools → Performance, запись при быстром скролле 20–100k карточек. Раньше в кадрах была фиолетовая полоса «Layout» с пометкой *Forced reflow* внутри `updateViewport`; теперь её быть не должно.\n2. Timers: количество `setTimeout` при скролле должно быть ≈ 1 на жест.\n3. `layout:end.duration` при `insert()` в большую сетку (в событии есть поле `duration`).\n4. Для пункта 11: DevTools → Layers: число слоёв и память.\n\n## 7. Файлы\n\nИзменены: `src/abi7-grid.js`, `plugins/selection/selection.js`, `plugins/reveal/reveal.js`, `dist/abi7-grid.js`, `dist/abi7-grid.min.js`, `dist/abi7-grid.min.js.map`, `CHANGELOG.md`.\nДобавлены: `tests/perf.test.js`, `bench/bench.mjs`, `bench/compare.mjs`, `docs/PERFORMANCE-REVIEW.md`.\n`dist/` пересобран штатным `npm run build:lib`. `tools/check.js min` подтверждает, что минифицированные файлы воспроизводимы.\nРазмер `dist/abi7-grid.min.js`: 61 031 → 62 622 байт (+2,6%).\n\nЗапуск: `npm test` (все тесты), `node bench/bench.mjs` (бенчмарк), `node bench/compare.mjs <до.js> <после.js> 5` (сравнение двух версий).\n",Ah="UEsDBAoAAAAAADZlZV0AAAAAAAAAAAAAAAAVABwAYWJpNy1ncmlkLXBlcmYtZml4ZXMvVVQJAAOIeexqiHnsanV4CwABBOkDAAAE6QMAAFBLAwQKAAAAAAA2ZWVdAAAAAAAAAAAAAAAAGgAcAGFiaTctZ3JpZC1wZXJmLWZpeGVzL2Rpc3QvVVQJAAOIeexqiHnsanV4CwABBOkDAAAE6QMAAFBLAwQUAAAACAA2ZWVd6uk17BnWAACd9AIALgAcAGFiaTctZ3JpZC1wZXJmLWZpeGVzL2Rpc3QvYWJpNy1ncmlkLm1pbi5qcy5tYXBVVAkAA4h57GqIeexqdXgLAAEE6QMAAATpAwAAtDtrc9u2lt/3V8DZzhUZy/SjabuV43h8E7XVHb/GdjqzY7sJRUESa4pk+ZCt2u5v3/MAQICS3HaazWQsETwvHBycF6DH/xLi1VwWZZylr3ri6y4+l1ldRLKE5+tXQbBdFtF2OIy/25oU8Sj4tXx1a0O9z9JKphUBb7/euEnFa3H078F34keAFvPdYCfYocGTbFQnYSGQioiyQvZEEi6yuiq7Yh4XVR0m8e9hBYJ0RZ7UkzgtA0QkZC/yxd7O3tdb8OdbcZ

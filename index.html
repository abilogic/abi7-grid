`,Te="# Plugins\n\nCore is intentionally small. Everything that everyone does not need - selection, viewer, transfer between grids, additional layout - lives in **plugins**: separate files that are connected only when necessary and do not require changes to Core.\n\n## Plugin architecture\n\n- **Plugin object** — ordinary object: `name`, `version`, `apiVersion`, `install(api, options)`.\n- **Plugin API** (`api`) - the only point of communication with the core: nine interfaces `events`, `layouts`, `features`, `data`, `geometry`, `viewport`, `renderer`, `options`, `lifecycle`. It is frozen, does not expose internal core arrays, and \"closes\" after the plugin is disabled.\n- **Instance Isolation** — the plugin state lives in a closure `install()`. The same plugin on two grids - two independent copies.\n- **Automatic cleaning** — subscriptions, features, layout and pins made through `api`, are removed when `unuse()` and `destroy()` without the participation of the plugin author.\n\n```text\ngrid.use(plugin, options)\n   ├─ contract verification (name, version, apiVersion, install)\n   ├─ apiVersion compatibility check ↔ core API version\n   ├─ checking dependencies and reconnecting\n   ├─ creating an isolated api\n   ├─ plugin.install(api, mergedOptions) ← plugin registers subscriptions, methods, layout\n   └─ plugin:install event\n```\n\n## Installation and disabling\n\n```js\nimport SelectionPlugin from './plugins/selection/selection.js';\n\ngrid.use(SelectionPlugin, { multiple: true });     // installation (can be chained)\ngrid.hasPlugin('selection');                        // true\ngrid.getPlugin('selection').select('photo-1');      // public interface of the plugin\ngrid.getPlugins();                                  // [{ name, version, apiVersion, options }]\ngrid.unuse('selection');                            // shutdown: cleanup → unsubscribe → event\n```\n\nPlugins can also be passed to the constructor: `plugins: [SelectionPlugin, [LightboxPlugin, { loop: true }]]`. Several plugins work simultaneously; at `destroy()` they are all released in the reverse order of installation.\n\n## Ready plugins\n\n| Package | Files | What does |\n|---|---|---|\n| `@abi7/selection` | `plugins/selection/selection.js`, `selection.css` | Click, Ctrl/Cmd, Shift-range, `selectAll`, `clear`, events |\n| `@abi7/lightbox` | `plugins/lightbox/lightbox.js`, `lightbox.css` | View on top of the grid: keyboard, swipe, animation |\n| `@abi7/layout-horizontal` | `plugins/layout-horizontal/horizontal.js` | Layout \"horizontal ribbon\" |\n| `@abi7/connected-grids` | `plugins/connected-grids/connected-grids.js`, `connected-grids.css` | Transferring cards between grids |\n\n### Selection\n\n:::demo selection\n\n### Lightbox\n\n:::demo lightbox\n\n### Connected Grids\n\n:::demo connected-grids\n\n## Layout plugins\n\nThird-party layout is connected in the same way as a regular plugin:\n\n```js\nimport HorizontalLayout from './plugins/layout-horizontal/horizontal.js';\n\nconst grid = new ABI7Grid('#strip', { layout: 'horizontal', data });\ngrid.use(HorizontalLayout);\n// or globally:\nABI7Grid.registerLayout('horizontal', HorizontalLayout);\n```\n\nInside the plugin does `api.layouts.register('horizontal', definition)`. Grid, whose `layout` not registered yet, waiting for it (status `pending`) and starts automatically. Layout contract - in [Layout API](#/api-plugin/layout-api).\n\n## Interaction of plugins with Core\n\n| What does the plugin need? | How it's done |\n|---|---|\n| React to events | `api.events.on('item:click', fn)` |\n| Report your events | `api.events.emit('pluginname:event', payload)` |\n| Give the user methods | `api.features.register(name, object)` → `grid.getPlugin(name)` |\n| Read/change data | `api.data.*` |\n| Know the position of the cards | `api.geometry.get(id)`, `api.geometry.hitTest(x, y)` |\n| Scroll, pin | `api.viewport.*` |\n| Influence the type of card | `api.renderer.toggleClass(id, cls)`, events `item:mount` / `item:unmount` |\n| Change grid settings | `api.options.set(path, value)` |\n| Free up resources | `return () => {...}`, `api.lifecycle.addDisposable(fn)` |\n\nPlugins can depend on each other: field `dependencies: ['selection']` is checked during installation, and you cannot disable a plugin that is needed by someone else (`PLUGIN_REQUIRED`). Plugin A can use the public interface of plugin B: `api.features.get('selection')`.\n\n## Plugin life cycle\n\n1. `grid.use()` → checks → `install(api, options)`.\n2. Working phase: events, feature calls.\n3. `grid.unuse(name)` or `grid.destroy()`:\n   1. the function returned is called `install()`;\n   2. are called `api.lifecycle.onDestroy` / `addDisposable` — in reverse order of registration;\n   3. subscriptions are removed `api.events`, feature and layout;\n   4. API \"closes\": any call will fail `PLUGIN_INACTIVE`;\n   5. event comes `plugin:uninstall`.\n\n## Error Handling\n\n| Situation | What's going on |\n|---|---|\n| None `name`, `version`, `apiVersion` or `install` | `grid.use()` throws `PluginError` (`PLUGIN_INVALID`) |\n| `apiVersion` does not fit the core | `PLUGIN_INCOMPATIBLE`, nothing is installed |\n| The plugin is already installed | `PLUGIN_DUPLICATE` |\n| Dependency not installed | `PLUGIN_DEPENDENCY` |\n| Exception in `install()` | Rollback of all registrations, `PLUGIN_INSTALL_FAILED`, the exception is thrown from `use()` |\n| `install()` returned Promise | `PLUGIN_INVALID` — synchronous installation |\n| Exception in plugin event handler | Does not break the grid or other subscribers; event comes `error` with `source: 'plugin:name'` |\n| Exception in cleanup function | The remaining cleaning steps are completed; event `error` (`phase: 'cleanup'`) |\n| Feature name conflict | `PLUGIN_FEATURE_CONFLICT` |\n| `emit()` events not with their own prefix | `PLUGIN_EVENT_NAMESPACE` |\n\n```js\ntry {\n  grid.use(SomePlugin);\n} catch (e) {\n  if (e.code === 'PLUGIN_INCOMPATIBLE') showWarning('Update the plugin');\n}\ngrid.on('error', (e) => { if (e.source.startsWith('plugin:')) console.warn(e.source, e.message); });\n```\n\nHow to write your own plugin from scratch - in [Creating a plugin](#/plugin-development).\n",Se="# Responsive Behavior\n\nABI7 Grid is responsive to its **container**, not to media queries. The grid recalculates when the size of the root element changes.\n\n## Container size changes\n\nWith `autoResize: true` (default) the core creates one `ResizeObserver` for the root element when it starts. When the observer fires, the core compares the new `clientWidth`/`clientHeight` with the last known values. If they differ, it updates the viewport, emits `resize` with `{ width, height }`, and schedules a layout.\n\n| Layout `responsive` | Recalculates when |\n|---|---|\n| `'width'` (Masonry, Grid, Justified) | the width changes |\n| `'height'` | the height changes |\n| `'both'` | either changes |\n\nA height-only change still re-evaluates which cards must be mounted, but does not rebuild the geometry for width-driven layouts.\n\n## Changing the number of columns\n\nColumns are derived from `layoutOptions.minWidth`, `gap`/`gapX` and `maxColumns` (see [Core Concepts](#/concepts)). A wider container gives more columns; a narrower one gives fewer, down to one. A fixed `columns` value disables auto-fit. The `layout:end` event reports the result in `event.info` (`columns`, `itemWidth`, …).\n\n:::demo responsive\n\n## `ResizeObserver`\n\n- It observes the root element only when `autoResize` is `true`.\n- If `ResizeObserver` does not exist in the environment, nothing is observed. Call `grid.refresh()` after you resize the container.\n- With `autoResize: false` you are responsible for calling `grid.refresh()`.\n- Resize bursts are limited: more than 10 resize-triggered layouts within 500 ms are dropped.\n\n## Viewport (window) changes\n\nThe grid does not listen to `window.resize`. A window resize matters only if it changes the size of the grid element (for example `width: 100%`); the `ResizeObserver` then reports it.\n\n## Content changes\n\nChanging data (`insert`, `remove`, `update`…) triggers a layout without any resize. Changing the DOM of a card by hand does not trigger anything. See [Dynamic Content](#/dynamic-content).\n\n## Hidden containers\n\nIf the root has no width (for example inside `display: none`), the grid waits (`hidden` state in `getState()`). When the container becomes visible, the `ResizeObserver` (and the `IntersectionObserver` when it exists) trigger the layout.\n\n## Recalculation details\n\n- `refresh()` re-reads the container size and relayouts everything synchronously (`flush()`).\n- `rebuild(patch)` applies new options; layout changes are animated and keep the scroll anchor.\n- Scroll Anchoring keeps the content under the user's eyes when geometry above the window changes.\n\n:::demo container-width\n",ke="# Troubleshooting\n\nEach entry lists the symptom, the likely cause and what to check. Errors thrown by the core are `ABI7Error` with a stable `code`; errors inside listeners and plugins arrive as the `error` event.\n\n## The grid does not initialize\n\n- **Nothing is drawn and the console shows a module error.** ES modules do not load from `file://`; use an HTTP server. Check that the import path is correct.\n- **`ABI7Error: ... (code: ALREADY_INITIALIZED)`.** The element already has an instance. Call `destroy()` first.\n- **No cards, no error.** The container has no height (it is the scroll container) or no width; `getState().hidden` is `true`. Give it a height in CSS or with `height`.\n- **Container not found.** The selector matched nothing at construction time; create the grid after the DOM is ready.\n- **Cards are empty.** Records need `id`; and `fields.src` must point to your URL property. `javascript:` URLs are filtered out.\n\n## Cards overlap\n\nUsually one of: records have no size information (all get `estimatedHeight`), image ratio differs from the record's `width`/`height`, or your CSS overrides `.abi7-item` (`position`, `transform`, `width`, `height`). Do not style these properties. Update the record with real sizes.\n\n## Cards go outside the container\n\n- A site-wide CSS rule such as `* { box-sizing: ... }` or `img { max-width: ... }` interacting with `.abi7-item`; the core uses `box-sizing: border-box`.\n- `padding` option versus your own CSS padding on the root: use the `padding` option so it is part of the width calculation.\n- The container's width changed without notification (`autoResize: false`): call `refresh()`.\n\n## Content does not trigger recalculation\n\n- Direct DOM changes are not observed. Use `update()` or `refresh()`.\n- Changing an option on a plain object you passed in has no effect; use `rebuild(patch)`.\n- Image `load` events are not observed; update the record's size yourself.\n\n## Wrong height\n\n- With `measure: true`, heights are measured only for cards that have been mounted; the total height is an estimate until then.\n- Layout options priority: measured → `itemHeight` → `aspectRatio` → record aspect → record height → `estimatedHeight`. A fixed `itemHeight` wins over the record's height.\n- `aspectRatio: 0` in Grid takes row height from the records.\n\n## Errors when adding dynamically\n\n- `INVALID_ARGUMENT`: `insert()` got an invalid `at`.\n- `DUPLICATE_ID`: ids must be unique within the grid.\n- `DESTROYED`: calling a method after `destroy()`. Check `isDestroyed()`.\n- Listen to `error` to see problems inside handlers: `grid.on('error', (e) => console.warn(e.source, e.message))`.\n\n## CSS conflicts\n\nAll selectors start with `.abi7-`; there are no global resets. A conflict is almost always your CSS targeting `.abi7-item` or `.abi7-media`. Theme with the CSS variables on `.abi7-grid` (for example `--abi7-item-bg`, `--abi7-item-radius`) instead.\n\n## Image problems\n\n- Blank cards: check the URL and CORS; the card sets `loading=\"lazy\"`.\n- Layout jumps after images load: records have wrong ratios.\n- Broken images from `data:` URLs: only `data:image/*` URLs are allowed.\n\n## Still stuck?\n\nOpen an issue at https://github.com/abilogic/abi7-grid/issues with a minimal reproduction. For commercial support questions see https://abi7.com.\n",Le="# Virtualization\n\nVirtualization allows you to display tens of thousands of cards while holding only a few dozen in the DOM. She **does not depend on layout**: receives the finished geometry and decides which indexes need to be mounted.\n\n:::demo virtualization\n\n## How it works\n\n1. Layout recorded the coordinates of all cards in `GeometryStore`; a spatial index was constructed from them.\n2. View window = `[scrollTop − overscan, scrollTop + height + overscan]` (along the main axis of the layout) and similarly along the transverse one.\n3. The index returns cards that cross the window without traversing all records and without `getBoundingClientRect()`.\n4. Renderer compares the result with the DOM: extra nodes are removed into **DOM Pool**, the missing ones are taken from the pool or created.\n5. Scrolling is handled by a passive listener and **once per frame** (`requestAnimationFrame`) - heavy calculations for each event `scroll` no.\n\nCheck: `grid.getState().virtualization` shows the actual number of mounted elements, pool size and counters `created` / `reused`. In the example above, all numbers are read from this state and from the DOM, rather than being preset.\n\n## Large massifs\n\nFor 50,000 cards, the layout is calculated in units of milliseconds, leaving about 30–60 nodes in the DOM. A test in the repository loops through 50,000 entries into 30 positions and checks that `created` remains small and `reused` growing.\n\n```js\nconst grid = new ABI7Grid('#g', { data: fiftyThousand, virtualization: { overscan: 400 } });\nconsole.log(grid.getState().virtualization.mounted);   // tens, not 50,000\n```\n\n## Overscan and Adaptive Overscan\n\n`overscan` — margin in pixels outside the window. More headroom means fewer empty spaces during // Everything you need for a basic grid is here.
import { ABI7Grid } from '../../dist/abi7-grid.js';

// Auxiliary test data generator (see section “Examples → general photos.js file”).
import { makePhotos, photoSrc } from '../shared/photos.js';

// Data is a regular array of objects. The kernel needs id and dimensions (width/height):
// Layout calculates the geometry using them, without waiting for the images to load.
const photos = makePhotos(40);

// Let's create an instance. The first argument is the selector or container element.
const grid = new ABI7Grid('#gallery', {
  // layout selects the geometry calculation algorithm: 'masonry' | 'grid' | 'justified' (+ plugins).
  layout: 'masonry',

  data: photos,

  // fields.src - function: the kernel does not need to know where the URL of the image is.
  // It is called only for cards that are in the DOM, and not for all entries.
  fields: { src: photoSrc },

  // Layout algorithm settings. minWidth + maxColumns determine the number of columns automatically.
  layoutOptions: { gap: 12, minWidth: 160, maxColumns: 5 }
});

const out = document.querySelector('#out');

// Subscribe to a click event. The kernel assigns ONE listener per container (delegation),
// and not one listener for each card - that’s why clicks are cheap even with 50,000 records.
grid.on('item:click', (event) => {
  out.textContent = \`Click: \${event.item.title}, index \${event.index}, id \${event.id}\`;
});

// ready fires once - after the first successful layout (when the container has a size).
grid.on('ready', (event) => {
  out.textContent = \`Done: \${event.count} cards. Click on any of them.\`;
});

// The file does not import Core and does not know anything about its internal structure:
// all interaction goes through the object \`api\`, which the core passes to install().

const CounterPlugin = {
  // The unique name of the plugin within the grid. They work on it grid.unuse('counter'),
  // grid.getPlugin('counter') and reconnection protection.
  name: 'counter',

  // The version of the plugin itself (semver). Shown in grid.getPlugins() and plugin:install events.
  version: '1.0.0',

  // The range of core API versions that the plugin is compatible with. If the core is not suitable,
  // grid.use() will throw PluginError (PLUGIN_INCOMPATIBLE) and will not install anything.
  apiVersion: '^1.0.0',

  // Default values. The core will combine them with the options from grid.use(plugin, options)
  // and will pass it to install() as the second argument (the object is frozen - it cannot be changed).
  defaults: {
    step: 1, // how much to increase the counter per click
    badges: true, // show an icon with the number of clicks on the card
    filter: null // (record) => boolean — which cards to count; null - all
  },

  // install is called once during grid.use(). The return function is "cleanup".
  install(api, options) {
    // ---- Condition ----
    // Variables are declared INSIDE install(), so each grid has its own copy:
    // two grids with one CounterPlugin count clicks independently of each other.
    let total = 0;
    const perItem = new Map(); // post id → number of clicks

    // ---- Working with the DOM ----
    // DOM elements in ABI7 Grid are reused (DOM Pool): the same <div> in different
    // moments shows different records. Therefore, an icon cannot be “sticked” to an element once —
    // it must be set again every time an element is attached to an entry (item:mount).
    const paintBadge = (el, id) => {
      const old = el.querySelector('.counter-badge');
      const count = perItem.get(id) || 0;
      if (!options.badges || count === 0) {
        if (old) old.remove();
        return;
      }
      const badge = old || el.appendChild(Object.assign(document.createElement('span'), { className: 'counter-badge' }));
      badge.textContent = String(count); // textContent: number cannot contain HTML

    // api.events.on returns an unsubscribe function, but it is not necessary to call it manually:
    // The core itself will remove all plugin subscriptions during unuse() and destroy().
    api.events.on('item:click', (event) => {
      if (event.defaultPrevented) return; // another handler canceled the click

      const count = (perItem.get(event.id) || 0) + options.step;
      perItem.set(event.id, count);

      const el = api.renderer.getElement(event.id); // null if the element is not currently in the DOM
      if (el) paintBadge(el, event.id);

      // The core prohibits plugins from generating other people's events (item:click, etc.).
      api.events.emit('counter:change', { id: event.id, count, total });

    api.events.on('data:load-end', () => feature.reset());

      getCount: (id) => perItem.get(id) || 0,
      /** Most clicked posts: [{ id, count }, ...] */
      top: (n = 3) => [...perItem].map(([id, count]) => ({ id, count })).sort((a, b) => b.count - a.count).slice(0, n),

        const el = api.renderer.getElement(id);
        if (el) el.querySelector('.counter-badge')?.remove();
      }
      perItem.clear();
    };
  }

// Each only uses the Plugin API and does not import Core.
// The code is checked by automatic tests (tests/docs.test.js).

/* ------------------------------------------------------------------ *
 * 1. LoggerPlugin - minimal plugin: subscription to all events.
 *    Shows: name/version/apiVersion, defaults, subscription '*', cleanup.
 * ------------------------------------------------------------------ */
export const LoggerPlugin = {
  name: 'logger',
  version: '1.0.0',
  apiVersion: '^1.0.0',
  defaults: { prefix: '[grid]', ignore: ['scroll', 'viewport:update', 'drag:move'] },

  install(api, options) {
    const lines = [];

    // '*' — subscription to all events. Unsubscription will occur automatically when unuse()/destroy().
    api.events.on('*', (event, name) => {
      if (options.ignore.includes(name)) return;
      lines.push(\`\${options.prefix} \${name}\`);
      console.log(options.prefix, name, event);
    });

    api.features.register('logger', { getLines: () => lines.slice(), clear: () => (lines.length = 0) });
  }
};

/* ------------------------------------------------------------------ *
 * 2. TooltipPlugin - working with DOM of reused elements.
 *    Shows: item:mount / item:unmount, why you can’t “stick” an attribute once.
 * ------------------------------------------------------------------ */
export const TooltipPlugin = {
  name: 'tooltip',
  version: '1.0.0',
  apiVersion: '^1.0.0',
  defaults: { text: (record) => record.title || '' },

  install(api, options) {
    // The DOM node shows different entries at different times, so the attribute is set on EVERY binding.
    api.events.on('item:mount', ({ element, item }) => {
      const text = options.text(item);
      if (text) element.setAttribute('title', text);
      else element.removeAttribute('title');
    });
    api.events.on('item:unmount', ({ element }) => element.removeAttribute('title'));

    // We update nodes that are already in the DOM at the time of installation through a public method.
    api.renderer.refresh();

    return () => api.renderer.refresh(); // after disconnecting, we bind the cards again - without prompts
  }
};

/* ------------------------------------------------------------------ *
 * 3. KeyboardNavPlugin - keyboard navigation with arrows for any layout.
 *    Shows: api.geometry.hitTest, api.viewport.scrollToItem, api.renderer.toggleClass,
 *    native events and feature, addDisposable for DOM listener.
 * ------------------------------------------------------------------ */
export const KeyboardNavPlugin = {
  name: 'keyboard-nav',
  version: '1.0.0',
  apiVersion: '^1.0.0',
  defaults: { className: 'abi7-kb-focus' },

  install(api, options) {
    const root = api.renderer.root(); // grid root element: it has tabindex="0", it receives keys
    let current = null;

    const focus = (id) => {
      if (current !== null) api.renderer.toggleClass(current, options.className, false);
      current = id;
      if (id === null) return;
      api.renderer.toggleClass(id, options.className, true);
      api.viewport.scrollToItem(id, { align: 'nearest' });
      api.events.emit('keyboard-nav:focus', { id });
    };

    // We are looking for a neighbor in the direction of the arrow: we “feel” the geometry with points at a distance of 4, 8, 12... px
    // from the border of the current card. This works for Masonry, Grid, Justified and any other layouts.
    const neighbour = (id, dx, dy) => {
      const r = api.geometry.get(id);
      if (!r) return null;
      for (let d = 4; d <= 64; d += 4) {
        const x = dx > 0 ? r.right + d : dx < 0 ? r.x - d : r.x + r.width / 2;
        const y = dy > 0 ? r.bottom + d : dy < 0 ? r.y - d : r.y + r.height / 2;
        const i = api.geometry.hitTest(x, y);
        if (i >= 0) return api.data.ids()[i];
      }
      return null;
    };

    const directions = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowDown: [0, 1], ArrowUp: [0, -1] };

    const onKey = (e) => {
      if (e.key === 'Enter' && current !== null) {
        api.events.emit('keyboard-nav:activate', { id: current });
        return;
      }
      const dir = directions[e.key];
      if (!dir) return;
      e.preventDefault();
      if (current === null || !api.data.has(current)) {
        const ids = api.data.ids();
        const first = api.viewport.range().first;
        if (ids.length) focus(ids[Math.max(0, first)]);
        return;
      }
      const next = neighbour(current, dir[0], dir[1]);
      if (next !== null && next !== undefined) focus(next);
    };

    root.addEventListener('keydown', onKey);
    // The listener installs the plugin HIMSELF (outside the API), so he is also obliged to remove it.
    api.lifecycle.addDisposable(() => root.removeEventListener('keydown', onKey));

    api.features.register('keyboard-nav', { focus, current: () => current });

    return () => {
      if (current !== null) api.renderer.toggleClass(current, options.className, false);
      current = null;
    };
  }
};

// It highlights a card for a short time after it was clicked.
//
// The file does not import the core. Everything the plugin needs comes from the \`api\` object
// that the core passes to install().

const FlashPlugin = {
  // 1. Identity. \`name\` must be unique per grid and becomes the event namespace ("flash:...").
  name: 'flash',
  version: '1.0.0',
  // The range of Plugin API versions this plugin works with. grid.use() throws PluginError (PLUGIN_INCOMPATIBLE) otherwise.
  apiVersion: '^1.0.0',

  // 2. Default options. The core merges them with the options passed to grid.use() and freezes the result.
  defaults: {
    className: 'flash-on', // class added to the clicked card
    duration: 600 // ms
  },

  // 3. install() runs once per grid.use(). Keep ALL state inside it, so every grid gets its own copy.
  install(api, options) {
    const timers = new Map(); // record id -> timeout id

    // 4. Subscribe through api.events: the core removes these subscriptions automatically on unuse()/destroy().
    api.events.on('item:click', (event) => {
      if (event.defaultPrevented) return; // another handler cancelled the click

      // 5. Change the DOM only through api.renderer. toggleClass() is keyed by the record id, not by the element:
      // cards are reused by virtualization, and the core re-applies the class if the same record is bound again.
      api.renderer.toggleClass(event.id, options.className, true);

      clearTimeout(timers.get(event.id)); // click again -> restart the timer
      timers.set(event.id, setTimeout(() => {
        timers.delete(event.id);
        // The plugin may have been removed in the meantime: toggleClass() would throw PLUGIN_INACTIVE.
        try { api.renderer.toggleClass(event.id, options.className, false); } catch (_) { /* removed */ }
      }, options.duration));

      // 6. Plugin events must start with "<plugin name>:".
      api.events.emit('flash:fired', { id: event.id });
    });

    // 7. Public interface: grid.getPlugin('flash').active()
    api.features.register('flash', { active: () => timers.size });

    // 8. Cleanup: runs on grid.unuse('flash') and on grid.destroy(). Timers are not tracked by the core.
    return () => {
      for (const t of timers.values()) clearTimeout(t);
      timers.clear();
    };
  }
};

export default FlashPlugin;

const $ = (id) => document.getElementById(id);
const sleep = (ms, signal) => new Promise((resolve, reject) => {

  // The core aborts the signal when a newer load replaces this one - stop waiting and free the timer.
  signal && signal.addEventListener('abort', () => { clearTimeout(t); reject(new DOMException('aborted', 'AbortError')); });
});

let requests = 0;

// \`data\` may be a function that returns a Promise. It receives { signal, source }.
// A response from an outdated request is ignored by the core (no race conditions).
const grid = new ABI7Grid('#gallery', {
  layout: 'masonry',
  layoutOptions: { minWidth: 160, gap: 10 },
  fields: { src: photoSrc },
  data: async ({ signal }) => {
    const id = ++requests;
    // The first load is instant (as if cached); reloads pretend to be a slower network request.
    await sleep(id === 1 ? 30 : 700, signal);
    return makePhotos(36, { seed: id });
  }
});

const log = (t) => {
  if (!$('log')) return; // the page may already be gone when a late response arrives
  const d = document.createElement('div'); d.textContent = t; $('log').prepend(d);
};
const show = () => {
  if (!$('stats')) return;
  const s = grid.getState();
  $('stats').innerHTML = \`phase: <b>\${s.phase}</b> · loading: <b>\${s.loading}</b> · records: <b>\${s.count}</b> · cards in DOM: <b>\${s.virtualization.mounted}</b>\`;
};

grid.on('data:load-start', (e) => { log(\`data:load-start (\${e.source})\`); show(); });
grid.on('data:load-end', (e) => { log(\`data:load-end (\${e.source}) count=\${e.count}\${e.error ? ' error' : ''}\`); show(); });
grid.on('layout:end', show);
grid.on('error', (e) => { if (e.error && e.error.name !== 'AbortError') log('error: ' + e.message); });

// whenReady() resolves after the first layout.
grid.whenReady().then(() => log('ready: first layout done'));

// reload() calls the data function again (for array data it just re-binds and re-lays out).
$('reload').onclick = () => grid.reload();
// Two quick reloads: the first request is aborted through its signal and only the last response is applied.
$('reloadFast').onclick = () => { grid.reload(); setTimeout(() => grid.reload(), 100); };

  fields: { src: photoSrc },

  // Scrolling is never animated - otherwise the cards would “fly” when scrolling.
  animation: { enabled: true, duration: 350 }
});

const log = (text) => {
  const line = document.createElement('div');
  line.textContent = text; // textContent, not innerHTML - safe for any data
  $('log').prepend(line);
  while ($('log').childElementCount > 30) $('log').lastChild.remove();
};

// layout:end comes after EVERY geometry recalculation. In event.info layout it gives
// your data - for Masonry this is the number of columns and the width of the card.
grid.on('layout:end', (e) => {
  const s = grid.getState();
  $('stats').innerHTML =
    \`layout: <b>\${s.layout}</b> · columns: <b>\${e.info.columns}</b> · card width: <b>\${e.info.itemWidth}px</b> · \` +
    \`entries: <b>\${s.count}</b> · content height: <b>\${Math.round(e.contentHeight)}px</b> · \` +
    \`conversion from index <b>\${e.from}</b> (reason: \${e.reason}, \${e.duration.toFixed(1)} ms)\`;
});
grid.on('item:insert', (e) => log(\`item:insert \${e.id} per position \${e.index}\`));
grid.on('item:remove', (e) => log(\`item:remove \${e.id} (there was a position \${e.index})\`));
grid.on('item:click', (e) => log(\`item:click \${e.id}\`));

// --- Add / Remove -----------------------------------------------------------
// insert() inserts a record and rebuilds the geometry PARTIALLY - only starting from that position.
$('add').onclick = () => {
  const [photo] = makePhotos(1, { start: nextNumber++, seed: 99 });
  grid.insert(photo, { at: 'start' });
};

// remove() accepts an id (or an array of ids). Below, the first card from the list is removed.
$('remove').onclick = () => {
  const first = grid.getItems()[0];
  if (first) grid.remove(first.id);
};

// refresh() re-sizes the container and recalculates ALL geometry. Needed if you
// The container dimensions have been changed, and automatic tracking (autoResize) is disabled.
$('refresh').onclick = () => grid.refresh();

// and rearranges everything. The data and scroll position are preserved.
$('rebuild').onclick = () => grid.rebuild({ layoutOptions });

    layoutOptions[key] = Number(e.target.value);

  };

      if (!p) throw new Error(\`transitions: unknown preset "\${name}". Available: \${Object.keys(table).join(', ')}\`);
      // Each set() applies the option immediately (like rebuild()); the --abi7-duration / --abi7-easing CSS
      // variables on the root element are updated by the core.
      api.options.set('animation.enabled', p.enabled !== false);
      api.options.set('animation.duration', p.duration);
      api.options.set('animation.easing', p.easing);
      current = name;
      api.events.emit('transitions:change', { preset: name, ...p });
    };

    use(options.preset);

    api.features.register('transitions', {
      use,
      current: () => current,
      list: () => Object.keys(table),
      define: (name, preset) => { table[name] = { enabled: true, duration: 300, easing: 'ease', ...preset }; }
    });

    return () => {
      try {
        api.options.set('animation.enabled', original.enabled);
        api.options.set('animation.duration', original.duration);
        api.options.set('animation.easing', original.easing);
      } catch (_) { /* grid is being destroyed */ }
    };
  }
};

 * ABI7 Grid v1.0.0
 * Modular grid core: layouts, virtualization, plugins.
 *

 * ABI7 Grid Community Edition: free for NON-COMMERCIAL use only. Commercial use requires a paid license.

 * ABI7 Grid is a JavaScript grid library based on the original Abi7Grid code created by Alexander Momot.
 * The core consists of exactly two files: abi7-grid.js and abi7-grid.css.
 */

/* ============================================================
   CONTENTS
   1. Utilities - auxiliary functions, errors, semver
   2. EventEmitter - event bus
   3. OptionsManager - default settings, merging, validation
   4. DataStore - records, ids, indexes
   5. GeometryStore - element coordinates + spatial index
   6. Layout Engine - LayoutRegistry, LayoutManager, Masonry, Grid, Justified
   7. VirtualizationEngine - what elements need to be shown
   8. DOMRenderer is the only component that touches the DOM of elements
   9. AnimationManager - animation of rebuilding
   10. PluginManager - installing plugins, Plugin API
   11. InteractionManager - click events and Drag & Drop
   12. LifecycleManager - AbortController, timers, cleaning
   13. GridInstance - internal “engine” of one grid
   14. Public API - ABI7Grid class
   15. Exports
   ============================================================ */

export const VERSION = '1.0.0';
export const API_VERSION = '1.0.0';

/* ============================================================
   1. UTILITIES
   ============================================================ */

const isObject = (v) => v !== null && typeof v === 'object';
const isPlain = (v) => {
  if (!isObject(v)) return false;
  const p = Object.getPrototypeOf(v);
  return p === Object.prototype || p === null;
};
const isNum = Number.isFinite;
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
const byNumber = (a, b) => a - b;
// The record field can be a property name or a getter function (record) => value.
const readField = (rec, f) => (typeof f === 'function' ? f(rec) : rec == null ? undefined : rec[f]);

/** Core error. Field \`code\` — stable machine identifier of the reason. */
export class ABI7Error extends Error {
  constructor(message, code = 'ABI7_ERROR', cause) {
    super(message);
    this.name = 'ABI7Error';
    this.code = code;
    if (cause !== undefined) this.cause = cause;
  }
}

/** Plugin error (installation, compatibility, dependencies). */
export class PluginError extends ABI7Error {
  constructor(message, code = 'PLUGIN_ERROR', plugin = null, cause) {
    super(message, code, cause);
    this.name = 'PluginError';
    this.plugin = plugin;
  }
}

/** Deep merging of plain objects. Arrays and functions are replaced entirely. Sources are not mutated. */
function mergeOptions(base, over) {
  const out = {};
  for (const k of Object.keys(base || {})) out[k] = isPlain(base[k]) ? mergeOptions(base[k], null) : base[k];
  if (!over) return out;
  for (const k of Object.keys(over)) {
    const v = over[k];
    if (v === undefined) continue;
    out[k] = isPlain(v) ? mergeOptions(isPlain(out[k]) ? out[k] : {}, v) : v;
  }
  return out;
}

function clonePlain(v) {
  if (Array.isArray(v)) return v.map(clonePlain);
  if (isPlain(v)) {
    const o = {};
    for (const k of Object.keys(v)) o[k] = clonePlain(v[k]);
    return o;
  }
  return v;
}

const getPath = (obj, path) => String(path).split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
function setPath(obj, path, value) {
  const keys = String(path).split('.');
  let o = obj;
  for (let i = 0; i < keys.length - 1; i++) {
    if (!isObject(o[keys[i]])) o[keys[i]] = {};
    o = o[keys[i]];
  }
  o[keys[keys.length - 1]] = value;
}

const SAFE_DATA_URL = /^data:image\\/(png|jpe?g|gif|webp|avif|bmp|svg\\+xml)[;,]/i;
/** Only allows http(s), blob:, data:image/* and relative URLs. Rest (javascript: etc.) -> ''. */
function safeUrl(value) {
  if (value == null) return '';
  const s = String(value).trim();
  if (!s) return '';
  const probe = s.replace(/[\\u0000-\\u0020\\u007f]/g, '');
  if (/^(https?:|blob:)/i.test(probe)) return s;
  if (/^data:/i.test(probe)) return SAFE_DATA_URL.test(probe) ? s : '';
  if (/^[a-z][a-z0-9+.-]*:/i.test(probe)) return '';
  return s;
}

/* --- Minimal implementation of semver (^ ~ >= > <= <= x *, "||", space = AND) --- */
function parseVersion(s) {
  const m = /^v?(\\d+)(?:\\.(\\d+|x|\\*))?(?:\\.(\\d+|x|\\*))?/.exec(String(s).trim());
  if (!m) return null;
  const part = (x) => (x == null || x === 'x' || x === '*' ? null : +x);
  return [+m[1], part(m[2]), part(m[3])];
}
const cmpVersion = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];

function satisfies(version, range) {
  const raw = parseVersion(version);
  if (!raw) return false;
  const v = raw.map((x) => x ?? 0);
  return String(range == null ? '*' : range)
    .split('||')
    .some((group) =>
      group
        .trim()
        .split(/\\s+/)
        .every((tok) => {
          if (tok === '' || tok === '*' || tok === 'x') return true;
          const m = /^(\\^|~|>=|<=|>|<|=)?(.+)$/.exec(tok);
          const op = m[1] || '=';
          const r = parseVersion(m[2]);
          if (!r) return false;
          const lo = r.map((x) => x ?? 0);
          if (op === '=') return r.every((x, i) => x === null || x === v[i]);
          if (op === '>=') return cmpVersion(v, lo) >= 0;
          if (op === '>') return cmpVersion(v, lo) > 0;
          if (op === '<=') return cmpVersion(v, lo) <= 0;
          if (op === '<') return cmpVersion(v, lo) < 0;
          let hi;
          if (op === '^') hi = r[0] > 0 ? [r[0] + 1, 0, 0] : r[1] > 0 ? [0, r[1] + 1, 0] : [0, 0, (r[2] ?? 0) + 1];
          else hi = r[1] == null ? [r[0] + 1, 0, 0] : [r[0], r[1] + 1, 0]; // ~
          return cmpVersion(v, lo) >= 0 && cmpVersion(v, hi) < 0;
        })
    );
}

function resolveElement(target) {
  const el = typeof target === 'string' ? document.querySelector(target) : target;
  if (!el || el.nodeType !== 1) throw new ABI7Error('ABI7Grid: container element not found: ' + String(target), 'INVALID_ELEMENT');
  return el;
}

/* ============================================================
   2. EVENT EMITTER
   Handler errors do not interrupt other handlers:
   they are passed to onError (the core turns them into an 'error' event).
   ============================================================ */

class EventEmitter {
  constructor(onError) {
    this._map = new Map();
    this._onError = onError;
  }

  on(name, fn, tag) {
    if (typeof name !== 'string' || !name) throw new TypeError('Event name must be a non-empty string');
    if (typeof fn !== 'function') throw new TypeError('Event handler must be a function');
    let list = this._map.get(name);
    if (!list) this._map.set(name, (list = []));
    const rec = { fn, once: false, tag };
    list.push(rec);
    return () => this._remove(name, rec);
  }

  once(name, fn, tag) {
    const off = this.on(name, fn, tag);
    const list = this._map.get(name);
    list[list.length - 1].once = true;
    return off;
  }

  off(name, fn) {
    const list = this._map.get(name);
    if (!list) return false;
    for (let i = list.length - 1; i >= 0; i--) {
      if (list[i].fn === fn) {
        this._remove(name, list[i]);
        return true;
      }
    }
    return false;
  }

  _remove(name, rec) {
    const list = this._map.get(name);
    if (!list) return;
    const i = list.indexOf(rec);
    if (i >= 0) list.splice(i, 1);
    if (!list.length) this._map.delete(name);
  }

  has(name) {
    return this._map.has(name) || this._map.has('*');
  }

  emit(name, payload = {}) {
    if (isObject(payload) && payload.type === undefined) payload.type = name;
    const groups = [this._map.get(name), name === '*' ? null : this._map.get('*')];
    for (const group of groups) {
      if (!group) continue;
      for (const rec of group.slice()) {
        if (rec.once) this._remove(group === groups[0] ? name : '*', rec);
        try {
          rec.fn(payload, name);
        } catch (error) {
          this._onError({ source: rec.tag ? 'plugin:' + rec.tag : 'listener', event: name, error });
        }
      }
    }
  }

  /** Returns false if any handler called event.preventDefault(). */
  emitCancelable(name, payload = {}) {
    payload.defaultPrevented = false;
    payload.preventDefault = function preventDefault() {
      this.defaultPrevented = true;
    };
    this.emit(name, payload);
    return !payload.defaultPrevented;
  }

  clear() {
    this._map.clear();
  }
}

/* ============================================================
   3. OPTIONS MANAGER
   ============================================================ */

const DEFAULTS = Object.freeze({
  layout: 'masonry',
  layoutOptions: {},
  data: null,
  fields: { id: 'id', width: 'width', height: 'height', aspectRatio: 'aspectRatio', src: 'src', title: 'title', alt: 'alt' },
  padding: 0,
  height: null,
  className: '',
  itemClassName: '',
  itemTag: 'div',
  autoRender: true,
  autoResize: true,
  scrollAnchoring: true,
  allowHTML: false,
  renderItem: null,
  releaseItem: null,
  plugins: [],
  virtualization: {
    enabled: true,
    overscan: 400,
    adaptiveOverscan: true,
    maxOverscan: 1600,
    poolSize: 256,
    measure: false,
    estimatedHeight: 200,
    endThreshold: 300
  },
  animation: { enabled: true, duration: 300, easing: 'ease', respectReducedMotion: true },
  interaction: {
    click: true,
    drag: { enabled: false, handle: null, threshold: 5, delay: 220, autoScroll: true, edge: 64, maxSpeed: 22 }
  }
});

function normalizePadding(p) {
  if (isNum(p)) return { top: p, right: p, bottom: p, left: p };
  const o = isPlain(p) ? p : {};
  const n = (v) => (isNum(v) && v > 0 ? v : 0);
  return { top: n(o.top), right: n(o.right), bottom: n(o.bottom), left: n(o.left) };
}

class OptionsManager {
  constructor(user) {
    this.value = OptionsManager.resolve(user);
  }

  static resolve(user, base = DEFAULTS) {
    if (user != null && !isPlain(user)) throw new ABI7Error('Options must be a plain object', 'INVALID_OPTION');
    const o = mergeOptions(base, user);
    const bad = (name, why) => {
      throw new ABI7Error(\`Invalid option "\${name}": \${why}\`, 'INVALID_OPTION');
    };
    if (typeof o.layout !== 'string' || !o.layout) bad('layout', 'must be a non-empty string');
    if (!isPlain(o.layoutOptions)) bad('layoutOptions', 'must be an object');
    if (o.data != null && !Array.isArray(o.data) && typeof o.data !== 'function' && typeof o.data.then !== 'function') {
      bad('data', 'must be an array, a function returning data, or a Promise');
    }
    if (!Array.isArray(o.plugins)) bad('plugins', 'must be an array');
    o.padding = normalizePadding(o.padding);
    const v = o.virtualization;
    v.overscan = isNum(v.overscan) && v.overscan >= 0 ? v.overscan : DEFAULTS.virtualization.overscan;
    v.maxOverscan = isNum(v.maxOverscan) ? Math.max(v.maxOverscan, v.overscan) : v.overscan * 4;
    v.poolSize = isNum(v.poolSize) && v.poolSize >= 0 ? Math.floor(v.poolSize) : 256;
    v.estimatedHeight = isNum(v.estimatedHeight) && v.estimatedHeight > 0 ? v.estimatedHeight : 200;
    v.endThreshold = isNum(v.endThreshold) && v.endThreshold >= 0 ? v.endThreshold : 300;
    const a = o.animation;
    a.duration = isNum(a.duration) && a.duration >= 0 ? a.duration : 300;
    a.easing = typeof a.easing === 'string' && a.easing ? a.easing : 'ease';
    return o;
  }

  get(path) {
    if (path === undefined) {
      const { data, ...rest } = this.value;
      return clonePlain(rest);
    }
    return clonePlain(getPath(this.value, path));
  }

  /** Applies the patch and returns true; If there is a validation error, the values ​​do not change. */
  patch(patch) {
    this.value = OptionsManager.resolve(patch, this.value);
    return true;
  }

  set(path, value) {
    const draft = clonePlain({ ...this.value, data: null });
    draft.data = this.value.data;
    setPath(draft, path, value);
    this.value = OptionsManager.resolve(draft, DEFAULTS);
  }
}

/* ============================================================
   4. DATA STORE
   Stores records (a copy of the array, the objects themselves are not mutated),
   parallel array id and Map id → index.
   ============================================================ */

class DataStore {
  constructor(fields) {
    this.fields = fields;
    this.records = [];
    this.ids = [];
    this.index = new Map();
    this._seq = 0;
  }

  get size() {
    return this.records.length;
  }

  _makeId(rec) {
    const v = readField(rec, this.fields.id);
    if (v === undefined || v === null || v === '') return 'abi7-' + ++this._seq;
    if (typeof v !== 'string' && typeof v !== 'number') throw new ABI7Error('Item id must be a string or a number', 'INVALID_ID');
    return v;
  }

  static check(list) {
    if (!Array.isArray(list)) throw new ABI7Error('Data must be an array', 'INVALID_DATA');
    for (let i = 0; i < list.length; i++) {
      if (!isObject(list[i])) throw new ABI7Error(\`Data item #\${i} must be an object\`, 'INVALID_DATA');
    }
  }

  setAll(list) {
    DataStore.check(list);
    const ids = new Array(list.length);
    const index = new Map();
    for (let i = 0; i < list.length; i++) {
      const id = this._makeId(list[i]);
      if (index.has(id)) throw new ABI7Error(\`Duplicate item id: \${String(id)}\`, 'DUPLICATE_ID');
      index.set(id, i);
      ids[i] = id;
    }
    this.records = list.slice();
    this.ids = ids;
    this.index = index;
  }

  reindex(from = 0) {
    for (let i = from; i < this.ids.length; i++) this.index.set(this.ids[i], i);
  }

  insert(list, at) {
    DataStore.check(list);
    at = clamp(Number.isInteger(at) ? at : this.size, 0, this.size);
    const newIds = [];
    const seen = new Set();
    for (const rec of list) {
      const id = this._makeId(rec);
      if (this.index.has(id) || seen.has(id)) throw new ABI7Error(\`Duplicate item id: \${String(id)}\`, 'DUPLICATE_ID');
      seen.add(id);
      newIds.push(id);
    }
    this.records = this.records.slice(0, at).concat(list, this.records.slice(at));
    this.ids = this.ids.slice(0, at).concat(newIds, this.ids.slice(at));
    this.reindex(at);
    return newIds.map((id, k) => ({ id, index: at + k, record: list[k] }));
  }

  remove(idList) {
    const kill = new Set(idList);
    const removed = [];
    const records = [];
    const ids = [];
    for (let i = 0; i < this.ids.length; i++) {
      if (kill.has(this.ids[i])) removed.push({ id: this.ids[i], index: i, record: this.records[i] });
      else {
        records.push(this.records[i]);
        ids.push(this.ids[i]);
      }
    }
    if (!removed.length) return removed;
    this.records = records;
    this.ids = ids;
    this.index = new Map();
    this.reindex(0);
    return removed;
  }

  update(id, patch) {
    const i = this.index.get(id);
    if (i === undefined) return null;
    if (!isObject(patch)) throw new ABI7Error('Update patch must be an object', 'INVALID_DATA');
    const idField = this.fields.id;
    if (typeof idField === 'string' && hasOwn(patch, idField) && patch[idField] !== id) {
      throw new ABI7Error('Changing the id of an item is not supported; remove and insert instead', 'INVALID_ID');
    }
    const previous = this.records[i];
    // The prototype is saved so that the record class getters are not lost.
    const next = Object.assign(Object.create(Object.getPrototypeOf(previous)), previous, patch);
    this.records[i] = next;
    return { index: i, record: next, previous, changed: Object.keys(patch) };
  }

  move(id, to) {
    const from = this.index.get(id);
    if (from === undefined) return null;
    to = clamp(Math.floor(to), 0, this.size - 1);
    if (!isNum(to) || to === from) return null;
    const [rec] = this.records.splice(from, 1);
    const [rid] = this.ids.splice(from, 1);
    this.records.splice(to, 0, rec);
    this.ids.splice(to, 0, rid);
    this.reindex(Math.min(from, to));
    return { from, to };
  }
}
const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

/* ============================================================
   5. GEOMETRY STORE
   Coordinates in Float64Array (x, y, w, h) + spatial index
   (baskets along the main scroll axis). The index does not depend on the layout type:
   it only knows rectangles.
   ============================================================ */

const BUCKET = 512;

class GeometryStore {
  constructor() {
    this.cap = 0;
    this.count = 0;
    this.x = new Float64Array(0);
    this.y = new Float64Array(0);
    this.w = new Float64Array(0);
    this.h = new Float64Array(0);
    this.stamp = new Uint32Array(0);
    this.buckets = [];
    this.axis = 'y';
    this.contentW = 0;
    this.contentH = 0;
    this.epoch = 0;
    this._tick = 0;
  }

  setCount(n) {
    if (n > this.cap) {
      const cap = Math.max(n, (this.cap * 1.5) | 0, 64);
      for (const k of ['x', 'y', 'w', 'h']) {
        const a = new Float64Array(cap);
        a.set(this[k]);
        this[k] = a;
      }
      this.stamp = new Uint32Array(cap);
      this.cap = cap;
    }
    this.count = n;
  }

  set(i, x, y, w, h) {
    this.x[i] = x;
    this.y[i] = y;
    this.w[i] = w;
    this.h[i] = h;
  }

  rect(i, id) {
    const x = this.x[i], y = this.y[i], w = this.w[i], h = this.h[i];
    return { id, index: i, x, y, width: w, height: h, right: x + w, bottom: y + h };
  }

  buildIndex(axis) {
    this.axis = axis;
    const main = axis === 'x' ? this.contentW : this.contentH;
    const nb = Math.max(1, Math.floor(main / BUCKET) + 1);
    const buckets = new Array(nb);
    const mp = axis === 'x' ? this.x : this.y;
    const ms = axis === 'x' ? this.w : this.h;
    for (let i = 0; i < this.count; i++) {
      const a = clamp(Math.floor(mp[i] / BUCKET), 0, nb - 1);
      const b = clamp(Math.floor((mp[i] + ms[i]) / BUCKET), 0, nb - 1);
      for (let k = a; k <= b; k++) (buckets[k] || (buckets[k] = [])).push(i);
    }
    this.buckets = buckets;
  }

  /** Indexes of elements intersecting the window [m0,m1] along the main axis and [c0,c1] along the transverse axis. Sorted. */
  query(m0, m1, c0, c1, out = []) {
    out.length = 0;
    const bs = this.buckets;
    if (!bs.length || this.count === 0) return out;
    const a = clamp(Math.floor(m0 / BUCKET), 0, bs.length - 1);
    const b = clamp(Math.floor(m1 / BUCKET), 0, bs.length - 1);
    const x = this.axis === 'x';
    const mp = x ? this.x : this.y, ms = x ? this.w : this.h, cp = x ? this.y : this.x, cs = x ? this.h : this.w;
    const t = ++this._tick;
    for (let k = a; k <= b; k++) {
      const list = bs[k];
      if (!list) continue;
      for (let j = 0; j < list.length; j++) {
        const i = list[j];
        if (this.stamp[i] === t) continue;
        this.stamp[i] = t;
        if (mp[i] + ms[i] <= m0 || mp[i] >= m1) continue;
        if (cp[i] + cs[i] <= c0 || cp[i] >= c1) continue;
        out.push(i);
      }
    }
    return out.sort(byNumber);
  }

  /** The element's index at (x, y) content coordinates, or -1. */
  hitTest(px, py) {
    const bs = this.buckets;
    if (!bs.length) return -1;
    const main = this.axis === 'x' ? px : py;
    const list = bs[clamp(Math.floor(main / BUCKET), 0, bs.length - 1)];
    if (!list) return -1;
    for (let j = 0; j < list.length; j++) {
      const i = list[j];
      if (px >= this.x[i] && px < this.x[i] + this.w[i] && py >= this.y[i] && py < this.y[i] + this.h[i]) return i;
    }
    return -1;
  }
}

/* ============================================================
   6. LAYOUT ENGINE
   Layout-definition contract:
     { name, axis: 'y'|'x', responsive: 'width'|'height'|'both',
       defaults: {...}, create(options) → { compute(ctx) → {width, height, info?} } }
   ctx (see LayoutManager.makeContext) gives the layout everything you need and nothing extra:
   layout has no access to either the DOM or internal core arrays.
   ============================================================ */

const LAYOUT_CHECKPOINT = 128; // how often Masonry saves a snapshot of column heights (partial recalculation)
const pos = (v) => (isNum(v) && v > 0 ? v : 0);

const MasonryLayout = {
  name: 'masonry',
  axis: 'y',
  responsive: 'width',
  defaults: { gap: 12, gapX: null, gapY: null, columns: 0, minWidth: 180, maxWidth: 0, maxColumns: 0, itemHeight: 0, aspectRatio: 0, align: 'center' },
  create() {
    const st = { sig: '', cp: [] };
    return {
      compute(ctx) {
        const o = ctx.options;
        const W = Math.max(1, ctx.width);
        const gx = pos(o.gapX ?? o.gap), gy = pos(o.gapY ?? o.gap);
        let cols = o.columns > 0 ? Math.floor(o.columns) : Math.floor((W + gx) / (Math.max(1, o.minWidth) + gx));
        if (o.maxColumns > 0) cols = Math.min(cols, Math.floor(o.maxColumns));
        cols = Math.max(1, cols);
        let w = Math.floor((W - gx * (cols - 1)) / cols);
        if (o.maxWidth > 0 && w > o.maxWidth) w = Math.floor(o.maxWidth);
        w = Math.max(1, w);
        const total = w * cols + gx * (cols - 1);
        const offX = o.align === 'start' ? 0 : Math.max(0, Math.floor((W - total) / 2));
        const sig = [cols, w, offX, gx, gy].join('|');
        let from = ctx.from;
        if (sig !== st.sig) {
          st.sig = sig;
          st.cp = [];
          from = 0;
        }
        const K = LAYOUT_CHECKPOINT;
        let k = Math.min(Math.floor(from / K), st.cp.length - 1);
        let heights;
        if (k < 0) {
          k = 0;
          heights = new Array(cols).fill(0);
          st.cp = [heights.slice()];
        } else {
          heights = st.cp[k].slice();
          st.cp.length = k + 1;
        }
        for (let i = k * K; i < ctx.count; i++) {
          if (i % K === 0 && i > k * K) st.cp[i / K] = heights.slice();
          let c = 0;
          for (let j = 1; j < cols; j++) if (heights[j] < heights[c]) c = j;
          const h = ctx.resolveHeight(i, w, { height: o.itemHeight, aspectRatio: o.aspectRatio });
          ctx.set(i, offX + c * (w + gx), heights[c], w, h);
          heights[c] += h + gy;
        }
        const maxH = Math.max(0, ...heights);
        return { width: W, height: ctx.count ? Math.max(0, maxH - gy) : 0, info: { columns: cols, itemWidth: w, gapX: gx, gapY: gy } };
      }
    };
  }
};

const GridLayout = {
  name: 'grid',
  axis: 'y',
  responsive: 'width',
  defaults: { gap: 12, gapX: null, gapY: null, columns: 0, minWidth: 160, width: 0, maxColumns: 0, itemHeight: 0, aspectRatio: 1, align: 'start' },
  create() {
    const st = { sig: '', rows: [0] };
    return {
      compute(ctx) {
        const o = ctx.options;
        const W = Math.max(1, ctx.width);
        const gx = pos(o.gapX ?? o.gap), gy = pos(o.gapY ?? o.gap);
        let cols;
        if (o.columns > 0) cols = Math.floor(o.columns);
        else {
          const base = o.width > 0 ? o.width : Math.max(1, o.minWidth);
          cols = Math.max(1, Math.floor((W + gx) / (base + gx)));
          if (o.maxColumns > 0) cols = Math.min(cols, Math.floor(o.maxColumns));
        }
        const fit = Math.max(1, Math.floor((W - gx * (cols - 1)) / cols));
        const w = o.width > 0 ? Math.min(Math.floor(o.width), fit) : fit;
        const total = w * cols + gx * (cols - 1);
        const offX = o.align === 'center' ? Math.max(0, Math.floor((W - total) / 2)) : 0;
        const sig = [cols, w, offX, gx, gy].join('|');
        let from = ctx.from;
        if (sig !== st.sig) {
          st.sig = sig;
          st.rows = [0];
          from = 0;
        }
        const r0 = Math.min(Math.floor(from / cols), st.rows.length - 1);
        st.rows.length = r0 + 1;
        let top = st.rows[r0];
        const rows = Math.ceil(ctx.count / cols);
        for (let r = r0; r < rows; r++) {
          const s = r * cols, e = Math.min(ctx.count, s + cols);
          let rowH = 1;
          for (let i = s; i < e; i++) rowH = Math.max(rowH, ctx.resolveHeight(i, w, { height: o.itemHeight, aspectRatio: o.aspectRatio }));
          for (let i = s; i < e; i++) ctx.set(i, offX + (i - s) * (w + gx), top, w, rowH);
          top += rowH + gy;
          st.rows[r + 1] = top;
        }
        return { width: W, height: ctx.count ? top - gy : 0, info: { columns: cols, itemWidth: w, rows, gapX: gx, gapY: gy } };
      }
    };
  }
};

const JustifiedLayout = {
  name: 'justified',
  axis: 'y',
  responsive: 'width',
  defaults: { targetRowHeight: 240, minRowHeight: 150, maxRowHeight: 320, gap: 10, gapX: null, gapY: null, lastRow: 'left', defaultAspect: 1.5 },
  create() {
    const st = { sig: '', rows: [] };
    return {
      compute(ctx) {
        const o = ctx.options;
        const W = Math.max(1, ctx.width);
        const gx = pos(o.gapX ?? o.gap), gy = pos(o.gapY ?? o.gap);
        const target = Math.max(1, o.targetRowHeight);
        const minH = Math.min(target, Math.max(1, o.minRowHeight));
        const maxH = Math.max(target, o.maxRowHeight);
        const sig = [W, target, minH, maxH, gx, gy, o.lastRow, o.defaultAspect].join('|');
        let from = ctx.from;
        if (sig !== st.sig) {
          st.sig = sig;
          st.rows = [];
          from = 0;
        }
        // The last line with start <= from is recalculated (its composition may have changed).
        let r = st.rows.length;
        while (r > 0 && st.rows[r - 1].start > from) r--;
        const startRow = Math.max(0, r - 1);
        const prev = startRow > 0 ? st.rows[startRow - 1] : null;
        st.rows.length = startRow;
        let i = prev ? prev.end : 0;
        let top = prev ? prev.top + prev.h + gy : 0;
        const aspect = (j) => ctx.aspect(j) || o.defaultAspect;
        while (i < ctx.count) {
          let n = 0, sumA = 0, closed = false;
          for (let j = i; j < ctx.count; j++) {
            const a = aspect(j);
            const sumA2 = sumA + a, n2 = n + 1;
            const h2 = (W - gx * (n2 - 1)) / sumA2;
            if (h2 >= target) {
              sumA = sumA2;
              n = n2;
              continue;
            }
            if (n === 0) {
              sumA = sumA2;
              n = n2;
            } else {
              const h1 = (W - gx * (n - 1)) / sumA;
              const include = h1 > maxH ? true : h2 < minH ? false : target - h2 <= h1 - target;
              if (include) {
                sumA = sumA2;
                n = n2;
              }
            }
            closed = true;
            break;
          }
          const end = i + n;
          const fill = (W - gx * (n - 1)) / sumA;
          let h, filled = true;
          if (closed) h = fill;
          else if (o.lastRow === 'justify' && fill <= maxH) h = fill;
          else {
            h = target;
            filled = false;
          }
          h = Math.max(1, Math.round(h));
          const rowW = sumA * h + gx * (n - 1);
          let x = 0;
          if (!filled && o.lastRow === 'center') x = Math.max(0, (W - rowW) / 2);
          else if (!filled && o.lastRow === 'right') x = Math.max(0, W - rowW);
          for (let k = 0; k < n; k++) {
            const wf = aspect(i + k) * h;
            const left = Math.round(x);
            const right = k === n - 1 && filled ? W : Math.round(x + wf);
            ctx.set(i + k, left, top, Math.max(1, right - left), h);
            x += wf + gx;
          }
          st.rows.push({ start: i, end, top, h });
          top += h + gy;
          i = end;
        }
        return { width: W, height: ctx.count ? top - gy : 0, info: { rows: st.rows.length } };
      }
    };
  }
};

const BUILTIN_LAYOUTS = { masonry: MasonryLayout, grid: GridLayout, justified: JustifiedLayout };
const GLOBAL_LAYOUTS = new Map(Object.entries(BUILTIN_LAYOUTS));
const LIVE_INSTANCES = new Set(); // WeakRef on live GridInstance (to notify about new layouts)

function normalizeLayoutDefinition(name, def) {
  if (isObject(def) && isObject(def.layout)) def = def.layout; // we allow the transfer of a plugin object
  if (!isObject(def)) throw new ABI7Error(\`Layout "\${name}": definition must be an object\`, 'INVALID_LAYOUT');
  if (typeof def.create !== 'function' && typeof def.compute !== 'function') {
    throw new ABI7Error(\`Layout "\${name}": definition needs create() or compute()\`, 'INVALID_LAYOUT');
  }
  const create = typeof def.create === 'function' ? def.create : () => ({ compute: def.compute });
  return {
    name,
    axis: def.axis === 'x' ? 'x' : 'y',
    responsive: ['width', 'height', 'both'].includes(def.responsive) ? def.responsive : 'width',
    defaults: isPlain(def.defaults) ? def.defaults : {},
    create
  };
}

class LayoutRegistry {
  constructor(onChange) {
    this.local = new Map();
    this.onChange = onChange;
  }
  register(name, def) {
    if (typeof name !== 'string' || !name) throw new ABI7Error('Layout name must be a non-empty string', 'INVALID_LAYOUT');
    if (this.local.has(name)) throw new ABI7Error(\`Layout "\${name}" is already registered for this grid\`, 'LAYOUT_EXISTS');
    this.local.set(name, normalizeLayoutDefinition(name, def));
    this.onChange('register', name);
  }
  unregister(name) {
    if (this.local.delete(name)) this.onChange('unregister', name);
  }
  resolve(name) {
    return this.local.get(name) || GLOBAL_LAYOUTS.get(name) || null;
  }
  list() {
    return [...new Set([...this.local.keys(), ...GLOBAL_LAYOUTS.keys()])];
  }
}

class LayoutManager {
  constructor(inst) {
    this.inst = inst;
    this.def = null;
    this.engine = null;
    this.name = null;
    this.pending = null;
    this.options = {};
    this.info = {};
  }

  get axis() {
    return this.def ? this.def.axis : 'y';
  }
  get responsive() {
    return this.def ? this.def.responsive : 'width';
  }

  /** Creates an engine based on the current options. false — layout with this name has not yet been registered. */
  setup() {
    const name = this.inst.options.layout;
    const def = this.inst.layouts.resolve(name);
    if (!def) {
      this.def = this.engine = null;
      this.pending = name;
      return false;
    }
    this.pending = null;
    this.name = name;
    this.def = def;
    this.options = mergeOptions(def.defaults, this.inst.options.layoutOptions);
    const engine = def.create(this.options, { name });
    if (!engine || typeof engine.compute !== 'function') throw new ABI7Error(\`Layout "\${name}": create() must return { compute }\`, 'INVALID_LAYOUT');
    this.engine = engine;
    return true;
  }

  makeContext(from) {
    const inst = this.inst, geo = inst.geo, data = inst.data, pad = inst.options.padding;
    const f = inst.options.fields, v = inst.options.virtualization;
    const name = this.name, records = data.records, ids = data.ids;
    const W = Math.max(0, inst.vp.width - pad.left - pad.right);
    const H = Math.max(0, inst.vp.height - pad.top - pad.bottom);
    const aspect = (i) => {
      const r = records[i];
      const a = +readField(r, f.aspectRatio);
      if (a > 0 && isNum(a)) return clamp(a, 0.05, 20);
      const w = +readField(r, f.width), h = +readField(r, f.height);
      return w > 0 && h > 0 ? clamp(w / h, 0.05, 20) : 0;
    };
    return {
      count: data.size,
      width: W,
      height: H,
      from: clamp(from, 0, data.size),
      options: this.options,
      aspect,
      itemId: (i) => ids[i],
      itemData: (i) => records[i],
      /**
       * Unified height policy: measured → fixed from layout options →
       * aspect ratio of the entry → height of the entry in px → estimatedHeight.
       */
      resolveHeight(i, w, fixed) {
        if (v.measure) {
          const m = inst.sizeCache.get(ids[i]);
          if (m > 0) return m;
        }
        if (fixed) {
          if (fixed.height > 0) return Math.max(1, Math.round(fixed.height));
          if (fixed.aspectRatio > 0) return Math.max(1, Math.round(w / fixed.aspectRatio));
        }
        const a = aspect(i);
        if (a > 0) return Math.max(1, Math.round(w / a));
        const h = +readField(records[i], f.height);
        if (h > 0 && isNum(h)) return Math.round(h);
        return Math.round(v.estimatedHeight);
      },
      /** The geometry of an already calculated element in layout coordinates (without padding). */
      rect(i) {
        const x = geo.x[i] - pad.left, y = geo.y[i] - pad.top, width = geo.w[i], height = geo.h[i];
        return { x, y, width, height, right: x + width, bottom: y + height };
      },
      set(i, x, y, w, h) {
        if (!(isNum(x) && isNum(y) && isNum(w) && isNum(h)) || w < 0 || h < 0 || i < 0 || i >= data.size) {
          throw new ABI7Error(\`Layout "\${name}" produced invalid geometry for item \${i}\`, 'LAYOUT_INVALID');
        }
        geo.set(i, x + pad.left, y + pad.top, w, h);
      }
    };
  }

  compute(from) {
    const inst = this.inst, pad = inst.options.padding;
    inst.geo.setCount(inst.data.size);
    const ctx = this.makeContext(from);
    const res = this.engine.compute(ctx) || {};
    const cw = isNum(res.width) ? res.width : ctx.width;
    const ch = isNum(res.height) ? res.height : 0;
    inst.geo.contentW = pad.left + cw + pad.right;
    inst.geo.contentH = pad.top + ch + pad.bottom;
    this.info = isObject(res.info) ? res.info : {};
    return this.info;
  }
}

/* ============================================================
   7. VIRTUALIZATION ENGINE
   Gets the finished geometry and decides what indexes should be in the DOM.
   Doesn't know about layout or DOM.
   ============================================================ */

class VirtualizationEngine {
  constructor(inst) {
    this.inst = inst;
    this.velocity = 0; // px/ms, smoothed scroll speed
    this.direction = 1;
    this.pinned = new Map(); // id → counter (sticky elements are always in the DOM)
    this.lastOverscan = { before: 0, after: 0 };
    this._lastPos = null;
    this._lastT = 0;
    this._buf = [];
  }

  get cfg() {
    return this.inst.options.virtualization;
  }

  track(pos) {
    const t = now();
    if (this._lastPos !== null && t > this._lastT) {
      const v = (pos - this._lastPos) / (t - this._lastT);
      this.velocity = this.velocity * 0.4 + v * 0.6;
      if (v !== 0) this.direction = v > 0 ? 1 : -1;
    }
    this._lastPos = pos;
    this._lastT = t;
  }

  idle() {
    this.velocity = 0;
    this._lastPos = null;
  }

  /** Overscan in px before and after the window. Adaptive: when scrolling quickly, the stock increases in the direction of movement. */
  overscan() {
    const c = this.cfg;
    let before = c.overscan, after = c.overscan;
    if (c.adaptiveOverscan) {
      const extra = Math.min(c.maxOverscan - c.overscan, Math.abs(this.velocity) * 300);
      if (extra > 0) {
        if (this.direction > 0) after += extra;
        else before += extra;
      }
    }
    return (this.lastOverscan = { before, after });
  }

  pin(id) {
    this.pinned.set(id, (this.pinned.get(id) || 0) + 1);
  }
  unpin(id) {
    const n = (this.pinned.get(id) || 0) - 1;
    if (n > 0) this.pinned.set(id, n);
    else this.pinned.delete(id);
  }

  /** Indexes that should be mounted: window + overscan + pinned. */
  select(geo, sMain, vMain, sCross, vCross) {
    const inst = this.inst;
    let out = this._buf;
    if (!this.cfg.enabled) {
      out.length = 0;
      for (let i = 0; i < geo.count; i++) out.push(i);
    } else {
      const os = this.overscan();
      const cross = this.cfg.overscan;
      geo.query(sMain - os.before, sMain + vMain + os.after, sCross - cross, sCross + vCross + cross, out);
    }
    if (this.pinned.size) {
      for (const id of this.pinned.keys()) {
        const i = inst.data.index.get(id);
        if (i !== undefined && !out.includes(i)) out.push(i);
      }
      out.sort(byNumber);
    }
    return out;
  }

  /** Indexes that actually cross the visibility window (without overscan). */
  visible(geo, sMain, vMain, sCross, vCross) {
    return geo.query(sMain, sMain + vMain, sCross, sCross + vCross, []);
  }
}

/* ============================================================
   8. DOM RENDERER
   The only layer that creates and changes DOM elements.
   Implements DOM Pool: elements that fall out of the window are not destroyed,
   and are set aside and reused for new entries.
   ============================================================ */

class DOMRenderer {
  constructor(inst) {
    this.inst = inst;
    this.mounted = new Map(); // id → entry { id, index, el, epoch }
    this.pool = [];
    this.created = 0;
    this.reused = 0;
    this.itemClasses = new Map(); // id → Set<string> - classes assigned by plugins; are experiencing overuse
    this.sizeObserver = null;
  }

  get opts() {
    return this.inst.options;
  }

  setMeasure(on) {
    if (on && !this.sizeObserver && typeof ResizeObserver !== 'undefined') {
      this.sizeObserver = new ResizeObserver((entries) => this._onMeasure(entries));
      for (const ent of this.mounted.values()) this.sizeObserver.observe(ent.el);
    } else if (!on && this.sizeObserver) {
      this.sizeObserver.disconnect();
      this.sizeObserver = null;
      this.inst.sizeCache.clear();
    }
  }

  _onMeasure(entries) {
    const inst = this.inst;
    let min = Infinity;
    for (const e of entries) {
      const ent = e.target._abi7;
      if (!ent) continue;
      const bs = e.borderBoxSize && e.borderBoxSize[0];
      const h = Math.round(bs ? bs.blockSize : e.contentRect.height);
      if (!(h > 0) || inst.sizeCache.get(ent.id) === h) continue;
      inst.sizeCache.set(ent.id, h);
      const i = inst.data.index.get(ent.id);
      if (i !== undefined && Math.abs(h - inst.geo.h[i]) >= 1) min = Math.min(min, i);
    }
    if (min !== Infinity) inst.invalidate(min, 'measure');
  }

  _baseClass(id) {
    const o = this.opts;
    let c = 'abi7-item';
    if (o.virtualization.measure) c += ' abi7-item-auto';
    if (o.itemClassName) c += ' ' + o.itemClassName;
    const extra = this.itemClasses.get(id);
    if (extra) for (const k of extra) c += ' ' + k;
    return c;
  }

  _mount(id, index) {
    let el = this.pool.pop();
    if (el) this.reused++;
    else {
      el = this.inst.root.ownerDocument.createElement(this.opts.itemTag);
      el.setAttribute('role', 'listitem');
      this.created++;
    }
    const ent = { id, index, el, epoch: -1 };
    el._abi7 = ent;
    this.mounted.set(id, ent);
    this._bind(ent);
    this._place(ent);
    if (this.sizeObserver) this.sizeObserver.observe(el);
    return ent;
  }

  _bind(ent) {
    const { el, id, index } = ent;
    const inst = this.inst;
    const rec = inst.data.records[index];
    el.className = this._baseClass(id);
    el.setAttribute('data-index', index);
    el.setAttribute('data-id', String(id));
    const o = this.opts;
    try {
      if (typeof o.renderItem === 'function') {
        const res = o.renderItem(rec, el, { id, index });
        if (res && res.nodeType) el.replaceChildren(res);
        else if (typeof res === 'string') {
          if (o.allowHTML) el.innerHTML = res;
          else el.textContent = res;
        }
      } else this._defaultContent(el, rec, id);
    } catch (error) {
      inst.reportError({ source: 'renderItem', id, index, error });
    }
    if (inst.events.has('item:mount')) inst.events.emit('item:mount', { id, index, item: rec, element: el });
  }

  /** Standard card: <img> + signature. Everything via the DOM API and textContent - without innerHTML (XSS protection). */
  _defaultContent(el, rec, id) {
    const f = this.opts.fields;
    let box = el._abi7d;
    if (!box) {
      el.replaceChildren();
      const img = el.ownerDocument.createElement('img');
      img.className = 'abi7-media';
      img.decoding = 'async';
      img.loading = 'lazy';
      img.draggable = false;
      const cap = el.ownerDocument.createElement('div');
      cap.className = 'abi7-caption';
      el.append(img, cap);
      box = el._abi7d = { img, cap };
    }
    const src = safeUrl(readField(rec, f.src));
    const title = readField(rec, f.title);
    if (src) {
      if (box.img.getAttribute('src') !== src) box.img.setAttribute('src', src);
      const alt = readField(rec, f.alt);
      box.img.alt = alt != null ? String(alt) : title != null ? String(title) : '';
      box.img.hidden = false;
    } else {
      box.img.removeAttribute('src');
      box.img.hidden = true;
    }
    const text = title != null ? title : src ? '' : id;
    box.cap.textContent = text == null ? '' : String(text);
    box.cap.hidden = box.cap.textContent === '';
  }

  _place(ent) {
    const g = this.inst.geo, i = ent.index;
    if (ent.epoch === g.epoch || i >= g.count) return;
    const s = ent.el.style;
    s.transform = \`translate3d(\${g.x[i]}px,\${g.y[i]}px,0)\`;
    s.width = g.w[i] + 'px';
    s.height = this.opts.virtualization.measure ? '' : g.h[i] + 'px';
    ent.epoch = g.epoch;
  }

  _unmount(id) {
    const ent = this.mounted.get(id);
    if (!ent) return;
    const { el } = ent;
    const o = this.opts;
    const inst = this.inst;
    if (typeof o.releaseItem === 'function') {
      try {
        o.releaseItem(inst.data.records[inst.data.index.get(id)], el, { id, index: ent.index });
      } catch (error) {
        inst.reportError({ source: 'releaseItem', id, error });
      }
    }
    if (inst.events.has('item:unmount')) inst.events.emit('item:unmount', { id, index: ent.index, element: el });
    if (this.sizeObserver) this.sizeObserver.unobserve(el);
    el.remove();
    this.mounted.delete(id);
    el._abi7 = null;
    if (this.pool.length < o.virtualization.poolSize) this.pool.push(el);
  }

  /** Brings the DOM into alignment with a set of indexes. Returns true if something is mounted/unmounted. */
  sync(indices) {
    const data = this.inst.data;
    const want = new Set();
    for (let k = 0; k < indices.length; k++) want.add(data.ids[indices[k]]);
    let changed = false;
    for (const id of [...this.mounted.keys()]) {
      if (!want.has(id)) {
        this._unmount(id);
        changed = true;
      }
    }
    const frag = this.inst.root.ownerDocument.createDocumentFragment();
    for (let k = 0; k < indices.length; k++) {
      const i = indices[k], id = data.ids[i];
      let ent = this.mounted.get(id);
      if (!ent) {
        ent = this._mount(id, i);
        frag.appendChild(ent.el);
        changed = true;
      } else this._place(ent);
    }
    if (frag.firstChild) this.inst.container.appendChild(frag);
    return changed;
  }

  /** After insertion/removal/moving, the indexes of mounted elements may have changed. */
  reindex() {
    const data = this.inst.data;
    for (const [id, ent] of [...this.mounted]) {
      const idx = data.index.get(id);
      if (idx === undefined) {
        this._unmount(id);
        this.itemClasses.delete(id);
      } else if (idx !== ent.index) {
        ent.index = idx;
        ent.epoch = -1;
        ent.el.setAttribute('data-index', idx);
      }
    }
  }

  rebind(id) {
    const ent = this.mounted.get(id);
    if (ent) this._bind(ent);
  }

  rebindAll() {
    for (const ent of this.mounted.values()) {
      ent.epoch = -1;
      this._bind(ent);
    }
  }

  /** Full reset: unmount everything and clear the pool (change renderItem/itemTag/measure). */
  reset() {
    for (const id of [...this.mounted.keys()]) this._unmount(id);
    this.pool.length = 0;
  }

  toggleClass(id, cls, force) {
    if (typeof cls !== 'string' || !cls || /\\s/.test(cls)) throw new ABI7Error('CSS class must be a single token', 'INVALID_ARGUMENT');
    let set = this.itemClasses.get(id);
    const has = !!set && set.has(cls);
    const on = force === undefined ? !has : !!force;
    if (on) (set || this.itemClasses.set(id, (set = new Set())).get(id)).add(cls);
    else if (set) {
      set.delete(cls);
      if (!set.size) this.itemClasses.delete(id);
    }
    const ent = this.mounted.get(id);
    if (ent) ent.el.classList.toggle(cls, on);
    return on;
  }

  hasClass(id, cls) {
    const s = this.itemClasses.get(id);
    return !!s && s.has(cls);
  }

  destroy() {
    if (this.sizeObserver) this.sizeObserver.disconnect();
    this.sizeObserver = null;
    this.reset();
    this.itemClasses.clear();
  }
}

/* ============================================================
   9. ANIMATION MANAGER
   Animation is a CSS transition on transform/width/height, which
   enabled by the .abi7-animating class only for the duration of the rebuild.
   Scroll updates are never animated.
   ============================================================ */

class AnimationManager {
  constructor(inst) {
    this.inst = inst;
    this.timer = 0;
  }

  get enabled() {
    const a = this.inst.options.animation;
    if (!a.enabled || a.duration <= 0) return false;
    if (a.respectReducedMotion) {
      const win = this.inst.root.ownerDocument.defaultView;
      if (win && win.matchMedia && win.matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
    }
    return true;
  }

  applyCss() {
    const a = this.inst.options.animation, s = this.inst.root.style;
    s.setProperty('--abi7-duration', a.duration + 'ms');
    s.setProperty('--abi7-easing', a.easing);
  }

  begin() {
    const { root, container, life } = this.inst;
    root.classList.add('abi7-animating');
    void container.offsetWidth; // forced reflow: transition starts from current positions
    life.clearTimeout(this.timer);
    this.timer = life.timeout(() => root.classList.remove('abi7-animating'), this.inst.options.animation.duration + 80);
  }

  stop() {
    this.inst.life.clearTimeout(this.timer);
    this.inst.root.classList.remove('abi7-animating');
  }
}

/* ============================================================
   10. PLUGIN MANAGER
   The plugin sees only the Plugin API (api.events, api.layouts, api.features,
   api.data, api.geometry, api.viewport, api.renderer, api.options, api.lifecycle).
   Everything that the plugin has registered via the API is tracked and
   automatically cleared upon unuse() / destroy().
   ============================================================ */

const PLUGIN_NAME = /^[a-z][a-z0-9._:-]*$/i;

class PluginManager {
  constructor(inst) {
    this.inst = inst;
    this.records = new Map();
    this.features = new Map(); // feature name → { impl, owner }
  }

  static validate(plugin) {
    if (!isObject(plugin)) throw new PluginError('Plugin must be an object', 'PLUGIN_INVALID');
    const { name, version, apiVersion, install } = plugin;
    if (typeof name !== 'string' || !PLUGIN_NAME.test(name)) throw new PluginError('Plugin "name" must be a string like "selection"', 'PLUGIN_INVALID', String(name));
    if (typeof install !== 'function') throw new PluginError(\`Plugin "\${name}": install() is required\`, 'PLUGIN_INVALID', name);
    if (typeof version !== 'string' || !parseVersion(version)) throw new PluginError(\`Plugin "\${name}": "version" must be a semver string\`, 'PLUGIN_INVALID', name);
    if (typeof apiVersion !== 'string' || !apiVersion) throw new PluginError(\`Plugin "\${name}": "apiVersion" range is required\`, 'PLUGIN_INVALID', name);
    if (plugin.dependencies != null && !Array.isArray(plugin.dependencies)) throw new PluginError(\`Plugin "\${name}": "dependencies" must be an array of plugin names\`, 'PLUGIN_INVALID', name);
  }

  use(plugin, options) {
    PluginManager.validate(plugin);
    const name = plugin.name;
    if (this.records.has(name)) throw new PluginError(\`Plugin "\${name}" is already installed on this grid\`, 'PLUGIN_DUPLICATE', name);
    if (!satisfies(API_VERSION, plugin.apiVersion)) {
      throw new PluginError(\`Plugin "\${name}" requires ABI7 Grid API \${plugin.apiVersion}, but core provides \${API_VERSION}\`, 'PLUGIN_INCOMPATIBLE', name);
    }
    for (const dep of plugin.dependencies || []) {
      if (!this.records.has(dep)) throw new PluginError(\`Plugin "\${name}" requires plugin "\${dep}" to be installed first\`, 'PLUGIN_DEPENDENCY', name);
    }
    const rec = {
      name,
      plugin,

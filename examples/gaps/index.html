<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABI7 Grid — Different gaps</title>
  <link rel="stylesheet" href="../../dist/abi7-grid.css">
  <link rel="stylesheet" href="../shared/page.css">
</head>
<body>
  <!-- gap sets both axes; gapX / gapY override it per axis. -->
  <div class="toolbar">
    <label>gapX <input id="gapX" type="range" min="0" max="48" value="12"><output id="gapXOut">12</output></label>
    <label>gapY <input id="gapY" type="range" min="0" max="48" value="12"><output id="gapYOut">12</output></label>
  </div>
  <div id="gallery" class="demo-grid tall"></div>
  <div class="stats" id="stats">…</div>
  <script type="module" src="../shared/theme.js"></script>
  <script type="module" src="./demo.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABI7 Grid — First plugin (Flash)</title>
  <link rel="stylesheet" href="../../dist/abi7-grid.css">
  <link rel="stylesheet" href="./flash.css">
  <link rel="stylesheet" href="../shared/page.css">
</head>
<body>
  <!-- Click a card: the plugin highlights it for a moment. The buttons add and remove the plugin at run time. -->
  <div class="toolbar">
    <button id="remove">unuse('flash')</button>
    <button id="install">use(FlashPlugin)</button>
  </div>
  <div id="gallery" class="demo-grid tall"></div>
  <div class="stats" id="stats">Click a card.</div>

  <script type="module" src="../shared/theme.js"></script>
  <script type="module" src="./demo.js"></script>
</body>
</html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../../dist/abi7-grid.css">

</head>
<body>

    <button id="both">Add item to both grids</button>

  <div class="row">

  </div>
  <div class="log" id="log"></div>
